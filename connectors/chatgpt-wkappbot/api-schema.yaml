openapi: 3.1.0
info:
  title: WKAppBot Relay API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Relay health
  /execute:
    post:
      operationId: executeWkappbot
      requestBody:
        required: true
      responses:
        '200':
          description: Queued job
  /jobs/{id}:
    get:
      operationId: getJob
      responses:
        '200':
          description: Job state

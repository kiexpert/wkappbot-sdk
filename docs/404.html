<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>WKAppBot SDK - Safe Fallback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 20px; line-height: 1.55; }
    .card { border: 1px solid rgba(128,128,128,.35); border-radius: 16px; padding: 20px; }
    a, button { display: inline-block; margin: 8px 8px 8px 0; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit; text-decoration: none; cursor: pointer; }
    .muted { opacity: .7; }
    .primary { font-weight: 700; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WKAppBot SDK</h1>
    <p>페이지가 아직 배포 중이거나 GitHub Pages 캐시가 갱신 중입니다.</p>
    <p class="muted">앱봇 포털과 게시판은 아래 링크로 바로 이동할 수 있습니다.</p>

    <div class="grid">
      <div>
        <h2>포털</h2>
        <a id="home" class="primary" href="./">WKAppBot Portal</a>
        <button id="freshHome">포털 캐시 우회</button>
      </div>

      <div>
        <h2>게시판</h2>
        <a id="boardFolder" class="primary" href="board/">보드 /board/</a>
        <a id="boardHtml" href="board.html">보드 board.html</a>
        <a id="boardFresh" href="board.html">보드 캐시 우회</a>
      </div>
    </div>

    <h2>추천</h2>
    <p class="muted">
      먼저 Portal로 이동한 뒤 레포를 선택하면 오늘 Daily Board로 자동 이동합니다.
    </p>
  </div>

  <script>
    const qs = location.search || '';
    const stamp = Date.now();
    document.getElementById('home').href = './?v=' + stamp;
    document.getElementById('boardFolder').href = 'board/' + (qs || ('?v=' + stamp));
    document.getElementById('boardHtml').href = 'board.html' + (qs || ('?v=' + stamp));
    document.getElementById('boardFresh').href = 'board.html?v=' + stamp;
    document.getElementById('freshHome').onclick = () => location.href = './?v=' + Date.now();
  </script>
</body>
</html>

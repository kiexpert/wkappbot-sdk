<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub Login Probe</title>
<style>
body{font-family:monospace;background:#0d1117;color:#c9d1d9;padding:2rem;max-width:500px}
.result{padding:1rem;margin:1rem 0;border-radius:6px;font-size:1.1rem}
.ok{background:#0d2b1a;border-left:4px solid #3fb950;color:#3fb950}
.fail{background:#2d1b1e;border-left:4px solid #f85149;color:#f85149}
.wait{background:#161b22;border-left:4px solid #58a6ff;color:#58a6ff}
img{display:none}
</style>
</head>
<body>
<h2>🔍 GitHub Login Probe</h2>
<p>Loads contributor-only github.com URL using your browser session cookies.</p>
<div id="result" class="result wait">⏳ Probing...</div>
<p style="color:#8b949e;font-size:.85rem">URL: https://github.com/kiexpert/wkappbot-sdk/graphs/traffic</p>
<script>
const el = document.getElementById('result');
const img = new Image();
img.onload = () => {
  el.className = 'result ok';
  el.textContent = '✅ 200 — Logged in + contributor';
};
img.onerror = () => {
  el.className = 'result fail';
  el.textContent = '❌ 404 — Not logged in or not a contributor';
};
img.src = 'https://github.com/kiexpert/wkappbot-sdk/graphs/traffic?t=' + Date.now();
</script>
</body>
</html>

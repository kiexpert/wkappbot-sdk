<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WKAppBot Auth Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #111821;
      --panel-2: #0f151d;
      --line: #263241;
      --text: #d8e1ea;
      --muted: #8fa1b3;
      --green: #35d07f;
      --green-bg: #0d2a1b;
      --orange: #ffad42;
      --orange-bg: #33210b;
      --red: #ff5b6b;
      --red-bg: #351117;
      --blue: #68a7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }

    main {
      width: min(920px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .panel {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .section {
      padding: 18px;
      border-top: 1px solid var(--line);
    }

    .section:first-child {
      border-top: 0;
    }

    .state {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      background: var(--panel-2);
    }

    .state strong {
      font-size: 18px;
      letter-spacing: 0;
    }

    .state small {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .state.green {
      border-left: 4px solid var(--green);
    }

    .state.orange {
      border-left: 4px solid var(--orange);
    }

    .state.red {
      border-left: 4px solid var(--red);
    }

    .badge {
      flex: 0 0 auto;
      border: 1px solid currentColor;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      text-transform: uppercase;
    }

    .green .badge {
      color: var(--green);
      background: var(--green-bg);
    }

    .orange .badge {
      color: var(--orange);
      background: var(--orange-bg);
    }

    .red .badge {
      color: var(--red);
      background: var(--red-bg);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #080c11;
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
    }

    button,
    a.button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #172230;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      font: inherit;
      text-decoration: none;
      white-space: nowrap;
    }

    button:hover,
    a.button:hover {
      border-color: var(--blue);
    }

    .rows {
      display: grid;
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0d131a;
      padding: 10px 12px;
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid currentColor;
      font-weight: 700;
    }

    .row .label {
      overflow-wrap: anywhere;
    }

    .row .meta {
      color: var(--muted);
      overflow-wrap: anywhere;
      text-align: right;
    }

    .row.green {
      color: var(--green);
      background: var(--green-bg);
    }

    .row.orange {
      color: var(--orange);
      background: var(--orange-bg);
    }

    .row.red {
      color: var(--red);
      background: var(--red-bg);
    }

    .row.neutral {
      color: var(--muted);
    }

    .cta {
      display: none;
      margin-top: 14px;
    }

    .cta.show {
      display: inline-flex;
    }

    @media (max-width: 700px) {
      main {
        width: min(100vw - 20px, 920px);
        padding: 24px 0;
      }

      .state,
      .controls,
      .row {
        grid-template-columns: 1fr;
      }

      .state {
        display: grid;
      }

      .badge,
      .row .meta {
        justify-self: start;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>WKAppBot GitHub Auth Test</h1>
    <p>Checks <code>localStorage.gh_token</code> against the private full skill catalog.</p>

    <section class="panel" aria-live="polite">
      <div id="stateBox" class="state orange">
        <div>
          <strong id="stateText">STATE CHECKING</strong><br>
          <small id="stateDetail">Waiting for page load.</small>
        </div>
        <span id="stateBadge" class="badge">checking</span>
      </div>

      <div class="section">
        <div class="controls">
          <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="GitHub PAT">
          <button id="saveBtn" type="button">Save</button>
          <button id="clearBtn" type="button">Clear Token</button>
        </div>
      </div>

      <div class="section">
        <div id="rows" class="rows"></div>
        <a id="upgradeCta" class="button cta" href="https://github.com/sponsors/kiexpert" target="_blank" rel="noreferrer">Upgrade</a>
      </div>
    </section>
  </main>

  <script>
    const TOKEN_KEY = "gh_token";
    const FULL_DATA_URL = "https://raw.githubusercontent.com/kiexpert/wkappbot-harness/main/skills-data-full.js";

    const rows = document.getElementById("rows");
    const stateBox = document.getElementById("stateBox");
    const stateText = document.getElementById("stateText");
    const stateDetail = document.getElementById("stateDetail");
    const stateBadge = document.getElementById("stateBadge");
    const tokenInput = document.getElementById("tokenInput");
    const saveBtn = document.getElementById("saveBtn");
    const clearBtn = document.getElementById("clearBtn");
    const upgradeCta = document.getElementById("upgradeCta");

    function rowClass(kind) {
      if (kind === "pass") return "green";
      if (kind === "warn") return "orange";
      if (kind === "fail") return "red";
      return "neutral";
    }

    function rowMark(kind) {
      if (kind === "pass") return "✓";
      if (kind === "warn") return "!";
      if (kind === "fail") return "x";
      return "-";
    }

    function setRows(items) {
      rows.replaceChildren(...items.map((item) => {
        const el = document.createElement("div");
        el.className = `row ${rowClass(item.kind)}`;
        el.innerHTML = `
          <span class="mark">${rowMark(item.kind)}</span>
          <span class="label"></span>
          <span class="meta"></span>
        `;
        el.querySelector(".label").textContent = item.label;
        el.querySelector(".meta").textContent = item.meta || "";
        return el;
      }));
    }

    function setState(kind, text, detail, badge) {
      stateBox.className = `state ${kind}`;
      stateText.textContent = text;
      stateDetail.textContent = detail;
      stateBadge.textContent = badge;
      upgradeCta.classList.toggle("show", text.includes("NOT SUBSCRIBER"));
    }

    function fileSize(bytes) {
      if (!Number.isFinite(bytes)) return "unknown size";
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    function getToken() {
      return (localStorage.getItem(TOKEN_KEY) || "").trim();
    }

    async function runAuthCheck(source = "load") {
      const token = getToken();
      tokenInput.value = token;

      if (!token) {
        setState("orange", "STATE NO-TOKEN", "No token found in localStorage.gh_token.", "no-token");
        setRows([
          { kind: "pass", label: "Page loaded", meta: source },
          { kind: "warn", label: "Read localStorage.gh_token", meta: "missing" },
          { kind: "neutral", label: "Fetch private skills-data-full.js", meta: "skipped" }
        ]);
        return;
      }

      setState("orange", "STATE CHECKING", "Token found. Fetching private catalog.", "checking");
      setRows([
        { kind: "pass", label: "Page loaded", meta: source },
        { kind: "pass", label: "Read localStorage.gh_token", meta: "present" },
        { kind: "neutral", label: "Fetch private skills-data-full.js", meta: "pending" }
      ]);

      try {
        const response = await fetch(FULL_DATA_URL, {
          cache: "no-store",
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github.raw, text/plain, */*"
          }
        });

        if (response.status === 200) {
          const text = await response.text();
          const size = new Blob([text]).size;
          setState("green", "STATE SUBSCRIBER UNLOCKED", `HTTP 200. Full data loaded, ${fileSize(size)}.`, "unlocked");
          setRows([
            { kind: "pass", label: "Page loaded", meta: source },
            { kind: "pass", label: "Read localStorage.gh_token", meta: "present" },
            { kind: "pass", label: "Fetch private skills-data-full.js", meta: `HTTP 200, ${fileSize(size)}` }
          ]);
          return;
        }

        if (response.status === 404) {
          setState("orange", "STATE NOT SUBSCRIBER", "HTTP 404. Token works, but private catalog is not accessible.", "upgrade");
          setRows([
            { kind: "pass", label: "Page loaded", meta: source },
            { kind: "pass", label: "Read localStorage.gh_token", meta: "present" },
            { kind: "warn", label: "Fetch private skills-data-full.js", meta: "HTTP 404" }
          ]);
          return;
        }

        if (response.status === 401) {
          setState("red", "STATE INVALID TOKEN", "HTTP 401. Clear the token or save a valid PAT.", "invalid");
          setRows([
            { kind: "pass", label: "Page loaded", meta: source },
            { kind: "pass", label: "Read localStorage.gh_token", meta: "present" },
            { kind: "fail", label: "Fetch private skills-data-full.js", meta: "HTTP 401" }
          ]);
          return;
        }

        setState("red", "STATE FETCH ERROR", `Unexpected HTTP ${response.status}.`, "error");
        setRows([
          { kind: "pass", label: "Page loaded", meta: source },
          { kind: "pass", label: "Read localStorage.gh_token", meta: "present" },
          { kind: "fail", label: "Fetch private skills-data-full.js", meta: `HTTP ${response.status}` }
        ]);
      } catch (error) {
        setState("red", "STATE FETCH ERROR", error.message || String(error), "error");
        setRows([
          { kind: "pass", label: "Page loaded", meta: source },
          { kind: "pass", label: "Read localStorage.gh_token", meta: "present" },
          { kind: "fail", label: "Fetch private skills-data-full.js", meta: error.message || String(error) }
        ]);
      }
    }

    saveBtn.addEventListener("click", () => {
      const token = tokenInput.value.trim();
      if (token) {
        localStorage.setItem(TOKEN_KEY, token);
      } else {
        localStorage.removeItem(TOKEN_KEY);
      }
      runAuthCheck("save");
    });

    clearBtn.addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      tokenInput.value = "";
      runAuthCheck("clear");
    });

    window.addEventListener("message", (event) => {
      let data = event.data || {};
      if (typeof data === "string") {
        try {
          data = JSON.parse(data);
        } catch {
          data = {};
        }
      }

      if (data.type !== "auth") return;

      const token = String(data.token || data.gh_token || "").trim();
      if (token) {
        localStorage.setItem(TOKEN_KEY, token);
        tokenInput.value = token;
      }

      runAuthCheck("postMessage auth");
    });

    window.addEventListener("load", () => runAuthCheck("load"));
  </script>
</body>
</html>

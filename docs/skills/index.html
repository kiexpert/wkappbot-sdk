<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WKAppBot Skills</title>
  <meta name="description" content="443 live AI automation playbooks. Browse the skill library.">
  <link rel="canonical" href="https://kiexpert.github.io/wkappbot-sdk/skills/">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07090d; color: #f4f7fb; }
    .layout { display: flex; height: 100vh; }
    .sidebar { width: 280px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,.1); overflow-y: auto; background: #101722; display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .sidebar-header a { font-size: 11px; color: #a8b2c2; text-decoration: none; }
    .sidebar-header h1 { font-size: 15px; font-weight: 800; margin: 6px 0 2px; }
    .sidebar-header p { font-size: 11px; color: #a8b2c2; }
    #nav-search { width: 100%; margin: 8px 0 0; padding: 6px 10px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; color: #f4f7fb; font-size: 12px; }
    #nav-search::placeholder { color: #a8b2c2; }
    .nav-tree { flex: 1; padding: 8px 0; }
    .nav-app details { }
    .nav-app summary { padding: 6px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #a8b2c2; cursor: pointer; list-style: none; user-select: none; }
    .nav-app summary:hover { color: #f4f7fb; background: rgba(255,255,255,.04); }
    .nav-app ul { list-style: none; }
    .nav-app li a { display: block; padding: 4px 16px 4px 24px; font-size: 12px; color: #a8b2c2; text-decoration: none; border-left: 2px solid transparent; }
    .nav-app li a:hover { color: #f4f7fb; background: rgba(255,255,255,.04); }
    .nav-app li a.active { color: #6ee7b7; border-left-color: #6ee7b7; background: rgba(110,231,183,.06); }
    .content-frame { flex: 1; border: none; background: #07090d; }
    @media (max-width: 600px) { .sidebar { width: 200px; } }
  </style>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">
        <a href="../">&#8592; WKAppBot</a>
        <h1>Skills</h1>
        <p>443 playbooks across 8 apps</p>
        <input id="nav-search" type="search" placeholder="Search skills...">
      </div>
      <div class="nav-tree" id="nav-tree">
        <div class="nav-app"><details open><summary>wkappbot-sdk</summary><ul id="app-wkappbot-sdk"></ul></details></div>
        <div class="nav-app"><details><summary>wkappbot-workflow</summary><ul id="app-wkappbot-workflow"></ul></details></div>
        <div class="nav-app"><details><summary>wkappbot-core</summary><ul id="app-wkappbot-core"></ul></details></div>
        <div class="nav-app"><details><summary>wkappbot</summary><ul id="app-wkappbot"></ul></details></div>
        <div class="nav-app"><details><summary>wkappbot-webbot</summary><ul id="app-wkappbot-webbot"></ul></details></div>
        <div class="nav-app"><details><summary>wkappbot-win32</summary><ul id="app-wkappbot-win32"></ul></details></div>
        <div class="nav-app"><details><summary>wkappbot-test</summary><ul id="app-wkappbot-test"></ul></details></div>
        <div class="nav-app"><details><summary>wkappbot-debug</summary><ul id="app-wkappbot-debug"></ul></details></div>
      </div>
    </nav>
    <iframe class="content-frame" id="content" name="content" src="wkappbot-sdk/sonnet-reflection.html" title="Skill content"></iframe>
  </div>
  <script>
    // Load skills index from each app's index.html links
    // Navigation: clicking sidebar links loads skill in iframe
    var apps = ['wkappbot-sdk','wkappbot-workflow','wkappbot-core','wkappbot','wkappbot-webbot','wkappbot-win32','wkappbot-test','wkappbot-debug'];
    apps.forEach(function(app) {
      fetch(app + '/index.html').then(function(r){return r.text();}).then(function(html){
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');
        var links = doc.querySelectorAll('a[href$=".html"]');
        var ul = document.getElementById('app-' + app);
        if (!ul) return;
        links.forEach(function(a) {
          if (a.href.includes('index.html')) return;
          var li = document.createElement('li');
          var link = document.createElement('a');
          link.href = app + '/' + a.getAttribute('href');
          link.textContent = a.textContent.trim();
          link.target = 'content';
          link.onclick = function() {
            document.querySelectorAll('.nav-app li a').forEach(function(x){x.classList.remove('active');});
            link.classList.add('active');
          };
          li.appendChild(link);
          ul.appendChild(li);
        });
      }).catch(function(){});
    });
    // Search filter
    document.getElementById('nav-search').addEventListener('input', function() {
      var q = this.value.toLowerCase();
      document.querySelectorAll('.nav-app li').forEach(function(li) {
        var show = !q || li.textContent.toLowerCase().includes(q);
        li.style.display = show ? '' : 'none';
      });
    });
  </script>
</body>
</html>

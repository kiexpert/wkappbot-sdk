<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- i.copy.sh refuses a hotlinked Referer with 403 and serves the same ISO with ACAO * when no Referer is sent (measured 2026-11-01). -->
<meta name="referrer" content="no-referrer">
<title>WebVM</title>
<meta name="description" content="A Linux PC in the browser (v86, i686). Keys typed here go straight to its console.">
<style>
:root{--bg:#05070a;--bar:#10151c;--line:#232b36;--fg:#d7e0ea;--dim:#7d8a99;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--term:#000;--termfg:#c8f7c5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;height:28px;display:flex;align-items:center;gap:14px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:var(--bar);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
#bar b{color:var(--fg)} #bar .sp{flex:1} #bar span{color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:middle}
.dot.ready{background:var(--ok)} .dot.fail{background:var(--bad)}
#bar a{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:1px 8px} #bar a:hover{color:var(--fg)}
#screen{position:fixed;top:28px;left:0;right:0;bottom:0;background:var(--term);color:var(--termfg);overflow:auto;cursor:text;outline:none}
#screen > div{white-space:pre;padding:6px 8px;font:14px/1.2 ui-monospace,Menlo,Consolas,monospace} #screen canvas{display:none}
</style>
</head>
<body>
<div id="bar"><span class="dot" id="dot"></span><b>WebVM</b><span id="state">부팅 준비</span><span>Linux · i686 · v86</span><span id="up"></span><span class="sp"></span><span>키 입력은 바로 콘솔로 가요</span><a href="./qa.html">QA</a></div>
<div id="screen" tabindex="0"><div></div><canvas></canvas></div>
<script>
"use strict";
// The machine page: a real Linux kernel in this tab and a one-line status bar, nothing else.
// A same-origin parent (the QA page) drives it with postMessage: vm.send types into the console, vm.rows reads the screen.
const V86 = { base: "https://cdn.jsdelivr.net/npm/v86@0.5.473/build/", bios: "https://raw.githubusercontent.com/copy/v86/master/bios/", image: "https://i.copy.sh/linux4.iso" };
let emu = null, state = "booting", t0 = Date.now();
const $ = id => document.getElementById(id);
function rows() { return [...document.querySelectorAll("#screen > div > div")].map(d => d.textContent.replace(/\s+$/, "")); }
function setState(s, txt) { state = s; $("state").textContent = txt; $("dot").className = "dot" + (s === "ready" ? " ready" : s === "failed" ? " fail" : ""); post({ type: "vm.state", state }); }
function post(m) { if (window.parent !== window) window.parent.postMessage(m, location.origin); }
function send(text) { if (emu) emu.keyboard_send_text(String(text)); }
setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); $("up").textContent = `up ${Math.floor(s / 60)}m ${s % 60}s`; }, 1000);
function boot() {
  const s = document.createElement("script"); s.src = V86.base + "libv86.js";
  s.onerror = () => setState("failed", "libv86.js 로드 실패");
  s.onload = () => {
    try {
      emu = new window.V86({ wasm_path: V86.base + "v86.wasm", memory_size: 64 * 1024 * 1024, vga_memory_size: 2 * 1024 * 1024, screen_container: $("screen"), bios: { url: V86.bios + "seabios.bin" }, vga_bios: { url: V86.bios + "vgabios.bin" }, cdrom: { url: V86.image }, autostart: true });
      window.__vm = emu;
      emu.add_listener("emulator-started", () => setState("booting", "커널 부팅 중"));
      const poll = setInterval(() => {
        if (rows().some(r => /~[%#$]/.test(r))) { clearInterval(poll); setState("ready", "셸 준비됨"); $("screen").focus(); }
        else if (Date.now() - t0 > 120000) { clearInterval(poll); setState("failed", "120초 안에 셸이 안 떴어요"); }
      }, 500);
    } catch (e) { setState("failed", String(e.message || e)); }
  };
  document.head.appendChild(s);
}
addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || typeof e.data !== "object") return;
  const m = e.data;
  if (m.type === "vm.send") { send(m.text); e.source.postMessage({ type: "vm.sent", id: m.id }, e.origin); }
  else if (m.type === "vm.rows") e.source.postMessage({ type: "vm.rows", id: m.id, state, rows: rows() }, e.origin);
});
$("screen").addEventListener("click", () => $("screen").focus());
window.WebVM = { send, rows, get state() { return state; } };
boot();
</script>
</body>
</html>

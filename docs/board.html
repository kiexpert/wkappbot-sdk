<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>WKAppBot Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; max-width: 920px; margin: 0 auto; padding: 24px; line-height: 1.55; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; }
    .muted { opacity: .7; }
    .card { border: 1px solid rgba(128,128,128,.35); border-radius: 16px; padding: 18px; margin: 14px 0; box-shadow: 0 8px 24px rgba(0,0,0,.06); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button, a.button { border: 1px solid rgba(128,128,128,.35); border-radius: 999px; padding: 10px 14px; text-decoration: none; color: inherit; background: transparent; cursor: pointer; }
    button:hover, a.button:hover { background: rgba(128,128,128,.12); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; vertical-align: middle; margin-right: 8px; }
    .comment { border-left: 4px solid rgba(128,128,128,.35); padding-left: 14px; margin: 18px 0; }
    .body { white-space: pre-wrap; }
    #status { margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>WKAppBot Daily Board</h1>
      <div id="status" class="muted">불러오는 중...</div>
    </div>
    <div class="row">
      <button id="reload">새로고침</button>
      <a id="openIssue" class="button" href="https://github.com/kiexpert/wkappbot-sdk/issues/21" target="_blank">댓글 쓰기</a>
    </div>
  </header>

  <section id="issueCard" class="card"></section>
  <section class="card">
    <h2>댓글</h2>
    <div id="comments"></div>
  </section>

  <script>
    const repo = 'kiexpert/wkappbot-sdk';
    const issueNumber = 21;
    const issueUrl = `https://github.com/${repo}/issues/${issueNumber}`;
    const apiBase = `https://api.github.com/repos/${repo}/issues/${issueNumber}`;
    const $ = id => document.getElementById(id);

    $('openIssue').href = issueUrl;

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function fmtTime(s) {
      try { return new Date(s).toLocaleString(); } catch (_) { return s || ''; }
    }

    async function loadBoard() {
      $('status').textContent = '불러오는 중...';
      $('comments').innerHTML = '';

      const issueRes = await fetch(apiBase, { headers: { 'accept': 'application/vnd.github+json' } });
      if (!issueRes.ok) throw new Error('issue load failed: ' + issueRes.status);
      const issue = await issueRes.json();

      $('issueCard').innerHTML = `
        <div class="row">
          <img class="avatar" src="${esc(issue.user && issue.user.avatar_url)}" alt="">
          <strong>${esc(issue.user && issue.user.login)}</strong>
          <span class="muted">${fmtTime(issue.created_at)}</span>
          <span class="muted">#${issue.number}</span>
        </div>
        <h2>${esc(issue.title)}</h2>
        <div class="body">${esc(issue.body)}</div>
      `;

      const commentsRes = await fetch(apiBase + '/comments', { headers: { 'accept': 'application/vnd.github+json' } });
      if (!commentsRes.ok) throw new Error('comments load failed: ' + commentsRes.status);
      const comments = await commentsRes.json();

      if (!comments.length) {
        $('comments').innerHTML = '<p class="muted">아직 댓글이 없습니다. GitHub에서 첫 댓글을 남겨보세요.</p>';
      } else {
        $('comments').innerHTML = comments.map(c => `
          <article class="comment">
            <div class="row">
              <img class="avatar" src="${esc(c.user && c.user.avatar_url)}" alt="">
              <strong>${esc(c.user && c.user.login)}</strong>
              <span class="muted">${fmtTime(c.created_at)}</span>
            </div>
            <div class="body">${esc(c.body)}</div>
          </article>
        `).join('');
      }

      $('status').textContent = `업데이트됨: ${new Date().toLocaleString()} · 댓글 ${comments.length}개`;
    }

    $('reload').onclick = () => loadBoard().catch(err => $('status').textContent = err.message);
    loadBoard().catch(err => $('status').textContent = err.message);
  </script>
</body>
</html>

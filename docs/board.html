<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WKAppBot Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; max-width: 860px; margin: 32px auto; padding: 16px; }
    input, button { padding: 10px; margin: 6px 0; }
    input { width: 100%; box-sizing: border-box; }
    pre { background: #f4f4f4; padding: 12px; overflow: auto; white-space: pre-wrap; }
    a { display: inline-block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>WKAppBot Daily Board</h1>
  <p>GitHub Issues are used as posts. Issue comments are used as replies.</p>

  <label>Repository</label>
  <input id="repo" value="kiexpert/wkappbot-sdk">

  <label>Issue number</label>
  <input id="issue" value="21">

  <button id="load">Load issue and comments</button>
  <a id="openIssue" href="https://github.com/kiexpert/wkappbot-sdk/issues/21" target="_blank">Open on GitHub to comment</a>

  <h2>Issue</h2>
  <pre id="issueOut"></pre>

  <h2>Comments</h2>
  <pre id="commentsOut"></pre>

  <script>
    const $ = id => document.getElementById(id);

    async function loadBoard() {
      const repo = $('repo').value.trim();
      const num = $('issue').value.trim();
      $('openIssue').href = `https://github.com/${repo}/issues/${num}`;

      const issueRes = await fetch(`https://api.github.com/repos/${repo}/issues/${num}`);
      const issue = await issueRes.json();
      $('issueOut').textContent = JSON.stringify({
        title: issue.title,
        user: issue.user && issue.user.login,
        state: issue.state,
        created_at: issue.created_at,
        body: issue.body
      }, null, 2);

      const commentsRes = await fetch(`https://api.github.com/repos/${repo}/issues/${num}/comments`);
      const comments = await commentsRes.json();
      $('commentsOut').textContent = JSON.stringify(comments.map(c => ({
        user: c.user && c.user.login,
        created_at: c.created_at,
        body: c.body
      })), null, 2);
    }

    $('load').onclick = loadBoard;
    loadBoard().catch(err => $('commentsOut').textContent = String(err));
  </script>
</body>
</html>

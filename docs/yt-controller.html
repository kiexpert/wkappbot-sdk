<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YT Controller</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#eee;font-family:sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* 홈 화면 */
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:24px;padding:20px}
#home h1{font-size:32px;color:#f00;letter-spacing:-1px}
#home h1 span{color:#eee}
#searchBox{display:flex;width:100%;max-width:640px;gap:0}
#searchInput{flex:1;padding:14px 20px;font-size:16px;border:2px solid #333;border-right:none;border-radius:24px 0 0 24px;background:#1a1a1a;color:#eee;outline:none}
#searchInput:focus{border-color:#f00}
#searchBtn{padding:14px 24px;background:#f00;color:#fff;border:none;border-radius:0 24px 24px 0;font-size:18px;cursor:pointer}
#searchBtn:hover{background:#c00}
.hint{color:#555;font-size:13px}

/* 플레이어 화면 */
#playerView{display:none;flex-direction:column;height:100vh}
#bar{display:flex;gap:6px;padding:6px 8px;background:#111;align-items:center;flex-shrink:0}
#urlIn{flex:1;padding:6px 12px;border-radius:16px;border:none;background:#2a2a2a;color:#eee;font-size:13px;outline:none}
#urlIn:focus{background:#333}
#goBtn{padding:6px 14px;border-radius:16px;border:none;background:#f00;color:#fff;font-weight:bold;cursor:pointer;font-size:12px}
#status{padding:2px 10px;font-size:11px;background:#0a0a0a;color:#666;flex-shrink:0;line-height:20px;min-height:20px}
#status.ok{color:#0c0}
#status.warn{color:#f80}
#status.ad{color:#f00;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.3}}
#wrap{flex:1;position:relative;min-height:0}
#wrap iframe,#wrap>div{width:100%!important;height:100%!important}
#badge{position:absolute;top:6px;left:6px;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:bold;display:none;pointer-events:none;z-index:9}
#btns{display:flex;gap:4px;padding:4px 8px;background:#111;flex-shrink:0;flex-wrap:wrap;align-items:center}
#btns button{padding:4px 10px;border-radius:4px;border:none;background:#222;color:#ccc;cursor:pointer;font-size:11px}
#btns button:hover{background:#444}
#btns button.r{background:#600}
#btns button.r:hover{background:#900}
#ti{margin-left:auto;font-size:11px;color:#555}
</style>
</head>
<body>

<div id="home">
  <h1>▶ YT <span>Controller</span></h1>
  <div id="searchBox">
    <input id="searchInput" placeholder="YouTube URL 또는 영상 ID 입력..." autofocus>
    <button id="searchBtn" onclick="goHome()">→</button>
  </div>
  <span class="hint">유튜브 URL, 영상 ID, Shorts URL 모두 지원</span>
</div>

<div id="playerView">
  <div id="bar">
    <input id="urlIn" placeholder="URL 또는 영상 ID...">
    <button id="goBtn" onclick="loadFromBar()">▶</button>
    <button onclick="showHome()" style="background:#333;border:none;color:#888;cursor:pointer;padding:4px 8px;border-radius:12px;font-size:11px">⌂</button>
  </div>
  <div id="status"></div>
  <div id="wrap">
    <div id="player"></div>
    <div id="badge"></div>
  </div>
  <div id="btns">
    <button onclick="player&&player.playVideo()">▶</button>
    <button onclick="player&&player.pauseVideo()">⏸</button>
    <button onclick="player&&player.mute()">🔇</button>
    <button onclick="player&&player.unMute()">🔊</button>
    <button class="r" onclick="skipAd()">⏭ 스킵</button>
    <button onclick="reloadSafe()">🔄</button>
    <span id="ti">--:-- / --:--</span>
  </div>
</div>

<script>
var player,videoId,videoDur=0,lastGoodTime=0,adSkipCount=0,checkTimer,reloading=false;
var origin=location.protocol==='file:'?'https://kiexpert.github.io':'https://'+location.host;

// YouTube IFrame API
var s=document.createElement('script');
s.src='https://www.youtube.com/iframe_api';
document.head.appendChild(s);

window.onYouTubeIframeAPIReady=function(){
  var qv=new URLSearchParams(location.search).get('v');
  if(qv){document.getElementById('searchInput').value=qv;loadVideo(qv);}
};

function getId(input){
  input=(input||'').trim();
  var m=input.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
  return null;
}

function goHome(){
  var id=getId(document.getElementById('searchInput').value);
  if(id) loadVideo(id);
}

function loadFromBar(){
  var id=getId(document.getElementById('urlIn').value);
  if(id) loadVideo(id);
}

function showHome(){
  document.getElementById('playerView').style.display='none';
  document.getElementById('home').style.display='flex';
  if(checkTimer) clearInterval(checkTimer);
}

function loadVideo(id){
  if(!id) return;
  videoId=id; videoDur=0; lastGoodTime=0; adSkipCount=0; reloading=false;
  document.getElementById('home').style.display='none';
  document.getElementById('playerView').style.display='flex';
  document.getElementById('urlIn').value='https://youtu.be/'+id;
  setStatus('로딩 중... '+id);
  if(player&&player.loadVideoById){
    player.loadVideoById({videoId:id,startSeconds:0});
    videoDur=0;
    waitDur();
  } else {
    if(player) try{player.destroy()}catch(e){}
    player=new YT.Player('player',{
      height:'100%',width:'100%',
      videoId:id,
      playerVars:{autoplay:1,rel:0,modestbranding:1,enablejsapi:1,origin:origin,playsinline:1},
      events:{onReady:function(e){waitDur();},onStateChange:onSC,onError:onErr}
    });
  }
}

function waitDur(){
  var n=0;
  var t=setInterval(function(){
    if(!player) return clearInterval(t);
    var d=player.getDuration();
    if(d>0){clearInterval(t);onDurReady(d);}
    if(++n>20) clearInterval(t);
  },400);
}

function onDurReady(d){
  videoDur=d;
  player.loadVideoById({videoId:videoId,startSeconds:0,endSeconds:Math.floor(d-0.1)});
  setStatus('✅ 끝광고 차단 (end='+Math.floor(d-0.1)+'s)  '+fmt(d),'ok');
  startMon();
}

function onSC(e){if(e.data===0) setStatus('영상 종료','warn');}
function onErr(e){var m={2:'잘못된 ID',101:'임베드 불가',150:'임베드 불가'};setStatus('오류: '+(m[e.data]||e.data),'warn');}

function startMon(){
  if(checkTimer) clearInterval(checkTimer);
  checkTimer=setInterval(function(){
    if(!player||!player.getCurrentTime) return;
    try{
      var t=player.getCurrentTime(),d=player.getDuration(),st=player.getPlayerState();
      document.getElementById('ti').textContent=fmt(t)+' / '+fmt(d);
      if(st===1&&t>1&&!isAd(d)){lastGoodTime=t;}
      if(isAd(d)){
        badge('⚠ 광고','#900');
        setStatus('🚨 광고! last='+fmt(lastGoodTime)+' #'+(adSkipCount+1),'ad');
        if(!reloading){reloading=true;setTimeout(skipAd,300);}
      } else {badge('');reloading=false;}
    }catch(e){}
  },1000);
}

function isAd(d){return videoDur>0&&d>0&&d<videoDur*0.8&&d<600;}

function skipAd(){
  adSkipCount++;
  var d=player.getDuration();
  if(d>0&&d<videoDur*0.8){player.seekTo(d,true);setStatus('⏭ seekTo '+fmt(d),'warn');setTimeout(function(){reloading=false;},2000);}
  else reloadSafe();
}

function reloadSafe(){
  if(!videoId||!videoDur) return;
  var st=Math.max(0,lastGoodTime+0.1);
  player.loadVideoById({videoId:videoId,startSeconds:st,endSeconds:Math.floor(videoDur-0.1)});
  setStatus('🔄 t='+fmt(st)+' end='+fmt(videoDur-0.1),'warn');
  setTimeout(function(){reloading=false;},3000);
}

function badge(t,c){var b=document.getElementById('badge');if(!t){b.style.display='none';return;}b.style.display='block';b.style.background=c;b.style.color='#fff';b.textContent=t;}
function setStatus(m,c){var e=document.getElementById('status');e.textContent=m;e.className=c||'';}
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);}

document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')goHome();});
document.getElementById('urlIn').addEventListener('keydown',function(e){if(e.key==='Enter')loadFromBar();});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Controller</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#eee;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
#toolbar{display:flex;gap:8px;padding:8px;background:#1a1a1a;align-items:center;flex-shrink:0}
#urlInput{flex:1;padding:8px 12px;border-radius:20px;border:none;background:#333;color:#eee;font-size:14px;outline:none}
#urlInput:focus{background:#444}
#loadBtn{padding:8px 16px;border-radius:20px;border:none;background:#f00;color:#fff;font-weight:bold;cursor:pointer}
#loadBtn:hover{background:#c00}
#status{padding:4px 12px;font-size:12px;background:#111;color:#888;border-bottom:1px solid #222;flex-shrink:0;min-height:22px;line-height:22px}
#status.ok{color:#0f0}
#status.warn{color:#f80}
#status.ad{color:#f00;font-weight:bold;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.4}}
#playerWrap{flex:1;position:relative;background:#000;min-height:0}
#playerWrap iframe,#playerWrap>div{width:100%!important;height:100%!important}
#badge{position:absolute;top:8px;left:8px;padding:4px 10px;border-radius:4px;font-size:13px;font-weight:bold;display:none;z-index:10;pointer-events:none}
#controls{display:flex;gap:6px;padding:6px 8px;background:#1a1a1a;align-items:center;flex-shrink:0;flex-wrap:wrap}
#controls button{padding:5px 12px;border-radius:4px;border:none;background:#333;color:#eee;cursor:pointer;font-size:12px}
#controls button:hover{background:#555}
#controls button.red{background:#800}
#controls button.red:hover{background:#b00}
#timeInfo{margin-left:auto;font-size:12px;color:#888;white-space:nowrap}
#adInfo{font-size:11px;color:#f80;padding:0 4px}
</style>
</head>
<body>
<div id="toolbar">
  <input id="urlInput" placeholder="YouTube URL 또는 영상 ID 입력..." value="">
  <button id="loadBtn" onclick="loadVideo()">▶ 로드</button>
</div>
<div id="status">YouTube API 로딩 중...</div>
<div id="playerWrap">
  <div id="player"></div>
  <div id="badge"></div>
</div>
<div id="controls">
  <button onclick="player&&player.playVideo()">▶ 재생</button>
  <button onclick="player&&player.pauseVideo()">⏸ 정지</button>
  <button onclick="player&&player.mute()">🔇 음소거</button>
  <button onclick="player&&player.unMute()">🔊 음소거해제</button>
  <button class="red" onclick="skipAd()">⏭ 광고스킵</button>
  <button onclick="reloadSafe()">🔄 안전리로드</button>
  <span id="adInfo"></span>
  <span id="timeInfo">--:-- / --:--</span>
</div>

<script>
var player, videoId, videoDur=0, lastGoodTime=0, adSkipCount=0, checkTimer, reloading=false;
var origin=location.protocol==='file:'?'https://kiexpert.github.io':'https://'+location.host;

// YouTube IFrame API 로드
var tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady=function(){
  setStatus('준비됨 — URL 또는 영상 ID를 입력하세요','ok');
  var qv=new URLSearchParams(location.search).get('v');
  if(qv){document.getElementById('urlInput').value=qv;loadVideo();}
};

function getIdFromUrl(input){
  input=(input||'').trim();
  var m=input.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
  return null;
}

function loadVideo(){
  var id=getIdFromUrl(document.getElementById('urlInput').value);
  if(!id){setStatus('유효한 YouTube URL 또는 영상 ID를 입력하세요','warn');return;}
  videoId=id; videoDur=0; lastGoodTime=0; adSkipCount=0; reloading=false;
  setStatus('로딩 중... '+id);
  if(player&&player.loadVideoById){
    player.loadVideoById({videoId:id,startSeconds:0});
    videoDur=0;
    var waitDur=setInterval(function(){
      if(!player) return clearInterval(waitDur);
      var d=player.getDuration();
      if(d>0){clearInterval(waitDur);onDurationReady(d);}
    },500);
  } else {
    if(player) try{player.destroy()}catch(e){}
    player=new YT.Player('player',{
      height:'100%',width:'100%',
      videoId:id,
      playerVars:{autoplay:1,rel:0,modestbranding:1,enablejsapi:1,origin:origin,playsinline:1},
      events:{onReady:function(e){
        var waitDur=setInterval(function(){
          var d=e.target.getDuration();
          if(d>0){clearInterval(waitDur);onDurationReady(d);}
        },300);
      }, onStateChange:onStateChange, onError:onError}
    });
  }
}

function onDurationReady(d){
  videoDur=d;
  // embed는 endSeconds 파라미터로 끝광고 차단
  player.loadVideoById({videoId:videoId,startSeconds:0,endSeconds:Math.floor(d-0.1)});
  setStatus('✅ 끝광고 차단 (end='+Math.floor(d-0.1)+'s) | '+videoId+' '+fmt(d),'ok');
  startMonitor();
}

function onStateChange(e){
  if(e.data===YT.PlayerState.ENDED) setStatus('영상 종료','warn');
}

function onError(e){
  var msgs={2:'잘못된 영상 ID',5:'HTML5 오류',100:'영상 없음',101:'임베드 불가',150:'임베드 불가'};
  setStatus('오류: '+(msgs[e.data]||e.data),'warn');
}

function startMonitor(){
  if(checkTimer) clearInterval(checkTimer);
  checkTimer=setInterval(function(){
    if(!player||!player.getCurrentTime) return;
    try{
      var t=player.getCurrentTime();
      var d=player.getDuration();
      var state=player.getPlayerState();
      document.getElementById('timeInfo').textContent=fmt(t)+' / '+fmt(d);
      if(state===1&&t>1&&!detectAd(t,d)){lastGoodTime=t;}
      if(detectAd(t,d)){
        badge('⚠ 광고','#c00');
        setStatus('🚨 광고 감지! last='+fmt(lastGoodTime)+' skip#'+(adSkipCount+1),'ad');
        document.getElementById('adInfo').textContent='스킵: '+adSkipCount+'회';
        if(!reloading){reloading=true;setTimeout(skipAd,300);}
      } else {
        badge('');
        reloading=false;
      }
    }catch(e){}
  },1000);
}

function detectAd(t,d){
  if(!videoDur||!d) return false;
  // duration이 원본보다 훨씬 짧으면 광고 중
  if(d<videoDur*0.8&&d<600) return true;
  return false;
}

function skipAd(){
  if(!player) return;
  var d=player.getDuration();
  adSkipCount++;
  if(d>0&&d<videoDur*0.8){
    // 광고 duration으로 seekTo → 광고 끝
    player.seekTo(d,true);
    setStatus('⏭ 광고 seekTo '+fmt(d)+' (skip#'+adSkipCount+')','warn');
    setTimeout(function(){reloading=false;},2000);
  } else {
    reloadSafe();
  }
}

function reloadSafe(){
  if(!videoId||!videoDur) return;
  var start=Math.max(0,lastGoodTime+0.1);
  player.loadVideoById({videoId:videoId,startSeconds:start,endSeconds:Math.floor(videoDur-0.1)});
  setStatus('🔄 재로드 t='+fmt(start)+' end='+fmt(videoDur-0.1),'warn');
  setTimeout(function(){reloading=false;},3000);
}

function badge(txt,color){
  var b=document.getElementById('badge');
  if(!txt){b.style.display='none';return;}
  b.style.display='block';b.style.background=color;b.style.color='#fff';b.textContent=txt;
}

function setStatus(msg,cls){
  var el=document.getElementById('status');
  el.textContent=msg;el.className=cls||'';
}

function fmt(s){
  s=Math.floor(s||0);
  return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
}

document.getElementById('urlInput').addEventListener('keydown',function(e){
  if(e.key==='Enter') loadVideo();
});
</script>
</body>
</html>

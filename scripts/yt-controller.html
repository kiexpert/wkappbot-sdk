<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Controller</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#eee;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
#toolbar{display:flex;gap:8px;padding:8px;background:#1a1a1a;align-items:center;flex-shrink:0}
#urlInput{flex:1;padding:8px 12px;border-radius:20px;border:none;background:#333;color:#eee;font-size:14px;outline:none}
#urlInput:focus{background:#444}
#loadBtn{padding:8px 16px;border-radius:20px;border:none;background:#f00;color:#fff;font-weight:bold;cursor:pointer;white-space:nowrap}
#loadBtn:hover{background:#c00}
#status{padding:4px 12px;font-size:12px;background:#111;color:#888;border-bottom:1px solid #222;flex-shrink:0;min-height:24px}
#status.ok{color:#0f0}
#status.warn{color:#f80}
#status.ad{color:#f00;font-weight:bold}
#playerWrap{flex:1;position:relative;background:#000}
#playerWrap iframe{width:100%;height:100%;border:none;display:block}
#badge{position:absolute;bottom:8px;right:8px;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:bold;display:none;z-index:10}
#controls{display:flex;gap:6px;padding:6px 8px;background:#1a1a1a;align-items:center;flex-shrink:0}
#controls button{padding:5px 12px;border-radius:4px;border:none;background:#333;color:#eee;cursor:pointer;font-size:12px}
#controls button:hover{background:#555}
#timeInfo{margin-left:auto;font-size:12px;color:#888}
</style>
</head>
<body>

<div id="toolbar">
  <input id="urlInput" placeholder="YouTube URL 또는 영상 ID..." value="">
  <button id="loadBtn" onclick="loadVideo()">▶ 로드</button>
</div>
<div id="status">대기 중...</div>
<div id="playerWrap">
  <div id="player"></div>
  <div id="badge"></div>
</div>
<div id="controls">
  <button onclick="player&&player.playVideo()">▶</button>
  <button onclick="player&&player.pauseVideo()">⏸</button>
  <button onclick="player&&player.mute()">🔇</button>
  <button onclick="player&&player.unMute()">🔊</button>
  <button onclick="skipAd()">⏭ 광고스킵</button>
  <button onclick="reloadSafe()">🔄 안전리로드</button>
  <span id="timeInfo">--:-- / --:--</span>
</div>

<script>
var player, videoId, videoDur=0, lastGoodTime=0, adCount=0, checkTimer, reloading=false;

// YouTube IFrame API
var tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

function onYouTubeIframeAPIReady(){
  setStatus('YouTube API 준비됨','ok');
  var id=getIdFromUrl(document.getElementById('urlInput').value);
  if(id) loadVideo();
}

function getIdFromUrl(input){
  input=(input||'').trim();
  if(!input) return null;
  var m=input.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
  return null;
}

function loadVideo(){
  var input=document.getElementById('urlInput').value;
  var id=getIdFromUrl(input);
  if(!id){setStatus('유효한 YouTube URL 또는 영상 ID를 입력하세요','warn');return;}
  videoId=id; videoDur=0; lastGoodTime=0; adCount=0; reloading=false;
  setStatus('로딩 중... '+id);
  if(player && player.loadVideoById){
    player.loadVideoById(id);
  } else {
    if(player) player.destroy();
    player=new YT.Player('player',{
      height:'100%', width:'100%',
      videoId:id,
      playerVars:{autoplay:1,rel:0,modestbranding:1,enablejsapi:1},
      events:{onReady:onReady, onStateChange:onStateChange, onError:onError}
    });
  }
}

function onReady(e){
  videoDur=e.target.getDuration()||0;
  setStatus('준비: '+videoId+' ('+fmt(videoDur)+')','ok');
  // end 파라미터는 embed에서 작동 -- 끝광고 원천차단
  if(videoDur>2){
    player.loadVideoById({videoId:videoId, startSeconds:lastGoodTime||0, endSeconds:Math.floor(videoDur-0.1)});
    setStatus('끝광고 차단: end='+Math.floor(videoDur-0.1)+'s','ok');
  }
  startMonitor();
}

function onStateChange(e){
  // state: -1=unstarted, 0=ended, 1=playing, 2=paused, 3=buffering, 5=cued
  var s=e.data;
  if(s===0){setStatus('영상 종료','warn');}
}

function onError(e){setStatus('오류: '+e.data,'warn');}

function startMonitor(){
  if(checkTimer) clearInterval(checkTimer);
  checkTimer=setInterval(function(){
    if(!player||!player.getCurrentTime) return;
    try{
      var t=player.getCurrentTime();
      var d=player.getDuration();
      var state=player.getPlayerState();

      // 시간 업데이트
      document.getElementById('timeInfo').textContent=fmt(t)+' / '+fmt(d);

      // 정상 재생중이면 lastGoodTime 저장
      if(state===1 && t>1 && !isAdPlaying(t,d)){
        lastGoodTime=t;
      }

      // 광고 감지: duration이 갑자기 짧아짐 (ad dur << video dur)
      if(isAdPlaying(t,d)){
        badge('⚠ 광고','#e00');
        setStatus('광고 감지! lastGoodTime='+lastGoodTime.toFixed(0)+'s','ad');
        if(!reloading){
          reloading=true;
          adCount++;
          setTimeout(skipAd, 200);
        }
      } else {
        badge('','');
        reloading=false;
      }
    }catch(e){}
  },1000);
}

function isAdPlaying(t,d){
  // 광고 감지 조건:
  // 1. duration이 videoDur보다 훨씬 짧음 (ad duration)
  if(videoDur>0 && d>0 && d < videoDur*0.5 && d < 600) return true;
  // 2. duration이 갑자기 변함
  if(videoDur>0 && d>0 && Math.abs(d-videoDur)>10 && d<videoDur*0.9) return true;
  return false;
}

function skipAd(){
  if(!player) return;
  var d=player.getDuration();
  // 광고 끝으로 점프
  if(d>0 && d<600) { player.seekTo(d,true); setStatus('광고 seekTo '+d.toFixed(0)+'s','warn'); return; }
  // 또는 lastGoodTime+0.1로 재로드
  safeReload(lastGoodTime+0.1);
}

function reloadSafe(){ safeReload(lastGoodTime||0); }

function safeReload(startAt){
  if(!videoId||!videoDur) return;
  setStatus('재로드: t='+startAt.toFixed(1)+'s end='+Math.floor(videoDur-0.1)+'s');
  reloading=false;
  player.loadVideoById({videoId:videoId, startSeconds:Math.max(0,startAt), endSeconds:Math.floor(videoDur-0.1)});
}

function badge(txt,color){
  var b=document.getElementById('badge');
  if(!txt){b.style.display='none';return;}
  b.style.display='block';b.style.background=color||'#f00';b.style.color='#fff';b.textContent=txt;
}

function setStatus(msg,cls){
  var el=document.getElementById('status');
  el.textContent=msg; el.className=cls||'';
}

function fmt(s){
  s=Math.floor(s||0);
  return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
}

// URL 입력 엔터
document.getElementById('urlInput').addEventListener('keydown',function(e){
  if(e.key==='Enter') loadVideo();
});

// 초기 URL (CDP로 열 때 ?v= 파라미터 지원)
(function(){
  var qv=new URLSearchParams(location.search).get('v');
  if(qv){document.getElementById('urlInput').value=qv;}
})();
</script>
</body>
</html>

name: private-im-proof

# Proves item (u): the internal-model relay + live console over the portal's dual-channel WebRTC data channel. Two
# headless-Chromium peers (page + daemon) join one session through the dual GitLab+GitHub signaller; the daemon answers
# a prompt command-only and streams ordered encrypted console chunks over the data channel; two sessions run at once,
# each on its own issue + key, isolated. The logic lives in the target repo (ci/relay-im-proof.mjs); this is a thin
# shim (item-o pattern): the target is found by a sha256 prefix and never named, its name and tokens are masked.
# SECRETS READ: GH_LICENSE_TOKEN / WKAPPBOT_PAT / WKAPPBOT_CORE_PAT (to find+clone the target) and
# WKSIG_GITLAB_TOKEN + WKSIG_GITHUB_TOKEN (both required — the dual channel). No cleartext secret is printed.
on:
  workflow_dispatch:
  push:
    branches: ['qa-video/**']
    paths:
      - .github/workflows/private-im-proof.yml

permissions:
  contents: read

concurrency:
  group: private-im-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_HASH: ce712644e054789d
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
      WKSIG_GITLAB_TOKEN: ${{ secrets.WKSIG_GITLAB_TOKEN }}
      WKSIG_GITHUB_TOKEN: ${{ secrets.WKSIG_GITHUB_TOKEN }}
    steps:
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] && [ "$t" != "SET-ME" ] || continue
            echo "::add-mask::$t"
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"; echo "::add-mask::${n#*/}"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"; exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1
      - name: Guard the signal tokens (both required for the dual channel)
        run: |
          ok=1
          [ -n "$WKSIG_GITLAB_TOKEN" ] && [ "$WKSIG_GITLAB_TOKEN" != "SET-ME" ] && echo "::add-mask::$WKSIG_GITLAB_TOKEN" || { echo "WKSIG_GITLAB_TOKEN missing"; ok=0; }
          [ -n "$WKSIG_GITHUB_TOKEN" ] && [ "$WKSIG_GITHUB_TOKEN" != "SET-ME" ] && echo "::add-mask::$WKSIG_GITHUB_TOKEN" || { echo "WKSIG_GITHUB_TOKEN missing"; ok=0; }
          [ "$ok" = 1 ] || { echo "item (u) needs both signal tokens"; exit 1; }
      - name: Clone the target and run the internal-model relay proof
        run: |
          set -eu
          git clone -q --depth 5 "https://x-access-token:${TOK}@github.com/${REPO}.git" src
          cd src
          npm init -y > /dev/null 2>&1
          npm i --no-save playwright@1.48.0 > /dev/null 2>&1
          npx playwright install --with-deps chromium
          node ci/relay-im-proof.mjs
      - name: Show the result
        if: always()
        run: |
          [ -f src/ci-im-proof-result.json ] && cat src/ci-im-proof-result.json || echo "no result file"

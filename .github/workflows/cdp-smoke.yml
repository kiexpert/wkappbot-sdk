name: CDP Connectivity Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min, all day, zero AI token cost
  push:
    paths:
      - 'scripts/test-cdp-connectivity.ps1'
      - '.github/workflows/cdp-smoke.yml'

permissions:
  contents: read

jobs:
  cdp-smoke:
    runs-on: windows-latest
    timeout-minutes: 8

    strategy:
      fail-fast: false
      matrix:
        target:
          # ── Major LLM chatbots ──────────────────────────────────────────
          - { name: chatgpt,      url: 'https://chatgpt.com',               expect: 'chatgpt|openai' }
          - { name: gemini,       url: 'https://gemini.google.com',         expect: 'gemini|google' }
          - { name: claude,       url: 'https://claude.ai',                 expect: 'claude\.ai' }
          - { name: deepseek,     url: 'https://chat.deepseek.com',         expect: 'deepseek' }
          - { name: grok,         url: 'https://grok.com',                  expect: 'grok|x\.ai' }
          - { name: meta-ai,      url: 'https://www.meta.ai',               expect: 'meta\.ai' }
          - { name: copilot,      url: 'https://copilot.microsoft.com',     expect: 'copilot|microsoft' }
          # ── Search + Research ───────────────────────────────────────────
          - { name: perplexity,   url: 'https://www.perplexity.ai',         expect: 'perplexity' }
          # ── Open source / API-first ─────────────────────────────────────
          - { name: huggingchat,  url: 'https://huggingface.co/chat',       expect: 'huggingface' }
          - { name: groq,         url: 'https://groq.com',                  expect: 'groq' }
          - { name: cerebras,     url: 'https://inference.cerebras.ai',     expect: 'cerebras' }
          # ── Roleplay / Character ────────────────────────────────────────
          - { name: character-ai, url: 'https://character.ai',              expect: 'character' }

    name: ${{ matrix.target.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Chrome
        run: |
          $c = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $c) { Write-Host "Chrome OK: $c" }
          else { Write-Error "Chrome not found" }

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('csharp/**/*.csproj', 'csharp/**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore bin cache
        id: bin_cache
        uses: actions/cache/restore@v5
        with:
          path: bin
          key: ${{ runner.os }}-sdk-build-${{ hashFiles('csharp/**/*.cs', 'csharp/**/*.csproj', 'csharp/**/*.props', 'csharp/**/*.targets', 'csharp/WKAppBot.sln') }}
          restore-keys: |
            ${{ runner.os }}-sdk-build-run-
            ${{ runner.os }}-sdk-build-

      - name: Build launcher
        if: ${{ steps.bin_cache.outputs.cache-hit != 'true' || hashFiles('bin/wkappbot.exe') == '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          dotnet publish csharp/src/WKAppBot.Launcher/WKAppBot.Launcher.csproj `
            --configuration Release -p:SkipDeployLauncher=true -o bin

      - name: Fetch core binary (private release)
        if: ${{ hashFiles('bin/wkappbot-core.exe') == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WKAPPBOT_CORE_PAT }}
          CORE_REPO: ${{ secrets.WKAPPBOT_CORE_REPO }}
        run: |
          if (-not $env:CORE_REPO -or -not $env:GH_TOKEN) {
            throw 'WKAPPBOT_CORE_REPO / WKAPPBOT_CORE_PAT secrets required'
          }
          $tag = gh release list --repo $env:CORE_REPO --json tagName,createdAt `
            | ConvertFrom-Json `
            | Where-Object { $_.tagName -like 'core-*' } `
            | Sort-Object createdAt -Descending `
            | Select-Object -First 1 -ExpandProperty tagName
          if (-not $tag) { throw "No core-* release found in $env:CORE_REPO." }
          gh release download $tag --repo $env:CORE_REPO --pattern "wkappbot-core.exe" --dir bin --clobber
          if (-not (Test-Path bin/wkappbot-core.exe)) { throw "wkappbot-core.exe not found" }
          Write-Host "Core fetched: $tag"

      - name: Seed bin/wkappbot.hq
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/wkappbot.hq/skills | Out-Null
          if (Test-Path wkappbot.hq) { Copy-Item wkappbot.hq/* bin/wkappbot.hq -Recurse -Force }
          if (Test-Path skills) { Copy-Item skills/* bin/wkappbot.hq/skills -Recurse -Force }

      - name: Add bin to PATH
        run: echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Start Eye
        run: |
          Start-Process wkappbot.exe -ArgumentList "eye" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          wkappbot eye tick

      - name: CDP test -- ${{ matrix.target.name }}
        run: |
          # Delegate to shared script (correct eval syntax + cdp-mon anomaly checks)
          powershell -ExecutionPolicy Bypass -File scripts/test-cdp-connectivity.ps1 `
            -Url '${{ matrix.target.url }}' -Expect '${{ matrix.target.expect }}'
          exit $LASTEXITCODE


      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fail-${{ matrix.target.name }}-${{ github.run_number }}
          path: bin/wkappbot.hq/logs/
          retention-days: 1

name: secret-drop-apply

# Sets this repo's Actions secrets from a relay/secret-drop branch of one private repo of this
# account (one file per secret: file name = secret name, file content = value), then deletes that
# branch. It runs on a GitHub runner because the spokesman's cloud proxy refuses the secrets API.
# Values are masked and never printed; the target repo is found by a sha256 prefix, never named.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/secret-drop-apply.yml
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: secret-drop-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_HASH: ce712644e054789d
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"
                echo "::add-mask::${n#*/}"
                echo "::add-mask::$t"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"
                exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1
      - name: Fetch the drop branch
        id: drop
        run: |
          set -u
          if git clone -q --depth 1 -b relay/secret-drop "https://x-access-token:${TOK}@github.com/${REPO}.git" drop 2>/dev/null; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "no drop waiting"; echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set each dropped secret on this repo
        if: steps.drop.outputs.has == 'true'
        run: |
          set -eu
          ok=0
          for f in drop/*; do
            name=$(basename "$f")
            printf %s "$name" | grep -Eq '^[A-Z][A-Z0-9_]*$' || { echo "skipped a file with a bad secret name"; continue; }
            val=$(tr -d '\r\n' < "$f")
            echo "::add-mask::$val"
            set_done=false
            for t in "$T1" "$T2" "$T3"; do
              [ -n "$t" ] || continue
              if printf %s "$val" | GH_TOKEN="$t" gh secret set "$name" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                set_done=true; break
              fi
            done
            if $set_done; then echo "set $name"; ok=$((ok+1)); else echo "no token may set $name (needs a PAT with Secrets: write)"; exit 1; fi
          done
          echo "secrets set: $ok"
      - name: Delete the drop branch
        if: steps.drop.outputs.has == 'true'
        run: |
          git -C drop push -q origin --delete relay/secret-drop
          echo "drop branch deleted"

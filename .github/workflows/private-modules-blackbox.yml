name: private-modules-blackbox

# Black-box tests of the simulation modules of one private repo of this account.
# The runner clones the repo with its module submodules, runs each module through its adapter with
# test inputs, and hands the results (names, schemas, outputs, verdicts; never code) to the
# private-pages-relay through an orphan relay/blackbox branch in that repo.
# The target repo is never named in this public file or its logs: it is found by a sha256 prefix.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-modules-blackbox.yml
  schedule:
    # every 6 hours, so a module or runner change in the private repo is re-tested the same day
    - cron: '41 */6 * * *'

permissions:
  contents: read

concurrency:
  group: private-modules-blackbox
  cancel-in-progress: false

jobs:
  blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HASH: ce712644e054789d
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"
                echo "::add-mask::${n#*/}"
                echo "::add-mask::$t"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"
                exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1
      - name: Clone the repo and its module submodules
        run: |
          set -eu
          git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${REPO}.git" src
          git -C src -c "url.https://x-access-token:${TOK}@github.com/.insteadOf=https://github.com/" submodule update --init --depth 1 --quiet
          test -f src/modules/manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the module dependencies
        run: python -m pip install -q numpy scipy
      - name: Run the black-box tests
        run: python src/modules/run_blackbox.py --root src --out results.json
      - name: Hand the results to the pages relay on relay/blackbox
        if: always()
        run: |
          set -eu
          test -f results.json
          mkdir relay && cp results.json relay/ && cd relay
          git init -q -b relay/blackbox
          git config user.name "blackbox-relay"
          git config user.email "blackbox-relay@users.noreply.github.com"
          git add -A && git commit -q -m "blackbox results $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOK}@github.com/${REPO}.git" relay/blackbox
          echo "results handed to relay/blackbox"

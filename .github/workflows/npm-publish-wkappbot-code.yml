name: npm-publish-wkappbot-code

# Ships the WKAppBot Code CLI (wkappbot-code; wk-appbot-code stays as an alias bin) two ways (owner 2026-11-06:
# publish from the SDK repo with only what is needed; if the web can do it, use the harness repo's web; one name,
# wkappbot-code, for the package and the final executable). The source lives in the target repo's wkappbot-code/
# folder (appbot-code/ is read as a fallback while the target still has only the old folder); the target repo is
# found by sha256 prefix and never named, as in webvm-x64.yml. Only the package's own "files" list is shipped, and
# nothing is shipped unless the target repo's scrub gate (SCRUB in tools/wk-harness-min-copy.sh) prints hits=0 and
# the SDK public-safety mask + scan prints HITS 0.
#   WEB (no token): the packed tgz goes to the target's gh-pages at wkappbot-code/, so anyone installs it with
#     npm i -g https://<pages>/wkappbot-code/wkappbot-code.tgz   (a versioned copy, SHA256SUMS and version.json beside it)
#   OLD URL, KEPT ON PURPOSE: the same bytes are also written to appbot-code/wk-appbot-code.tgz (+ version.json,
#     SHA256SUMS), because that install command was already handed out. Do not remove it.
#   GATE (owner 2026-11-08: "npm goes to the team -- no mistakes"): a version not yet on the registry is published
#     (registry AND Pages) only when scripts/npm-release-gate.sh passes: the version is listed in
#     .github/npm-release-approved.txt, the SDK releases/latest core is >= the kih bin core, and wkappbot-code-os-qa
#     run on the PACKED tgz (workflow_call, before publish) is green on linux-x64, osx-arm64, osx-x64 and win-x64
#     with doctor fail 0 and PASS opencode. Any refusal publishes nothing. Jobs: pack -> qa -> gate -> publish.
#   QA: every completed run here also triggers wkappbot-code-os-qa.yml on the registry package (post-publish check).
#   REGISTRY: npm i -g wkappbot-code, published with provenance only when the NPM_TOKEN secret is set and the
#     package is named wkappbot-code; a version already on the registry is skipped; a dry-run checks every run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/npm-publish-wkappbot-code.yml
      - .github/scripts/npm-find-target.sh
      - scripts/npm-release-gate.sh
      - .github/npm-release-approved.txt
      - scripts/public-safety-mask.py
      - scripts/public-safety-scan.sh
      - .github/public-safety-markers.txt
  # Hourly pick-up of a new wkappbot-code version on the target main (public repo, Linux runner: no minutes billed;
  # an unchanged tgz makes no Pages commit). The automation cannot dispatch or re-run (403), so the schedule is the road.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  id-token: write   # npm provenance: the registry links each version to this public workflow run

# Own lock. Sharing harness-pages-relay got run 42156728552 cancelled while pending, because the 10-minute webvm-x64
# schedule replaces the one pending run a group may hold. A gh-pages push race is handled by the rebase-and-retry
# loop in the Pages step instead.
concurrency:
  group: npm-publish-wkappbot-code
  cancel-in-progress: false

jobs:
  # 1. pack: build, scrub, mask and scan the tgz exactly as before, then hand it to QA as an artifact.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ver: ${{ steps.meta.outputs.ver }}
      pkg: ${{ steps.meta.outputs.pkg }}
      new: ${{ steps.meta.outputs.new }}
      pages_only: ${{ steps.meta.outputs.pages_only }}
      kih_core: ${{ steps.meta.outputs.kih_core }}
    env:
      TARGET_HASH: 23ade98d428c8527
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the target repo and a token that can reach it
        run: bash .github/scripts/npm-find-target.sh
      # (The SDK checkout above carries the public-safety mask, scan and marker list.)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Fetch the package folder only (sparse, shallow)
        run: |
          set -eu
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${TOK}@github.com/${REPO}.git" src
          git -C src sparse-checkout set --no-cone /wkappbot-code/ /appbot-code/ /tools/wk-harness-min-copy.sh /bin/MANIFEST.md /bin/linux-x64/
          # wkappbot-code/ is the canonical folder; appbot-code/ only while the target has not renamed it yet.
          if [ -f src/wkappbot-code/package.json ]; then d=wkappbot-code; else d=appbot-code; echo "::notice::target has no wkappbot-code/ yet: reading appbot-code/"; fi
          [ -f "src/$d/package.json" ] || { echo "no package folder in the target"; exit 1; }
          echo "PKGDIR=$PWD/src/$d" >> "$GITHUB_ENV"
          ls -la "src/$d" src/tools

      - name: Build the package from its files list and run the scrub gate
        run: |
          set -eu
          cd "$PKGDIR"
          # Public package: drop "private", point repository and homepage at this public repo.
          node -e '
            const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8"));
            delete p.private;
            p.repository={type:"git",url:"git+https://github.com/"+process.env.GITHUB_REPOSITORY+".git"};
            p.homepage="https://github.com/"+process.env.GITHUB_REPOSITORY;
            p.publishConfig={access:"public"};
            fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'
          rm -f ./*.tgz
          npm pack -s >/dev/null
          mkdir -p "$RUNNER_TEMP/pkg" && tar -xzf ./*.tgz -C "$RUNNER_TEMP/pkg"
          SCRUB=$(sed -n "s/^SCRUB='\\(.*\\)'$/\\1/p" ../tools/wk-harness-min-copy.sh)
          [ -n "$SCRUB" ] || { echo "scrub pattern not found: nothing shipped"; exit 1; }
          hits=$(grep -r -i -E -l -- "$SCRUB" "$RUNNER_TEMP/pkg" | wc -l)
          echo "SCRUB GATE hits=$hits"
          [ "$hits" = 0 ] || { grep -r -i -E -l -- "$SCRUB" "$RUNNER_TEMP/pkg"; echo "scrub gate failed: nothing shipped"; exit 1; }
          find "$RUNNER_TEMP/pkg" -type f | sort
          echo "VER=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "PKG=$(node -p 'require("./package.json").name')" >> "$GITHUB_ENV"
          echo "TGZ=$PWD/$(ls ./*.tgz | head -1 | xargs basename)" >> "$GITHUB_ENV"
          # The final executable: wkappbot-code when the package ships it, else the old name.
          echo "CLI=$(node -p 'const b=require("./package.json").bin||{}; typeof b==="string"?require("./package.json").name:(b["wkappbot-code"]?"wkappbot-code":Object.keys(b)[0])')" >> "$GITHUB_ENV"

      # Publish-time mask (owner 2026-11-06: the distributable fixes itself; masking only the sensitive words
      # with *** is fine). Same rules as the core `skill public-mask`; the gate below must then print HITS 0.
      - name: Public-safety mask and gate on the packed files
        run: |
          set -eu
          python3 -I scripts/public-safety-mask.py "$RUNNER_TEMP/pkg"
          bash scripts/public-safety-scan.sh "$RUNNER_TEMP/pkg"
          # Repack from the masked tree, so what ships is exactly what was scanned.
          rm -f "$TGZ"
          (cd "$RUNNER_TEMP/pkg/package" && npm pack -s --pack-destination "$(dirname "$TGZ")")
          ls -la "$TGZ"

      - name: The packed CLI runs before it is shipped
        # Every verification install runs under its own throw-away HOME: 0.3.12+ runs its auto-setup at npm install,
        # which wires a global git push-owner gate into HOME -- on the runner's real HOME that refused the Pages push
        # (run 42509848799: "[push-owner-gate] refused: pushing as unresolved, not the owner account").
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/iso-pre"; HOME="$RUNNER_TEMP/iso-pre" USERPROFILE="$RUNNER_TEMP/iso-pre" XDG_CONFIG_HOME="$RUNNER_TEMP/iso-pre/.config" npm install -g --prefix "$RUNNER_TEMP/pre" "$TGZ"
          HOME="$RUNNER_TEMP/iso-pre" USERPROFILE="$RUNNER_TEMP/iso-pre" XDG_CONFIG_HOME="$RUNNER_TEMP/iso-pre/.config" "$RUNNER_TEMP/pre/bin/$CLI" --help

      # Registry (owner 2026-11-06: "start the npm registry procedure"). The name wkappbot-code was free (404) on
      # 2026-11-06. The owner's one step: an npm granular access token with publish rights, saved as the Actions
      # secret NPM_TOKEN of this repo. Until then every run checks the contents with a dry-run and stays green.
      # What is published is $TGZ: the SAME masked, scanned bytes that then go to Pages. The registry steps run
      # BEFORE the Pages steps on purpose: a slow Pages build (run 42180689182) must never block the npm publish.
      - name: Registry dry-run (package contents check, every run)
        run: |
          set -eu
          npm publish "$TGZ" --dry-run --access public

      - name: Version facts for the gate (new on the registry? kih bin core version)
        id: meta
        run: |
          set -u
          new=true; pages_only=false
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            new=false
            # A version already on the registry passed the gate when it was published. If the Pages copy is behind it
            # (a failed Pages step), ship the REGISTRY's own bytes of that version to Pages; nothing else is redone.
            pv=$(curl -fsSL "$PAGES/wkappbot-code/version.json?t=$(date +%s)" 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null || echo none)
            if [ "$pv" != "$VER" ]; then pages_only=true; echo "$PKG@$VER is on the registry but Pages serves $pv: Pages catch-up with the registry bytes"
            else echo "$PKG@$VER is already on the registry and Pages: nothing to publish, no QA"; fi
          fi
          # kih bin/linux-x64/ can hold an old name next to the current one (wkappbot 7.12.8 beside wkappbot-linux-x64
          # 7.12.34): take the HIGHEST version any of its binaries prints, not the first file name.
          kc=""
          for k in src/bin/linux-x64/*; do
            [ -f "$k" ] || continue; chmod +x "$k"
            v="$("$k" --version 2>&1 | tr -d '\r' | grep -m1 -E '^wkappbot v' || true)"; [ -n "$v" ] || continue
            echo "kih $(basename "$k"): $v"
            if [ -z "$kc" ] || [ "$(printf '%s\n%s\n' "$(echo "$kc" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" "$(echo "$v" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" | sort -V | tail -1)" != "$(echo "$kc" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" ]; then kc="$v"; fi
          done
          echo "kih bin core: ${kc:-unknown}"
          { echo "ver=$VER"; echo "pkg=$PKG"; echo "new=$new"; echo "pages_only=$pages_only"; echo "kih_core=$kc"; } >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/tgzout" && cp "$TGZ" "$RUNNER_TEMP/tgzout/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: wkappbot-code-tgz
          path: ${{ runner.temp }}/tgzout/
          retention-days: 14

  # 2. QA the PACKED tgz on every OS before anything is published (only for a version not yet on the registry).
  qa:
    needs: pack
    if: needs.pack.outputs.new == 'true'
    uses: ./.github/workflows/wkappbot-code-os-qa.yml
    with:
      tgz_artifact: wkappbot-code-tgz
      version: ${{ needs.pack.outputs.ver }}

  # 3. gate: approved version + releases/latest core >= kih bin core + green packed-tgz QA on all four platforms.
  gate:
    needs: [pack, qa]
    if: always() && needs.pack.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: qa-result-*
          path: qa
          merge-multiple: true
        continue-on-error: true
      - name: releases/latest core version
        run: |
          set -u
          curl -fsSL -o core "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/wkappbot-linux-x64" && chmod +x core
          echo "RELEASE_CORE=$(./core --version 2>&1 | tr -d '\r' | grep -m1 -E '^wkappbot v' || echo unknown)" >> "$GITHUB_ENV"
      - name: Release gate (refuses unless every check passes)
        env:
          VER: ${{ needs.pack.outputs.ver }}
          KIH_CORE: ${{ needs.pack.outputs.kih_core }}
          QA_DIR: qa
          APPROVED_FILE: .github/npm-release-approved.txt
          LEGS: linux-x64 osx-arm64 osx-x64 win-x64
        run: bash scripts/npm-release-gate.sh | tee gate.txt; exit ${PIPESTATUS[0]}
      - name: Gate summary
        if: always()
        run: '{ echo "### npm release gate"; echo "\`\`\`"; cat gate.txt 2>/dev/null; echo "\`\`\`"; } >> "$GITHUB_STEP_SUMMARY"'

  # 4. publish: only after the gate passed (a new version), or as a Pages catch-up of a version the gate already
  #    published to the registry. Registry first, then the Pages web copy.
  publish:
    needs: [pack, gate]
    if: always() && (needs.gate.result == 'success' || needs.pack.outputs.pages_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_HASH: 23ade98d428c8527
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
      VER: ${{ needs.pack.outputs.ver }}
      PKG: ${{ needs.pack.outputs.pkg }}
      CLI: wkappbot-code
    steps:
      - uses: actions/checkout@v4
      - name: Find the target repo and a token that can reach it
        run: bash .github/scripts/npm-find-target.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: needs.gate.result == 'success'
        with:
          name: wkappbot-code-tgz
          path: ${{ runner.temp }}/tgz
      - name: The gated bytes (for a Pages catch-up, the registry's own tarball of this version)
        run: |
          set -eu
          if [ "${{ needs.gate.result }}" != success ]; then
            mkdir -p "$RUNNER_TEMP/tgz" && (cd "$RUNNER_TEMP/tgz" && npm pack -s "$PKG@$VER" >/dev/null)
            echo "Pages catch-up: $PKG@$VER from the registry"
          fi
          t="$(ls "$RUNNER_TEMP"/tgz/*.tgz | head -1)"; echo "TGZ=$t" >> "$GITHUB_ENV"
          echo "publishing $PKG@$VER: $(basename "$t") sha256=$(sha256sum "$t" | cut -d' ' -f1)"
      - name: Registry publish (skipped without NPM_TOKEN, or when this version is already on the registry)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          # Only the unified name goes to the registry: the old wk-appbot-code package is Pages-only.
          if [ "$PKG" != "wkappbot-code" ]; then echo "package is still named $PKG (target not renamed yet) -- registry publish skipped (Pages still published)"; exit 0; fi
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then echo "$PKG@$VER already on the registry -- registry publish skipped (Pages still published)"; exit 0; fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set -- registry publish skipped (Pages still published)"; exit 0; fi
          npm publish "$TGZ" --access public --provenance
          for i in 1 2 3 4 5 6; do npm view "$PKG@$VER" version && break; sleep 20; done
          mkdir -p "$RUNNER_TEMP/iso-reg"; HOME="$RUNNER_TEMP/iso-reg" USERPROFILE="$RUNNER_TEMP/iso-reg" XDG_CONFIG_HOME="$RUNNER_TEMP/iso-reg/.config" npm install -g --prefix "$RUNNER_TEMP/reg" "$PKG@$VER"
          HOME="$RUNNER_TEMP/iso-reg" USERPROFILE="$RUNNER_TEMP/iso-reg" XDG_CONFIG_HOME="$RUNNER_TEMP/iso-reg/.config" "$RUNNER_TEMP/reg/bin/$CLI" --help

      - name: Ship to the harness Pages web (wkappbot-code/, plus the old appbot-code/ URL)
        run: |
          set -eu
          SHA=$(sha256sum "$TGZ" | cut -d' ' -f1)
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${TOK}@github.com/${REPO}.git" pages
          # Canonical: wkappbot-code/wkappbot-code.tgz + the versioned copy + SHA256SUMS + version.json.
          mkdir -p pages/wkappbot-code
          cp "$TGZ" "pages/wkappbot-code/wkappbot-code-$VER.tgz"
          cp "$TGZ" pages/wkappbot-code/wkappbot-code.tgz
          (cd pages/wkappbot-code && sha256sum wkappbot-code*.tgz > SHA256SUMS && cat SHA256SUMS)
          printf '{"name":"%s","version":"%s","tgz":"wkappbot-code.tgz","sha256":"%s"}\n' "$PKG" "$VER" "$SHA" > pages/wkappbot-code/version.json
          # OLD URL, KEPT ON PURPOSE: `npm i -g <pages>/appbot-code/wk-appbot-code.tgz` was already handed out,
          # so the same bytes stay reachable there. Do not remove this block.
          mkdir -p pages/appbot-code
          cp "$TGZ" pages/appbot-code/wk-appbot-code.tgz
          (cd pages/appbot-code && sha256sum wk-appbot-code*.tgz > SHA256SUMS)
          printf '{"name":"%s","version":"%s","tgz":"wk-appbot-code.tgz","sha256":"%s","moved_to":"wkappbot-code/wkappbot-code.tgz"}\n' "$PKG" "$VER" "$SHA" > pages/appbot-code/version.json
          cd pages
          git config user.name "pages-relay"
          git config user.email "pages-relay@users.noreply.github.com"
          git add wkappbot-code appbot-code
          if git diff --cached --quiet; then echo "wkappbot-code on Pages unchanged"; exit 0; fi
          git commit -q -m "wkappbot-code $VER $(date -u +%FT%TZ)"
          # webvm-x64 and the pages relay push gh-pages too: on a lost race, rebase onto the new tip and retry.
          for i in 1 2 3 4 5; do
            git push -q "https://x-access-token:${TOK}@github.com/${REPO}.git" HEAD:gh-pages && break
            [ "$i" = 5 ] && exit 1
            sleep 15
            git pull -q --rebase "https://x-access-token:${TOK}@github.com/${REPO}.git" gh-pages
          done
          echo "wkappbot-code $VER on Pages"
          echo "PUSHED=1" >> "$GITHUB_ENV"

      - name: Request a Pages build
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ env.TOK }}
        run: |
          set -u
          gh api -X POST "repos/${REPO}/pages/builds" >/dev/null 2>&1 || true
          for i in $(seq 1 40); do
            s=$(gh api "repos/${REPO}/pages/builds/latest" -q .status 2>/dev/null || echo unknown)
            echo "build status: $s"
            [ "$s" = "built" ] && exit 0
            [ "$s" = "errored" ] && exit 1
            sleep 15
          done
          echo "build did not finish in 10 minutes"; exit 1

      - name: Verify the web install (new URL and the kept old URL serve the same bytes)
        run: |
          set -eu
          SHA=$(sha256sum "$TGZ" | cut -d' ' -f1)
          for i in $(seq 1 20); do
            got=$(curl -fsSL "$PAGES/wkappbot-code/version.json?t=$(date +%s)" | node -p 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); j.name+"@"+j.version' 2>/dev/null || true)
            [ "$got" = "$PKG@$VER" ] && break; echo "Pages serves ${got:-nothing} yet"; sleep 15
          done
          [ "$got" = "$PKG@$VER" ] || { echo "Pages never served $PKG@$VER"; exit 1; }
          for u in wkappbot-code/wkappbot-code.tgz appbot-code/wk-appbot-code.tgz; do
            for i in $(seq 1 20); do
              s=$(curl -fsSL "$PAGES/$u?t=$(date +%s)" | sha256sum | cut -d' ' -f1)
              [ "$s" = "$SHA" ] && break; sleep 15
            done
            echo "$u sha256=$s"
            [ "$s" = "$SHA" ] || { echo "$u does not serve the shipped bytes"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/iso-web"; HOME="$RUNNER_TEMP/iso-web" USERPROFILE="$RUNNER_TEMP/iso-web" XDG_CONFIG_HOME="$RUNNER_TEMP/iso-web/.config" npm install -g --prefix "$RUNNER_TEMP/web" "$PAGES/wkappbot-code/wkappbot-code.tgz"
          HOME="$RUNNER_TEMP/iso-web" USERPROFILE="$RUNNER_TEMP/iso-web" XDG_CONFIG_HOME="$RUNNER_TEMP/iso-web/.config" "$RUNNER_TEMP/web/bin/$CLI" --help
          mkdir -p "$RUNNER_TEMP/iso-old"; HOME="$RUNNER_TEMP/iso-old" USERPROFILE="$RUNNER_TEMP/iso-old" XDG_CONFIG_HOME="$RUNNER_TEMP/iso-old/.config" npm install -g --prefix "$RUNNER_TEMP/old" "$PAGES/appbot-code/wk-appbot-code.tgz"
          HOME="$RUNNER_TEMP/iso-old" USERPROFILE="$RUNNER_TEMP/iso-old" XDG_CONFIG_HOME="$RUNNER_TEMP/iso-old/.config" "$RUNNER_TEMP/old/bin/$CLI" --help


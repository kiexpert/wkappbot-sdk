name: npm-publish-wkappbot-code

# Ships the WKAppBot Code CLI (wkappbot-code; wk-appbot-code stays as an alias bin) two ways (owner 2026-11-06:
# publish from the SDK repo with only what is needed; if the web can do it, use the harness repo's web; one name,
# wkappbot-code, for the package and the final executable). The source lives in the target repo's wkappbot-code/
# folder (appbot-code/ is read as a fallback while the target still has only the old folder); the target repo is
# found by sha256 prefix and never named, as in webvm-x64.yml. Only the package's own "files" list is shipped, and
# nothing is shipped unless the target repo's scrub gate (SCRUB in tools/wk-harness-min-copy.sh) prints hits=0 and
# the SDK public-safety mask + scan prints HITS 0.
#   WEB (no token): the packed tgz goes to the target's gh-pages at wkappbot-code/, so anyone installs it with
#     npm i -g https://<pages>/wkappbot-code/wkappbot-code.tgz   (a versioned copy, SHA256SUMS and version.json beside it)
#   OLD URL, KEPT ON PURPOSE: the same bytes are also written to appbot-code/wk-appbot-code.tgz (+ version.json,
#     SHA256SUMS), because that install command was already handed out. Do not remove it.
#   REGISTRY (optional): npm i -g wkappbot-code, published only when the NPM_TOKEN secret is set; a version already
#     on the registry is skipped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/npm-publish-wkappbot-code.yml
      - scripts/public-safety-mask.py
      - scripts/public-safety-scan.sh
      - .github/public-safety-markers.txt
  # Hourly pick-up of a new wkappbot-code version on the target main (public repo, Linux runner: no minutes billed;
  # an unchanged tgz makes no Pages commit). The automation cannot dispatch or re-run (403), so the schedule is the road.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

# Own lock. Sharing harness-pages-relay got run 42156728552 cancelled while pending, because the 10-minute webvm-x64
# schedule replaces the one pending run a group may hold. A gh-pages push race is handled by the rebase-and-retry
# loop in the Pages step instead.
concurrency:
  group: npm-publish-wkappbot-code
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_HASH: 23ade98d428c8527
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"
                echo "::add-mask::${n#*/}"
                echo "::add-mask::$t"
                { echo "REPO=$n"; echo "TOK=$t"; echo "PAGES=https://${n%%/*}.github.io/${n#*/}"; } >> "$GITHUB_ENV"
                echo "target found"
                exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1

      # The SDK checkout carries the public-safety mask, scan and marker list.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Fetch the package folder only (sparse, shallow)
        run: |
          set -eu
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${TOK}@github.com/${REPO}.git" src
          git -C src sparse-checkout set --no-cone /wkappbot-code/ /appbot-code/ /tools/wk-harness-min-copy.sh
          # wkappbot-code/ is the canonical folder; appbot-code/ only while the target has not renamed it yet.
          if [ -f src/wkappbot-code/package.json ]; then d=wkappbot-code; else d=appbot-code; echo "::notice::target has no wkappbot-code/ yet: reading appbot-code/"; fi
          [ -f "src/$d/package.json" ] || { echo "no package folder in the target"; exit 1; }
          echo "PKGDIR=$PWD/src/$d" >> "$GITHUB_ENV"
          ls -la "src/$d" src/tools

      - name: Build the package from its files list and run the scrub gate
        run: |
          set -eu
          cd "$PKGDIR"
          # Public package: drop "private", point repository and homepage at this public repo.
          node -e '
            const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8"));
            delete p.private;
            p.repository={type:"git",url:"git+https://github.com/"+process.env.GITHUB_REPOSITORY+".git"};
            p.homepage="https://github.com/"+process.env.GITHUB_REPOSITORY;
            p.publishConfig={access:"public"};
            fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'
          rm -f ./*.tgz
          npm pack -s >/dev/null
          mkdir -p "$RUNNER_TEMP/pkg" && tar -xzf ./*.tgz -C "$RUNNER_TEMP/pkg"
          SCRUB=$(sed -n "s/^SCRUB='\\(.*\\)'$/\\1/p" ../tools/wk-harness-min-copy.sh)
          [ -n "$SCRUB" ] || { echo "scrub pattern not found: nothing shipped"; exit 1; }
          hits=$(grep -r -i -E -l -- "$SCRUB" "$RUNNER_TEMP/pkg" | wc -l)
          echo "SCRUB GATE hits=$hits"
          [ "$hits" = 0 ] || { grep -r -i -E -l -- "$SCRUB" "$RUNNER_TEMP/pkg"; echo "scrub gate failed: nothing shipped"; exit 1; }
          find "$RUNNER_TEMP/pkg" -type f | sort
          echo "VER=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "PKG=$(node -p 'require("./package.json").name')" >> "$GITHUB_ENV"
          echo "TGZ=$PWD/$(ls ./*.tgz | head -1 | xargs basename)" >> "$GITHUB_ENV"
          # The final executable: wkappbot-code when the package ships it, else the old name.
          echo "CLI=$(node -p 'const b=require("./package.json").bin||{}; typeof b==="string"?require("./package.json").name:(b["wkappbot-code"]?"wkappbot-code":Object.keys(b)[0])')" >> "$GITHUB_ENV"

      # Publish-time mask (owner 2026-11-06: the distributable fixes itself; masking only the sensitive words
      # with *** is fine). Same rules as the core `skill public-mask`; the gate below must then print HITS 0.
      - name: Public-safety mask and gate on the packed files
        run: |
          set -eu
          python3 -I scripts/public-safety-mask.py "$RUNNER_TEMP/pkg"
          bash scripts/public-safety-scan.sh "$RUNNER_TEMP/pkg"
          # Repack from the masked tree, so what ships is exactly what was scanned.
          rm -f "$TGZ"
          (cd "$RUNNER_TEMP/pkg/package" && npm pack -s --pack-destination "$(dirname "$TGZ")")
          ls -la "$TGZ"

      - name: The packed CLI runs before it is shipped
        run: |
          set -eu
          npm install -g --prefix "$RUNNER_TEMP/pre" "$TGZ"
          "$RUNNER_TEMP/pre/bin/$CLI" --help

      - name: Ship to the harness Pages web (wkappbot-code/, plus the old appbot-code/ URL)
        run: |
          set -eu
          SHA=$(sha256sum "$TGZ" | cut -d' ' -f1)
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${TOK}@github.com/${REPO}.git" pages
          # Canonical: wkappbot-code/wkappbot-code.tgz + the versioned copy + SHA256SUMS + version.json.
          mkdir -p pages/wkappbot-code
          cp "$TGZ" "pages/wkappbot-code/wkappbot-code-$VER.tgz"
          cp "$TGZ" pages/wkappbot-code/wkappbot-code.tgz
          (cd pages/wkappbot-code && sha256sum wkappbot-code*.tgz > SHA256SUMS && cat SHA256SUMS)
          printf '{"name":"%s","version":"%s","tgz":"wkappbot-code.tgz","sha256":"%s"}\n' "$PKG" "$VER" "$SHA" > pages/wkappbot-code/version.json
          # OLD URL, KEPT ON PURPOSE: `npm i -g <pages>/appbot-code/wk-appbot-code.tgz` was already handed out,
          # so the same bytes stay reachable there. Do not remove this block.
          mkdir -p pages/appbot-code
          cp "$TGZ" pages/appbot-code/wk-appbot-code.tgz
          (cd pages/appbot-code && sha256sum wk-appbot-code*.tgz > SHA256SUMS)
          printf '{"name":"%s","version":"%s","tgz":"wk-appbot-code.tgz","sha256":"%s","moved_to":"wkappbot-code/wkappbot-code.tgz"}\n' "$PKG" "$VER" "$SHA" > pages/appbot-code/version.json
          cd pages
          git config user.name "pages-relay"
          git config user.email "pages-relay@users.noreply.github.com"
          git add wkappbot-code appbot-code
          if git diff --cached --quiet; then echo "wkappbot-code on Pages unchanged"; exit 0; fi
          git commit -q -m "wkappbot-code $VER $(date -u +%FT%TZ)"
          # webvm-x64 and the pages relay push gh-pages too: on a lost race, rebase onto the new tip and retry.
          for i in 1 2 3 4 5; do
            git push -q "https://x-access-token:${TOK}@github.com/${REPO}.git" HEAD:gh-pages && break
            [ "$i" = 5 ] && exit 1
            sleep 15
            git pull -q --rebase "https://x-access-token:${TOK}@github.com/${REPO}.git" gh-pages
          done
          echo "wkappbot-code $VER on Pages"
          echo "PUSHED=1" >> "$GITHUB_ENV"

      - name: Request a Pages build
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ env.TOK }}
        run: |
          set -u
          gh api -X POST "repos/${REPO}/pages/builds" >/dev/null 2>&1 || true
          for i in $(seq 1 40); do
            s=$(gh api "repos/${REPO}/pages/builds/latest" -q .status 2>/dev/null || echo unknown)
            echo "build status: $s"
            [ "$s" = "built" ] && exit 0
            [ "$s" = "errored" ] && exit 1
            sleep 15
          done
          echo "build did not finish in 10 minutes"; exit 1

      - name: Verify the web install (new URL and the kept old URL serve the same bytes)
        run: |
          set -eu
          SHA=$(sha256sum "$TGZ" | cut -d' ' -f1)
          for i in $(seq 1 20); do
            got=$(curl -fsSL "$PAGES/wkappbot-code/version.json?t=$(date +%s)" | node -p 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); j.name+"@"+j.version' 2>/dev/null || true)
            [ "$got" = "$PKG@$VER" ] && break; echo "Pages serves ${got:-nothing} yet"; sleep 15
          done
          [ "$got" = "$PKG@$VER" ] || { echo "Pages never served $PKG@$VER"; exit 1; }
          for u in wkappbot-code/wkappbot-code.tgz appbot-code/wk-appbot-code.tgz; do
            for i in $(seq 1 20); do
              s=$(curl -fsSL "$PAGES/$u?t=$(date +%s)" | sha256sum | cut -d' ' -f1)
              [ "$s" = "$SHA" ] && break; sleep 15
            done
            echo "$u sha256=$s"
            [ "$s" = "$SHA" ] || { echo "$u does not serve the shipped bytes"; exit 1; }
          done
          npm install -g --prefix "$RUNNER_TEMP/web" "$PAGES/wkappbot-code/wkappbot-code.tgz"
          "$RUNNER_TEMP/web/bin/$CLI" --help
          npm install -g --prefix "$RUNNER_TEMP/old" "$PAGES/appbot-code/wk-appbot-code.tgz"
          "$RUNNER_TEMP/old/bin/$CLI" --help

      - name: Registry publish (optional; skipped without NPM_TOKEN or when the version is already published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then echo "$PKG@$VER already on the registry: skip"; exit 0; fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice::NPM_TOKEN not set: registry publish skipped; the web install is live"; exit 0; fi
          npm publish "$TGZ" --access public
          for i in 1 2 3 4 5 6; do npm view "$PKG@$VER" version && break; sleep 20; done
          npm install -g --prefix "$RUNNER_TEMP/reg" "$PKG@$VER"
          "$RUNNER_TEMP/reg/bin/$CLI" --help

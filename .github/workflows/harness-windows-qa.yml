name: Harness QA (Windows + macOS)
# (spokesman: proof run on kih main 5c7d5b7 full sha, wkappbot-code 0.3.35 plugin layout fix, lock mds, allow list, lock wait)

# Runs the harness repo's own self-tests on Windows and macOS runners, so a harness change made on a
# Linux cloud VM is proven on the owner's two desktop platforms too. On macOS the Bash self-tests run a
# second time under /bin/bash 3.2, the shell a stock Mac starts hooks with.
# Only RESULT and CASE lines are printed; nothing from the harness repo is published.

# RESPAWN ON A BAD NETWORK (owner 2026-11-09, the scalper-runner road; the same road as wkappbot-code-os-qa.yml): every
# job leg first probes the hosts it needs (curl --retry 6 --retry-delay 5). A leg whose runner has a dead network does
# not run its steps; it dispatches a fresh run of this workflow for that one leg (only_leg=<job>:<matrix values>,
# respawn=n+1, parent=<first run>) and ends "respawned, network" -- never a product FAIL. Capped at 2 respawns; the
# third dead network is a real red. In a respawned run every other leg is switched off. Proof hooks: a branch
# qa/hwq-respawn-a-* fakes a dead network on web-install:ubuntu-latest's first attempt only (respawn 1 must go green);
# a branch qa/hwq-respawn-b-* fakes it on every attempt (respawn 2 must be the real red).
run-name: Harness QA (Windows + macOS)${{ inputs.only_leg != '' && format(' leg={0} respawn={1} parent={2}', inputs.only_leg, inputs.respawn, inputs.parent) || '' }}

on:
  workflow_dispatch:
    inputs:
      only_leg:
        description: 'Run only this leg, as <job>:<matrix values joined by -> (set by a respawn; empty = all legs)'
        required: false
        default: ''
      respawn:
        description: 'Respawn count of this run (0 = first attempt)'
        required: false
        default: '0'
      parent:
        description: 'Run id of the first attempt (set by a respawn)'
        required: false
        default: ''
      fake_net_fail:
        description: 'Proof hook: 1 = fake a dead network on the first attempt, all = on every attempt'
        required: false
        default: '0'
      harness_ref:
        description: 'Harness branch, tag or commit to test'
        required: false
        default: 'main'
      break_guard:
        description: 'Parity proof: corrupt one JS guard in the runner copy so the parity job must go RED'
        type: boolean
        required: false
        default: false
  push:
    # Any branch, main included, so a README change to the web-install lines is proven on main as well.
    paths:
      - '.github/workflows/harness-windows-qa.yml'
      - 'README.md'

permissions:
  contents: read
  actions: write   # a leg on a dead network dispatches a fresh run of itself (GITHUB_TOKEN may start workflow_dispatch)

jobs:
  # Read-only daily tools of the owner's docs repo on both desktop platforms (owner 2026-11-05).
  # The repo is found by sha256 prefix and never named. No live IMAP, no calendar writes, no browser.
  daily-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TARGET_HASH: c48fcce9e0c13229
      T1: ${{ secrets.WKAPPBOT_PAT }}
      T2: ${{ secrets.GH_LICENSE_TOKEN }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - name: Find the docs repo and a token that can reach it
        if: env.LEG_OFF != '1'
        shell: bash
        run: |
          set -u
          h16() { if command -v sha256sum >/dev/null 2>&1; then printf %s "$1" | sha256sum | cut -c1-16; else printf %s "$1" | shasum -a 256 | cut -c1-16; fi; }
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] && [ "$t" != "SET-ME" ] || continue
            echo "::add-mask::$t"
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(h16 "$n")" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"; echo "::add-mask::${n#*/}"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"; exit 0
              fi
            done
          done
          echo "no token reaches the docs repo"; exit 1
      - name: Check out the docs repo
        if: env.LEG_OFF != '1'
        shell: bash
        run: git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${REPO}.git" docsrepo
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        if: env.LEG_OFF != '1'
        with:
          # 3.12, not '3.x': '3.x' resolved to a just-released 3.15 that PyMuPDF (court_pdf) had no build for.
          python-version: '3.12'
      - name: Run each read-only tool and record PASS or FAIL
        if: env.LEG_OFF != '1'
        shell: bash
        working-directory: docsrepo
        run: |
          [ -f requirements.txt ] && python -m pip install -q -r requirements.txt > /dev/null 2>&1 || true
          python -m pip install -q pymupdf > /dev/null 2>&1 || true  # court_pdf imports fitz
          python -c 'import fitz' 2>/dev/null && echo "pymupdf: importable" || echo "pymupdf: NOT importable"
          # The tools read their settings from a .env that holds the owner's credentials and is never in the repo or
          # on a runner. An empty placeholder lets the credential-free paths (--help, --dry-run) run; nothing real is in it.
          [ -f .env ] || : > .env
          printf 'QA sample\n\nOne paragraph of text for the A4 render check.\n' > "$RUNNER_TEMP/sample.txt"
          pass=0; total=4
          # Tool output can hold personal data and this repo's logs are public: print only the case line and exit code, never the output.
          # On FAIL print only the exception class name (e.g. ModuleNotFoundError), never its message.
          # Each script is resolved by base name, since its folder may differ; the path is never printed.
          err="$RUNNER_TEMP/err.txt"
          chk() {
            name=$1; base=$2; shift 2
            # A tool that was moved can leave a stub with the same name behind (it only prints where the tool went and
            # exits 1), so try every copy, shallowest first, and pass when one of them passes.
            cands=$(find . -path ./.git -prune -o -type f -name "$base" -print | awk -F/ '{print NF"\t"$0}' | sort -n | cut -f2-)
            if [ -z "$cands" ]; then echo "CASE $name MISSING (script not in repo)"; return; fi
            n=$(printf '%s\n' "$cands" | wc -l | tr -d ' '); ok=0
            while IFS= read -r p; do
              [ -n "$p" ] || continue; lp=$p
              if python "$p" "$@" > /dev/null 2> "$err"; then ok=1; break; fi
            done <<EOF_CANDS
          $cands
          EOF_CANDS
            if [ "$ok" = 1 ]; then pass=$((pass + 1)); echo "CASE $name PASS (copies: $n)"
            else rc=1; cls=$(grep -oE '^[A-Za-z_.]*(Error|Exception|Exit)[A-Za-z]*' "$err" | tail -n 1 || true)
              mod=$(grep -oE "No module named '[A-Za-z0-9_.]+'" "$err" | tail -n 1 | grep -oE "'[^']+'" || true)
              flags=$(grep -E 'error:' "$err" | grep -oE -- '--[a-z][a-z0-9-]*' | sort -u | tr '\n' ' ' || true)
              # Safe diagnostics: the BASE NAME of a missing file (never its folder), and which known tools the error names.
              miss=$(grep -oE "No such file or directory: '[^']+'" "$err" | tail -n 1 | sed -E "s/.*: '//; s/'$//; s#.*[/\\\\]##" || true)
              tools=$(grep -oiE 'chrom(e|ium)|playwright|wkhtmltopdf|weasyprint|pandoc|libreoffice|soffice|fitz|pymupdf|font|credentials|token|config|\.env' "$err" | tr 'A-Z' 'a-z' | sort -u | tr '\n' ' ' || true)
              echo "CASE $name FAIL (rc=$rc copies $n ${cls:-no-exception-class}${mod:+ module $mod}${flags:+ flags $flags}${miss:+ missing-file $miss}${tools:+ mentions $tools})"
              # Only for a case fed our own synthetic input (DETAIL=1): its last error line, paths cut to base names,
              # emails, long numbers and token-like strings masked.
              if [ "${DETAIL:-0}" = 1 ]; then
                last=$(grep -v '^[[:space:]]*$' "$err" | tail -n 1 | sed -E 's#([A-Za-z]:)?[^ "'"'"']*[/\\]([^/\\ "'"'"']+)#\2#g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g; s/[0-9]{6,}/<n>/g; s/[A-Za-z0-9_-]{32,}/***/g' | cut -c1-200)
                echo "  detail: $last"
                san() { sed -E 's#([A-Za-z]:)?[^ "'"'"']*[/\\]([^/\\ "'"'"']+)#\2#g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g; s/[0-9]{6,}/<n>/g; s/[A-Za-z0-9_-]{32,}/***/g' | cut -c1-200; }
                echo "  first: $(grep -v '^[[:space:]]*$' "$err" | head -n 1 | san)"
                (grep -iE -A3 '^usage:' "$err" || true) | head -n 4 | san | sed 's/^/  usage: /'
                # How the script locates its .env (tokens only, never whole source lines), whether ./.env exists here,
                # and how deep the script sits.
                echo "  env-lookup: $( (grep -oE 'chdir\([^)]{0,50}\)|Path\([^)]{0,50}\)|__file__|home\(\)|getenv\([^)]{0,40}\)|environ[^ ]{0,40}|[A-Za-z_./]{0,30}\.env[A-Za-z_./]{0,20}' "$lp" || true) | sort -u | head -n 12 | san | tr '\n' ' ')"
                echo "  cwd-has-.env: $([ -f .env ] && echo yes || echo no); script-depth: $(printf '%s' "$lp" | tr -cd '/' | wc -c | tr -d ' ')"
                (grep -E '^[[:space:]]*File "' "$err" || true) | tail -n 3 | san | sed 's/^[[:space:]]*/  frame: /'
              fi; fi
          }
          # listing a real calendar needs the owner's Google credentials, which CI never holds: check the CLI loads
          chk calendar-help gcal.py --help
          # court_pdf usage: <input.txt> <output.pdf> [title] [attach.pdf ...] [--date "..."]
          DETAIL=1 chk court-pdf court_pdf.py "$RUNNER_TEMP/sample.txt" "$RUNNER_TEMP/sample.pdf"
          # naver_send --dry-run runs with no .env (docs repo fix 2026-11-05) and prints no secret values; stdout is discarded.
          DETAIL=1 chk mail-send-dry-run naver_send.py --dry-run --to qa@example.invalid --subject qa-dry-run --body qa-dry-run
          chk mail-sync-help naver_mail_sync.py --help
          echo "RESULT $pass/$total"
          [ "$pass" -eq "$total" ]

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

  # Portal selftests on the owner's two desktop platforms (owner 2026-11-05: compatibility demo on GitHub runners).
  # The portal repo is found by sha256 prefix and never named; its name and every token are masked.
  portal-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      TARGET_HASH: 754961bb6a5574dd
      T1: ${{ secrets.WKAPPBOT_PAT }}
      T2: ${{ secrets.GH_LICENSE_TOKEN }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - name: Find the portal repo and a token that can reach it
        if: env.LEG_OFF != '1'
        shell: bash
        run: |
          set -u
          h16() { if command -v sha256sum >/dev/null 2>&1; then printf %s "$1" | sha256sum | cut -c1-16; else printf %s "$1" | shasum -a 256 | cut -c1-16; fi; }
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] && [ "$t" != "SET-ME" ] || continue
            echo "::add-mask::$t"
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(h16 "$n")" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"; echo "::add-mask::${n#*/}"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"; exit 0
              fi
            done
          done
          echo "no token reaches the portal repo"; exit 1
      - name: Check out the portal
        if: env.LEG_OFF != '1'
        shell: bash
        run: |
          git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${REPO}.git" site
          # the portal sha this job tests, so a result can be tied to a portal commit (the repo name stays masked)
          echo "PORTAL-REF $(git -C site rev-parse --short HEAD) $(git -C site log -1 --format=%cI)"
      - uses: actions/setup-node@v5
        if: env.LEG_OFF != '1'
        with:
          node-version: 22
      - name: Install Chromium
        if: env.LEG_OFF != '1'
        shell: bash
        run: |
          npm i -s playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Portal selftest
        if: env.LEG_OFF != '1'
        shell: bash
        run: node site/poc-site/portal/selftest.js

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

  harness-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - name: Checkout harness repo
        if: env.LEG_OFF != '1'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/wkappbot-kih
          ref: ${{ inputs.harness_ref || 'main' }}
          token: ${{ secrets.WKAPPBOT_CORE_PAT }}
          path: kih
      - name: Harness ref from the commit message (push runs)
        # A push whose head commit message has a line "harness-ref: <kih branch or sha>" tests that kih head
        # instead of main, so a kih branch can be proven here before it merges.
        if: (github.event_name == 'push') && env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ref=$(printf '%s\n' "$MSG" | sed -n 's/^harness-ref: *//p' | head -1 | tr -d '\r ')
          [ -n "$ref" ] || { echo "HARNESS-REF main"; exit 0; }
          printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]{1,100}$' || { echo "bad harness-ref"; exit 1; }
          git fetch --depth=1 origin "$ref" && git checkout -q FETCH_HEAD && echo "HARNESS-REF $ref $(git log -1 --format=%h)"

      - name: Setup Python
        if: env.LEG_OFF != '1'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.x'

      - name: python3 alias (the harness scripts call python3)
        if: (runner.os == 'Windows') && env.LEG_OFF != '1'
        shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $py = (Get-Command python).Source
            Copy-Item $py (Join-Path (Split-Path $py) 'python3.exe')
          }
          python3 --version

      - name: Harness commit and shells under test
        if: env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        run: |
          echo "HARNESS $(git log -1 --format='%h %cs')"
          echo "BASH $(bash --version | head -1)"
          echo "PYTHON $(python3 --version 2>&1) home=$(python3 -c 'import os; print(os.path.expanduser("~"))')"
          [ -x /bin/bash ] && echo "SYSTEM-BASH $(/bin/bash --version | head -1)"
          echo "PWSH $(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          mid=$(bash -c 'source tools/wk-hippo-archive.sh; machine_id')
          if [ -n "$mid" ]; then echo "CASE machine-id PASS ($mid)"; else echo "CASE machine-id FAIL (empty: the archive cannot file anything on this OS)"; exit 1; fi

      - name: Fixture transcript (where Claude Code keeps transcripts)
        if: env.LEG_OFF != '1'
        shell: bash
        run: |
          mkdir -p "$HOME/.claude/projects/ci"
          fx="$HOME/.claude/projects/ci/11111111-2222-3333-4444-555555555555.jsonl"
          {
            printf '{"type":"user","timestamp":"2026-10-27T01:00:00.000Z","sessionId":"11111111","uuid":"u1","message":{"content":"run the archive check"}}\n'
            printf '{"type":"assistant","timestamp":"2026-10-27T01:00:01.000Z","sessionId":"11111111","uuid":"a1","message":{"model":"m","content":[{"type":"tool_use","id":"tu1","name":"Bash","input":{"command":"bash tools/x.sh push"}}]}}\n'
            printf '{"type":"user","timestamp":"2026-10-27T01:00:02.000Z","sessionId":"11111111","uuid":"u2","message":{"content":[{"type":"tool_result","tool_use_id":"tu1","is_error":true,"content":"Permission for this action was denied by the Claude Code auto mode classifier. Reason: [Sensitive-Source Provenance]."}]}}\n'
            printf '{"type":"user","timestamp":"2026-10-27T01:00:03.000Z","sessionId":"11111111","uuid":"u3","message":{"content":"@\\"/root/.claude/uploads/x/a.pdf\\" read this deck"}}\n'
          } > "$fx"
          echo "FX=$fx" >> "$GITHUB_ENV"
          git config --global user.email ci@example.com; git config --global user.name ci

      - name: 1. PowerShell parse check of the edited hooks
        if: env.LEG_OFF != '1'
        shell: pwsh
        working-directory: kih
        run: |
          $files = @(
            'tools/wkharness-common-utils.ps1',
            'tools/wkharness-common-tierscore.ps1',
            'tools/wkharness-spokesperson-refresh.ps1',
            'tools/wkharness-agy-main.ps1',
            'tools/wkharness-claude-stop/Get-WkSpokesmanStopState.ps1',
            'tools/wkharness-common-onload-scan/Get-WkOnLoadEntriesFromReflex.ps1'
          )
          $bad = 0
          foreach ($f in $files) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            $n = @($errs).Count
            if ($n -gt 0) { $bad++ }
            Write-Host ("CASE parse {0} {1}" -f $f, $(if ($n -eq 0) { 'PASS' } else { "FAIL ($n errors)" }))
          }
          Write-Host "RESULT $($files.Count - $bad)/$($files.Count)"
          if ($bad) { exit 1 }

      - name: 2. Hippo tool resolves from the harness with no WKAppBot checkout
        if: env.LEG_OFF != '1'
        shell: pwsh
        working-directory: kih
        run: |
          . ./tools/wkharness-common-utils.ps1
          $kihBin = (Resolve-Path ./bin).Path
          $fail = 0
          foreach ($n in @('wkhippo-reflex.py', 'wkhippo-studied-index.ps1')) {
            $got = Get-WkAppBotBinPath -Name $n
            $ok = ($got -like "$kihBin*") -and (Test-Path -LiteralPath $got)
            if (-not $ok) { $fail++ }
            Write-Host ("CASE bin-path {0} {1}" -f $n, $(if ($ok) { 'PASS' } else { 'FAIL' }))
          }
          Write-Host "RESULT $(2 - $fail)/2"
          if ($fail) { exit 1 }

      - name: 3. Python self-tests
        if: env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        run: |
          fail=0
          run() { out=$("$@" 2>&1 | tail -1); echo "$*: $out"; case "$out" in *RESULT*) set -- $out; [ "${2%%/*}" = "${2##*/}" ] || fail=1 ;; *) fail=1 ;; esac; }
          run python3 tools/wkharness-claude-allows-learn.py --selftest
          (cd bin && run python3 wkhippo_reflex_families_selftest.py)
          (cd bin && run python3 wkhippo_reflex_agentrun.py)
          (cd bin && run python3 wkhippo_reflex_claude_blocked.py)
          (cd bin/wkhippo-lib && run python3 wkhippo_reflex_claude_blocked.py)
          exit $fail

      - name: 4. Launchers -- wkhippo reflex and history-push (bash)
        if: env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        run: |
          pass=0; total=4
          ok() { pass=$((pass + 1)); echo "CASE $1 PASS"; }; bad() { echo "CASE $1 FAIL ${2:-}"; }
          n=$(bash bin/wkhippo reflex "$FX" 2>/dev/null | grep -c '^{')
          [ "$n" -eq 4 ] && ok reflex-raw-lines || bad reflex-raw-lines "($n of 4)"
          bash bin/wkhippo reflex "$FX" 2>/dev/null | grep -q 'uploads/x/a.pdf' && ok upload-prompt-kept || bad upload-prompt-kept
          out=$(bash bin/wkhippo history-push --session zzz-none --dry-run 2>&1)
          case "$out" in *"BACKFILL sessions=0 "*) ok history-push-dry-run ;; *) bad history-push-dry-run "($out)" ;; esac
          out=$(bash bin/wkhippo history-push --session 11111111 --dry-run 2>&1)
          case "$out" in *"PLAN "*"11111111-2222-3333-4444-555555555555 --backfill"*) ok history-push-plans-session ;; *) bad history-push-plans-session "($out)" ;; esac
          echo "RESULT $pass/$total"; [ "$pass" -eq "$total" ]

      - name: 5. Launcher -- wkhippo.cmd reflex and history-push (cmd)
        if: (runner.os == 'Windows') && env.LEG_OFF != '1'
        shell: cmd
        working-directory: kih
        run: |
          call bin\wkhippo.cmd reflex "%USERPROFILE%\.claude\projects\ci\11111111-2222-3333-4444-555555555555.jsonl" > "%RUNNER_TEMP%\r.txt" 2>&1
          findstr /c:"uploads/x/a.pdf" "%RUNNER_TEMP%\r.txt" >nul && (echo CASE cmd-reflex PASS) || (echo CASE cmd-reflex FAIL & type "%RUNNER_TEMP%\r.txt" & exit /b 1)
          call bin\wkhippo.cmd history-push --session zzz-none --dry-run > "%RUNNER_TEMP%\h.txt" 2>&1
          findstr /c:"BACKFILL sessions=0" "%RUNNER_TEMP%\h.txt" >nul && (echo CASE cmd-history-push PASS) || (echo CASE cmd-history-push FAIL & type "%RUNNER_TEMP%\h.txt" & exit /b 1)
          echo RESULT 2/2

      - name: 5b. PC installer registers the one-source stop hook (Git Bash)
        if: (runner.os == 'Windows') && env.LEG_OFF != '1'
        shell: pwsh
        working-directory: kih
        run: |
          $s = Join-Path $env:RUNNER_TEMP 'settings.json'
          $old = "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$PWD\tools\wkharness-claude-stop.ps1`""
          @{ hooks = @{ Stop = @(@{ hooks = @(@{ type = 'command'; command = $old; timeout = 10 }) }) } } | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 $s
          & ./tools/wkharness-claude-install.ps1 -SettingsPath $s -SkipRepoint | Out-Null
          $cfg = Get-Content -Raw $s | ConvertFrom-Json
          $stop = @($cfg.hooks.Stop | ForEach-Object { $_.hooks } | ForEach-Object { $_.command })
          $sub = @($cfg.hooks.SubagentStop | ForEach-Object { $_.hooks } | ForEach-Object { $_.command })
          $pass = 0
          $c1 = ($stop.Count -eq 1) -and ($stop[0] -match 'wkharness-run\.sh" stop --global$') -and ($stop[0] -notmatch 'System32')
          Write-Host ("CASE stop-repointed-to-run-sh {0} ({1})" -f $(if ($c1) { $pass++; 'PASS' } else { 'FAIL' }), ($stop -join ' | '))
          $arc = @($sub | Where-Object { $_ -match 'wkharness-run\.sh" stop-archive --global$' })
          Write-Host ("CASE subagentstop-archive-registered {0}" -f $(if ($arc.Count -eq 1) { $pass++; 'PASS' } else { 'FAIL' }))
          & ./tools/wkharness-claude-install.ps1 -SettingsPath $s -SkipRepoint | Out-Null
          $cfg2 = Get-Content -Raw $s | ConvertFrom-Json
          $n2 = @($cfg2.hooks.Stop | ForEach-Object { $_.hooks }).Count + @($cfg2.hooks.SubagentStop | ForEach-Object { $_.hooks } | Where-Object { $_.command -match 'stop-archive' }).Count
          Write-Host ("CASE second-install-idempotent {0} ($n2 hooks)" -f $(if ($n2 -eq 2) { $pass++; 'PASS' } else { 'FAIL' }))
          # The registered string itself must launch under cmd.exe (quoted Git Bash path); harness-off makes it exit 0 at once.
          New-Item -ItemType Directory -Force .tmp | Out-Null; New-Item -ItemType File -Force .tmp/harness-off | Out-Null
          '{}' | cmd /c $stop[0]; $rc = $LASTEXITCODE
          Remove-Item .tmp/harness-off
          Write-Host ("CASE registered-command-launches {0} (rc=$rc)" -f $(if ($rc -eq 0) { $pass++; 'PASS' } else { 'FAIL' }))
          Write-Host "RESULT $pass/4"
          if ($pass -ne 4) { exit 1 }

      - name: 5c. Agent-run ledger records a login failure (Agent.ps1 seam, owner 2026-10-28)
        if: env.LEG_OFF != '1'
        shell: pwsh
        working-directory: kih
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'ledger-home'
          $env:WK_AGENT_RUNS_DIR = Join-Path $h '.wkharness/agent-runs'
          $env:USERPROFILE = $h; $env:XAI_API_KEY = $null; $env:WK_GROK_CMD = $null
          $pass = 0
          . ./tools/wkharness-common-agentrun/Write-WkAgentRunRecord.ps1
          $env:WKAGENT_LOGIN_ERROR = $null
          'all good', 'Error: Not logged in. Please run /login', 'HTTP 401 again' | ForEach-Object { Test-WkAgentLoginLine $_ }
          $c = $env:WKAGENT_LOGIN_ERROR -eq 'Error: Not logged in. Please run /login'
          Write-Host ("CASE first-login-line-kept {0} ({1})" -f $(if ($c) { $pass++; 'PASS' } else { 'FAIL' }), $env:WKAGENT_LOGIN_ERROR)
          $env:WKAGENT_LOGIN_ERROR = $null
          pwsh -NoProfile -File ./tools/Agent.ps1 -Model grok -BackendOnly 'say hi' *> (Join-Path $env:RUNNER_TEMP 'agent.txt')
          $rc = $LASTEXITCODE
          $files = @(Get-ChildItem -Recurse -File $env:WK_AGENT_RUNS_DIR -Filter *.jsonl -ErrorAction SilentlyContinue)
          $rec = if ($files.Count -eq 1) { Get-Content -Raw $files[0].FullName | ConvertFrom-Json } else { $null }
          $c = $rec -and $rec.family -eq 'grok' -and [string]$rec.login_error -like 'GROK NEEDS:*' -and [int]$rec.rc -eq 3 -and $rec.prompt -eq 'say hi'
          Write-Host ("CASE grok-run-ledger-line {0} (rc=$rc files=$($files.Count) {1})" -f $(if ($c) { $pass++; 'PASS' } else { 'FAIL' }), $(if ($rec) { $rec | ConvertTo-Json -Compress } else { Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'agent.txt') }))
          $rows = if ($files.Count -eq 1) { python3 -I bin/wkhippo-reflex.py reflex $files[0].FullName --rows 2>&1 | Out-String } else { '' }
          $c = $rows -match '\|agent-login-error\|agentrun\|ok\|grok grok rc=3 login: GROK NEEDS'
          Write-Host ("CASE reflex-reads-login-error {0} ({1})" -f $(if ($c) { $pass++; 'PASS' } else { 'FAIL' }), $rows.Trim())
          Write-Host "RESULT $pass/3"
          if ($pass -ne 3) { exit 1 }

      - name: 5d. Install the family CLIs (claude, codex, grok, muse, agy)
        if: env.LEG_OFF != '1'
        shell: bash
        run: |
          # Every family the harness delegates to, installed the way its vendor documents (owner 2026-10-29).
          win=0; case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) win=1 ;; esac
          # GITHUB_PATH takes the native form: a /c/... MSYS path left grok and agy off the next pwsh step's PATH (Windows CI run 40793654141).
          addpath() { for d in "$@"; do [ -d "$d" ] && { if [ "$win" -eq 1 ]; then cygpath -w "$d" >> "$GITHUB_PATH"; else echo "$d" >> "$GITHUB_PATH"; fi; export PATH="$d:$PATH"; }; done; }
          found() { command -v "$1" >/dev/null 2>&1 && return 0
            f=$(find "$HOME" ${LOCALAPPDATA:+"$(cygpath -u "$LOCALAPPDATA" 2>/dev/null || echo "$LOCALAPPDATA")"} -maxdepth 5 \( -name "$1" -o -name "$1.exe" -o -name "$1.cmd" \) -type f 2>/dev/null | head -1)
            [ -n "$f" ] && addpath "$(dirname "$f")" && command -v "$1" >/dev/null 2>&1; }
          npm i -g @anthropic-ai/claude-code @openai/codex > "$RUNNER_TEMP/npm.log" 2>&1 || tail -5 "$RUNNER_TEMP/npm.log"
          python3 -m pip install -q muse-cli || true
          if [ "$win" -eq 1 ]; then
            pwsh -NoProfile -Command "irm https://x.ai/cli/install.ps1 | iex" > "$RUNNER_TEMP/grok.log" 2>&1 || tail -5 "$RUNNER_TEMP/grok.log"
            pwsh -NoProfile -Command "irm https://antigravity.google/cli/install.ps1 | iex" > "$RUNNER_TEMP/agy.log" 2>&1 \
              || pwsh -NoProfile -Command "irm https://antigravity.google/install.ps1 | iex" >> "$RUNNER_TEMP/agy.log" 2>&1 || tail -5 "$RUNNER_TEMP/agy.log"
          else
            curl -fsSL https://x.ai/cli/install.sh | bash > "$RUNNER_TEMP/grok.log" 2>&1 || tail -5 "$RUNNER_TEMP/grok.log"
            { curl -fsSL https://antigravity.google/cli/install.sh || curl -fsSL https://antigravity.google/install.sh; } | bash > "$RUNNER_TEMP/agy.log" 2>&1 || tail -5 "$RUNNER_TEMP/agy.log"
          fi
          addpath "$HOME/.local/bin" "$HOME/.grok/bin"
          n=0
          for c in claude codex grok agy; do
            if found "$c"; then n=$((n + 1)); echo "INSTALL $c PASS ($(command -v "$c"): $("$c" --version 2>&1 | head -1))"; else echo "INSTALL $c FAIL"; tail -3 "$RUNNER_TEMP/$c.log" 2>/dev/null; fi
          done
          if python3 -c "import muse_cli" 2>/dev/null; then n=$((n + 1)); echo "INSTALL muse PASS (muse-cli $(python3 -m pip show muse-cli 2>/dev/null | sed -n "s/^Version: //p"))"; else echo "INSTALL muse FAIL"; fi
          echo "RESULT $n/5"

      # On Windows agy answers a no-login run by opening Edge for its login; the NATIVE scan skips files Edge still holds open or removes mid-scan (run 40803302559).
      - name: 5e. Live -- each CLI run with no login lands its login error in the agent-run ledger (NATIVE lines measure the CLI's own session file)
        if: env.LEG_OFF != '1'
        shell: pwsh
        working-directory: kih
        run: ./tools/wkharness-common-agentrun/Test-WkAgentLoginLive.ps1 -Families claude,codex,grok,muse,agy -TimeoutSec 90 -Python python3

      - name: 5f. One installer -- install.cmd from bash (Linux, macOS, Git Bash) and cmd
        if: env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        run: |
          # Owner 2026-10-29: one installer for every platform; install.cmd is a cmd/bash polyglot and works from PowerShell too (5g).
          pass=0; total=2
          p=$(bash install.cmd --detect 2>&1 | tail -1)
          case "$RUNNER_OS:$p" in Windows:windows|macOS:macos) pass=$((pass + 1)); echo "CASE bash-install-cmd-detect PASS ($p)" ;; *) echo "CASE bash-install-cmd-detect FAIL ($p)" ;; esac
          rc=0
          if [ "$RUNNER_OS" = Windows ]; then cmd //c install.cmd > "$RUNNER_TEMP/inst.txt" 2>&1 || rc=$?; else bash install.cmd > "$RUNNER_TEMP/inst.txt" 2>&1 || rc=$?; fi
          tail -6 "$RUNNER_TEMP/inst.txt"
          s="$HOME/.claude/settings.json"; [ "$RUNNER_OS" = Windows ] && s="$(cygpath -u "$USERPROFILE")/.claude/settings.json"
          if grep -q 'wkharness-run.sh' "$s" 2>/dev/null; then pass=$((pass + 1)); echo "CASE install-cmd-wires-one-source-stop PASS (rc=$rc)"; else echo "CASE install-cmd-wires-one-source-stop FAIL (rc=$rc)"; fi
          echo "RESULT $pass/$total"; [ "$pass" -eq "$total" ]

      - name: 5g. One installer -- install.cmd from PowerShell
        if: (runner.os == 'Windows') && env.LEG_OFF != '1'
        shell: pwsh
        working-directory: kih
        run: |
          & ./install.cmd *> (Join-Path $env:RUNNER_TEMP 'inst-ps.txt'); $rc = $LASTEXITCODE
          Get-Content (Join-Path $env:RUNNER_TEMP 'inst-ps.txt') -Tail 4
          $ok = ($rc -eq 0) -and (Select-String -LiteralPath (Join-Path $env:USERPROFILE '.claude\settings.json') -Pattern 'wkharness-run.sh' -Quiet)
          Write-Host ("CASE pwsh-install-cmd {0} (rc=$rc)" -f $(if ($ok) { 'PASS' } else { 'FAIL' }))
          if (-not $ok) { exit 1 }

      - name: 6. Bash self-tests
        if: env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        run: |
          fail=0
          for t in "tools/wk-hippo-archive-selftest.sh $FX" tools/wk-hippo-backfill-all-selftest.sh tools/wk-haiku-seat-nudge-selftest.sh tools/wk-allows-learn-prompt-selftest.sh tools/wk-stop-archive-e2e-selftest.sh tools/wk-agent-families-history-selftest.sh tools/wk-harness-heal-selftest.sh tools/hippo-turn-push-selftest.sh; do
            out=$(bash $t 2>&1) || true
            echo "== $t"; printf '%s\n' "$out" | grep -E '^CASE .* FAIL|^RESULT' || true
            r=$(printf '%s\n' "$out" | grep '^RESULT' | tail -1 || true); set -- $r
            [ -n "$r" ] && [ "${2%%/*}" = "${2##*/}" ] || { fail=1; printf '%s\n' "$out" | grep -vE '^CASE|^RESULT' | tail -8 || true; }
          done
          exit $fail

      - name: 7. Bash self-tests under /bin/bash 3.2 (stock macOS)
        if: (runner.os == 'macOS') && env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        run: |
          fail=0
          for t in "tools/wk-hippo-archive-selftest.sh $FX" tools/wk-hippo-backfill-all-selftest.sh tools/wk-haiku-seat-nudge-selftest.sh tools/wk-allows-learn-prompt-selftest.sh tools/wk-stop-archive-e2e-selftest.sh tools/wk-agent-families-history-selftest.sh tools/wk-harness-heal-selftest.sh tools/hippo-turn-push-selftest.sh; do
            out=$(/bin/bash $t 2>&1) || true
            echo "== /bin/bash $t"; printf '%s\n' "$out" | grep -E '^CASE .* FAIL|^RESULT|line [0-9]+:' | head -15 || true
            r=$(printf '%s\n' "$out" | grep '^RESULT' | tail -1 || true); set -- $r
            [ -n "$r" ] && [ "${2%%/*}" = "${2##*/}" ] || fail=1
          done
          exit $fail

      - name: 8. wkappbot-code selftest (synthetic; real-hook cases b1/c1/f2 skipped)
        if: env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        run: |
          # Needs node, npm and python3 (aliased above). Drives the OpenCode plugin the way OpenCode does, plus the
          # installer, doctor, update and config parts with every network part mocked.
          set +e   # the runner's bash -e would exit on the failing $( ) before any FAIL line is printed
          out=$(bash wkappbot-code/selftest.sh --synthetic-only 2>&1); rc=$?
          # a FAIL detail can span lines: print each FAIL line plus its continuation up to the next PASS/FAIL/RESULT line
          printf '%s\n' "$out" | awk '/^(PASS|FAIL|RESULT)/{f=0} /^FAIL/{f=1} f||/^RESULT/' | cut -c1-600
          r=$(printf '%s\n' "$out" | grep '^RESULT' | tail -1); set -- $r
          [ "$rc" = 0 ] && [ -n "$r" ] && [ "${2%%/*}" = "${2##*/}" ] || { printf '%s\n' "$out" | tail -25; exit 1; }

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

  # kih wkappbot-code: the OpenCode end-to-end driver on the owner's two desktop platforms with PowerShell removed
  # from PATH (the "nopwsh" road a stock Mac or Linux box takes). macOS also runs it under /bin/bash 3.2.
  # Only PASS/FAIL/RESULT lines are printed.
  wkappbot-code-opencode-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - name: Checkout harness repo
        if: env.LEG_OFF != '1'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/wkappbot-kih
          ref: ${{ inputs.harness_ref || 'main' }}
          token: ${{ secrets.WKAPPBOT_CORE_PAT }}
          path: kih
      - name: Harness ref from the commit message (push runs)
        # A push whose head commit message has a line "harness-ref: <kih branch or sha>" tests that kih head
        # instead of main, so a kih branch can be proven here before it merges.
        if: (github.event_name == 'push') && env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ref=$(printf '%s\n' "$MSG" | sed -n 's/^harness-ref: *//p' | head -1 | tr -d '\r ')
          [ -n "$ref" ] || { echo "HARNESS-REF main"; exit 0; }
          printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]{1,100}$' || { echo "bad harness-ref"; exit 1; }
          git fetch --depth=1 origin "$ref" && git checkout -q FETCH_HEAD && echo "HARNESS-REF $ref $(git log -1 --format=%h)"
      - uses: actions/setup-node@v4
        if: env.LEG_OFF != '1'
        with:
          node-version: '20'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        if: env.LEG_OFF != '1'
        with:
          python-version: '3.12'
      - name: python3 alias (Windows)
        if: (runner.os == 'Windows') && env.LEG_OFF != '1'
        run: command -v python3 >/dev/null || cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
      - name: Remove pwsh from PATH
        if: env.LEG_OFF != '1'
        run: |
          np=""; IFS=:; for d in $PATH; do { [ -e "$d/pwsh" ] || [ -e "$d/pwsh.exe" ]; } && continue; np="$np${np:+:}$d"; done; unset IFS
          echo "NOPWSH_PATH=$np" >> "$GITHUB_ENV"
          PATH="$np" bash -c 'echo "pwsh on PATH: $(command -v pwsh || echo none)"'
      - name: Install OpenCode (the driver runs the real CLI)
        if: env.LEG_OFF != '1'
        run: |
          npm i -g opencode-ai > /dev/null 2>&1 || npm i -g opencode-ai
          echo "opencode $(opencode --version 2>&1 | head -1)"
      - name: selftest-opencode-e2e.sh nopwsh
        if: env.LEG_OFF != '1'
        working-directory: kih
        run: |
          set +e
          # macOS: /bin/bash is the stock 3.2 a Mac starts hooks with; Windows: Git Bash.
          shells="bash"; [ "$RUNNER_OS" = macOS ] && shells="/bin/bash"
          fail=0
          # Every driver line printed here goes through mask: a repo-relative path (no leading /, holds a /) or a
          # bare .ps1/.psm1 name can be a private kih file, so it prints only as an 8-hex sha256 of the name.
          # The lite harness, the e2e driver and pure-number counts (16/16) stay readable; absolute scratch paths
          # are not repo names.
          mask() { perl -MDigest::SHA=sha256_hex -pe 's{(?<![\w/.~:-])((?:[\w.-]+/)+[\w.-]+|[\w.-]+\.psm?1)\b}{my $n=$1; ($n=~m{^[\d./]+$|(^|/)wkharness-lite\.sh$|^wkappbot-code/selftest[\w.-]*\.sh$}) ? $n : "<name sha256:".substr(sha256_hex($n),0,8).">"}ge'; }
          # Windows npm needs these from the parent env; print presence only (names, never values).
          # MSYS bash can expose them upper-cased (COMSPEC), so both spellings are checked.
          if [ "$RUNNER_OS" = Windows ]; then
            for v in ComSpec COMSPEC SystemRoot SYSTEMROOT PATHEXT; do eval "x=\${$v+set}"; echo "ENV-PRESENT $v=${x:-unset}"; done
          fi
          for sh in $shells; do
            out=$(PATH="$NOPWSH_PATH" $sh wkappbot-code/selftest-opencode-e2e.sh nopwsh 2>&1); rc=$?
            # The pass/fail gate reads the RESULT line from the raw output, before any masking.
            r=$(printf '%s\n' "$out" | grep -E '^RESULT [0-9]+/[0-9]+' | tail -1)
            out=$(printf '%s\n' "$out" | mask)
            echo "== $sh ($($sh -c 'echo $BASH_VERSION')) rc=$rc"
            printf '%s\n' "$out" | grep -E '^(PASS|FAIL|SKIP|CASE|RESULT)' | head -80
            # The driver's install diagnostics (printed only when e2-install fails), already masked above.
            printf '%s\n' "$out" | grep -E '^(INSTALL-LOG|INSTALL-PATH|INSTALL-PREREQ)' | head -80
            set -- $r
            [ "$rc" = 0 ] && [ -n "$r" ] && [ "${2%%/*}" = "${2##*/}" ] || { fail=1; echo "-- last lines:"; printf '%s\n' "$out" | grep -v 'DROP ' | tail -20; }
            # Driver case blocks ("--- case <name>" + up to 8 lines: MOCK-DONE / guard refusal text) for diagnosis.
            # They hold only e2e scratch paths; raw DROP lines stay filtered.
            printf '%s\n' "$out" | grep -v 'DROP ' | awk '/^--- case /{n=9} n>0{print "CASEBLK " $0; n--}' | head -120
            # Bake drop report; names are already masked above.
            printf '%s\n' "$out" | grep -E 'DROP|MISSING' | sed 's/^/BAKE /'
          done
          exit $fail

      - name: Windows install prerequisites as the driver's parent sees them
        if: (failure() && runner.os == 'Windows') && env.LEG_OFF != '1'
        run: |
          # Presence and version only. The kih harness install.sh needs curl, tar and python3, and exits 1 if one is missing.
          for t in curl tar python3 python sha256sum sh git node; do
            p=$(PATH="$NOPWSH_PATH" command -v "$t" 2>/dev/null || echo MISSING); echo "PREREQ $t $p"
          done
          echo "PREREQ python3 --version: $(PATH="$NOPWSH_PATH" python3 --version 2>&1 | head -1)"
      - name: macOS c-write/c-edit diagnosis (scratch files only)
        if: (failure() && runner.os == 'macOS') && env.LEG_OFF != '1'
        working-directory: kih
        run: |
          set +e
          W=$(ls -dt "${TMPDIR:-/tmp}"/wkc-e2e-nopwsh.* /tmp/wkc-e2e-nopwsh.* 2>/dev/null | head -1)
          echo "WORKDIR ${W:-none}"
          [ -n "$W" ] || exit 0
          echo "FILES: $(cd "$W" && ls -1 | tr '\n' ' ')"
          for f in "$W"/case-write* "$W"/case-edit*; do
            [ -f "$f" ] || continue; echo "== $(basename "$f") ($(wc -c < "$f") bytes), last 40 lines raw"; tail -40 "$f" | cut -c1-400 | sed 's/^/  /'; echo
          done
          [ -f "$W/mock.log" ] && { echo "== mock.log, last 80 lines raw"; tail -80 "$W/mock.log" | cut -c1-400; }
          echo "== shim after the run: $(ls -l "$W/home/.local/bin/wkskill" 2>&1)"
          if [ -x "$W/home/.local/bin/wkskill" ]; then
            HOME="$W/home" PATH="$W/home/.local/bin:$NOPWSH_PATH" bash -c 'wkskill search write a project file; echo rc=$?' 2>&1 | tail -5
          else echo "(shim removed by the driver's uninstall step, so (c) cannot be replayed after the run)"; fi
          [ -f "$W/mock.out" ] && { echo "== mock.out tail"; tail -15 "$W/mock.out" | cut -c1-300; }
          echo "== proj: $(ls -la "$W/proj" 2>&1 | tail -n +2 | awk '{print $5, $NF}' | tr '\n' ';')"
          echo "== GNU-only constructs in the driver (line numbers + token only)"
          grep -noE '(^|[^g])timeout |date \+%N|stat -c|sed -i[^.]|readlink -f|grep -P|mktemp --|xargs -r|head -c -|sort -V|base64 -w' wkappbot-code/selftest-opencode-e2e.sh | head -20
          echo "== tools on this runner: timeout=$(command -v timeout || echo none) gtimeout=$(command -v gtimeout || echo none) base64=$(command -v base64)"
          # SIGTRAP (rc 133) reproduction in the driver's own PATH: which bash runs min-copy there, and does it trap?
          echo "== bash on NOPWSH_PATH: $(PATH="$NOPWSH_PATH" command -v bash) $(PATH="$NOPWSH_PATH" bash -c 'echo $BASH_VERSION')"
          T=$RUNNER_TEMP/mc2; mkdir -p "$T"
          for i in 1 2; do
            PATH="$NOPWSH_PATH" GIT_CONFIG_GLOBAL=/dev/null PS4='+L${LINENO}d${#FUNCNAME[@]} ' bash -x tools/wk-harness-min-copy.sh "$PWD" "$T/x$i" tools/wk-harness-min-manifest.txt >/dev/null 2>"$T/tr$i"; rc=$?
            echo "DRIVERPATH-XTRACE $i rc=$rc lines=$(wc -l < "$T/tr$i" | tr -d ' ')"
            [ "$rc" = 0 ] || echo "  last frames: $(grep -oE '^\++L[0-9]+d[0-9]+' "$T/tr$i" | tail -25 | tr '\n' ' ')"
          done

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

  # PS1 -> JS port parity proof (owner order 2026-11-06). A guard flips from shadow to authoritative JS only when its
  # corpus passes 100% here against the real ps1 on BOTH desktop platforms. ps1 runs under pwsh, and on Windows also
  # under Windows PowerShell 5.1; the "none" leg removes pwsh from PATH and proves the JS road alone still gives verdicts.
  # Prints only per-guard RESULT lines; the RESULT table is uploaded as an artifact.
  wkjs-parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, ps: pwsh }
          - { os: windows-latest, ps: powershell }
          - { os: windows-latest, ps: none }
          - { os: macos-latest, ps: pwsh }
          - { os: macos-latest, ps: none }
    name: wkjs-parity (${{ matrix.os }}, ${{ matrix.ps }})
    runs-on: ${{ matrix.os }}
    # kih PR 82 gives the PS5.1 oracle up to 45 min per slow row; the job cap must sit above it.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - name: Checkout harness repo
        if: env.LEG_OFF != '1'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/wkappbot-kih
          ref: ${{ inputs.harness_ref || 'main' }}
          token: ${{ secrets.WKAPPBOT_CORE_PAT }}
          path: kih
      - name: Harness ref from the commit message (push runs)
        # A push whose head commit message has a line "harness-ref: <kih branch or sha>" tests that kih head
        # instead of main, so a kih branch can be proven here before it merges.
        if: (github.event_name == 'push') && env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ref=$(printf '%s\n' "$MSG" | sed -n 's/^harness-ref: *//p' | head -1 | tr -d '\r ')
          [ -n "$ref" ] || { echo "HARNESS-REF main"; exit 0; }
          printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]{1,100}$' || { echo "bad harness-ref"; exit 1; }
          git fetch --depth=1 origin "$ref" && git checkout -q FETCH_HEAD && echo "HARNESS-REF $ref $(git log -1 --format=%h)"
      - uses: actions/setup-node@v4
        if: env.LEG_OFF != '1'
        with:
          node-version: '20'
      - name: Harness commit and hosts
        if: env.LEG_OFF != '1'
        working-directory: kih
        run: |
          echo "HARNESS $(git log -1 --format='%h %cs')"
          echo "NODE $(node --version)"
          echo "PWSH $(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' 2>/dev/null || echo none)"
          [ "$RUNNER_OS" = Windows ] && echo "WINPS $(powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          for f in tools/wkjs/parity.js tools/wkjs/registry.json tools/wkjs/contract.js tools/wkjs/hub.js; do
            [ -f "$f" ] && echo "HAS $f" || echo "MISSING $f"
          done
          [ -f tools/wkjs/parity.js ] && for flag in --all --against-ps1 --ps-host --json; do
            echo "FLAG $flag $(grep -c -- "$flag" tools/wkjs/parity.js)"; done
          true
      - name: Remove pwsh from PATH (none leg)
        if: (matrix.ps == 'none') && env.LEG_OFF != '1'
        run: |
          np=""; IFS=:; for d in $PATH; do { [ -e "$d/pwsh" ] || [ -e "$d/pwsh.exe" ]; } && continue; np="$np${np:+:}$d"; done; unset IFS
          # Kept as a bash-side PATH: on Windows GITHUB_ENV wants a Windows-style PATH, so the run step applies it inline.
          echo "NOPWSH_PATH=$np" >> "$GITHUB_ENV"
      - name: Break one JS guard in the runner copy (negative proof, dispatch input)
        if: (inputs.break_guard) && env.LEG_OFF != '1'
        working-directory: kih
        run: |
          g=$(node -e '
            const fs=require("fs"),p=require("path");const r=JSON.parse(fs.readFileSync("tools/wkjs/registry.json","utf8"));
            const out=[];(function w(v){if(typeof v==="string"&&/\.js$/.test(v))out.push(v);else if(v&&typeof v==="object")Object.values(v).forEach(w)})(r);
            const f=out.map(x=>[x,p.join("tools/wkjs",x)]).flat().find(x=>fs.existsSync(x));console.log(f||"")')
          [ -n "$g" ] || { echo "no guard file found in registry.json"; exit 1; }
          # Invert every verdict: any "allow" becomes "deny" and the reverse, so the corpus cannot stay green.
          node -e 'const fs=require("fs"),f=process.argv[1];let s=fs.readFileSync(f,"utf8");
            s=s.replace(/(["\x27])(allow|deny|block)\1/g,(m,q,v)=>q+(v==="allow"?"deny":"allow")+q);fs.writeFileSync(f,s)' "$g"
          echo "BROKEN $(basename "$g")"
      - name: Parity run
        if: env.LEG_OFF != '1'
        working-directory: kih
        env:
          WKJS_PS_HOST: ${{ matrix.ps }}
          # Asks parity.js (kih) to print one DETAIL line per mismatched case: ps1 exit status, ps1 stderr head
          # and both verdict texts. Ignored by a parity.js that does not know it.
          WKJS_PARITY_VERBOSE: "1"
        run: |
          set +e
          out_f="$RUNNER_TEMP/parity-${{ runner.os }}-${{ matrix.ps }}.txt"
          if [ "${{ matrix.ps }}" = none ]; then
            export PATH="$NOPWSH_PATH"
            echo "pwsh on PATH: $(command -v pwsh || echo none)"
            out=$(node tools/wkjs/parity.js --all 2>&1); rc=$?
          else
            out=$(node tools/wkjs/parity.js --all --against-ps1 --ps-host "${{ matrix.ps }}" 2>&1); rc=$?
          fi
          printf '%s\n' "$out" | grep -E '^(RESULT|MISMATCH|FAIL|PSHOST)' > "$out_f"
          cat "$out_f"
          # DETAIL lines can carry stderr with private kih paths or file names: every path-like token
          # (holds / or \) and every .ps1/.psm1/.js name prints only as an 8-hex sha256 of itself; pure counts
          # such as 14/15 stay readable.
          printf '%s\n' "$out" | grep -E '^DETAIL ' | head -40 | perl -MDigest::SHA=sha256_hex -pe 's{([^\s"'"'"'():,]*[/\\][^\s"'"'"'():,]*|[\w.-]+\.(?:psm?1|js))}{my $n=$1; $n=~m{^[\d./]+$} ? $n : "<name sha256:".substr(sha256_hex($n),0,8).">"}ge' | cut -c1-1000
          { echo "### wkjs parity ${{ runner.os }} / ${{ matrix.ps }} (rc=$rc)"; echo '```'; cat "$out_f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ -s "$out_f" ] || { echo "no RESULT lines"; printf '%s\n' "$out" | grep -E 'rror|nknown|sage' | head -10; exit 1; }
          grep -qE '^(MISMATCH|FAIL|PSHOST|SKIP)' "$out_f" && [ "$rc" = 0 ] && rc=1
          # Every registered guard must print its own RESULT line, so none can drop out of the proof unseen.
          want=$(node -e 'const r=require("./tools/wkjs/registry.json");let n=0;for(const v of Object.values(r.events||{}))if(Array.isArray(v))n+=v.length;console.log(n)' 2>/dev/null || echo "?")
          got=$(grep -E '^RESULT ' "$out_f" | grep -vc '^RESULT ALL ' || true)
          echo "GUARDS registered=$want reported=$got" | tee -a "$out_f"
          [ "$want" = "$got" ] || { echo "GUARD COUNT MISMATCH"; [ "$rc" = 0 ] && rc=1; }
          exit $rc
      - name: Upload RESULT table
        if: (always()) && env.LEG_OFF != '1'
        uses: actions/upload-artifact@v4
        with:
          name: wkjs-parity-${{ runner.os }}-${{ matrix.ps }}
          path: ${{ runner.temp }}/parity-*.txt
          if-no-files-found: ignore

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

  # Per-file selftests of new kih harness tools on each desktop shell (spokesman 2026-11-06 for kih ROOT I).
  # Prints only RESULT/FAIL lines; a leg fails unless its RESULT reads p/p.
  # Owner 2026-11-07: the README's "Install without npm" one-liners must install every required tool on a fresh
  # machine. Fresh HOME, no node or npm on PATH; the exact README line is run, so README drift fails the leg.
  web-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        py: [real]
        include:
          # Owner 2026-11-09: only the Store python alias -> install.ps1 must install a python itself (ensurePython).
          - { os: windows-latest, py: stub }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - uses: actions/checkout@v5
        if: env.LEG_OFF != '1'
        with:
          sparse-checkout: |
            README.md
            scripts/win-python-store-stub.ps1
          sparse-checkout-cone-mode: false
      - name: Store python stub first on PATH, real python hidden (py=stub)
        if: matrix.py == 'stub' && env.LEG_OFF != '1'
        shell: powershell
        run: '& scripts/win-python-store-stub.ps1'
      - name: Fresh HOME, no node or npm on PATH, README line extracted
        if: env.LEG_OFF != '1'
        run: |
          set -u
          H="$RUNNER_TEMP/fresh-home"; rm -rf "$H"; mkdir -p "$H/.claude"
          # A prior setting the installer must keep.
          printf '{"theme":"dark","permissions":{"allow":["Bash(ls)"]}}\n' > "$H/.claude/settings.json"
          np=""; IFS=:; for d in $PATH; do
            { [ -e "$d/node" ] || [ -e "$d/node.exe" ] || [ -e "$d/npm" ] || [ -e "$d/npm.cmd" ]; } && continue
            np="$np${np:+:}$d"; done; unset IFS
          echo "FRESH_HOME=$H" >> "$GITHUB_ENV"; echo "NONODE_PATH=$np" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            want='irm https://kiexpert.github.io/wkappbot-kih/webvm/x64/harness/install.ps1 | iex'
          else
            want='curl -fsSL https://kiexpert.github.io/wkappbot-kih/webvm/x64/harness/install.sh | sh'
          fi
          # README drift: the exact command line must be in the README, or the leg fails here.
          grep -qxF "$want" README.md || { echo "README DRIFT: README.md has no line exactly: $want"; exit 1; }
          printf '%s\n' "$want" > "$RUNNER_TEMP/readme-line.txt"; echo "README LINE: $want"
      - name: Run the README line (Linux, macOS)
        if: (runner.os != 'Windows') && env.LEG_OFF != '1'
        run: |
          export HOME="$FRESH_HOME" PATH="$NONODE_PATH"
          if command -v node >/dev/null 2>&1 || command -v npm >/dev/null 2>&1; then echo "node or npm still on PATH"; exit 1; fi
          sh -c "$(cat "$RUNNER_TEMP/readme-line.txt")"; echo "INSTALL rc=$?"
      - name: Run the README line (Windows PowerShell 5.1)
        if: (runner.os == 'Windows') && env.LEG_OFF != '1'
        shell: powershell
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and -not ((Test-Path (Join-Path $_ 'node.exe')) -or (Test-Path (Join-Path $_ 'npm.cmd'))) }) -join ';'
          if ((Get-Command node -ErrorAction SilentlyContinue) -or (Get-Command npm -ErrorAction SilentlyContinue)) { Write-Host 'node or npm still on PATH'; exit 1 }
          # Every variable PowerShell, Git sh and python read a home from points at the fresh profile.
          $fh = $env:FRESH_HOME -replace '/', '\'
          $env:USERPROFILE = $fh; $env:HOME = $fh; $env:HOMEDRIVE = $fh.Substring(0, 2); $env:HOMEPATH = $fh.Substring(2)
          $line = (Get-Content -Raw "$env:RUNNER_TEMP\readme-line.txt").Trim()
          # A child Windows PowerShell so $HOME is the fresh profile and the installer's own exit ends only it.
          powershell -NoProfile -ExecutionPolicy Bypass -Command $line
          Write-Host "INSTALL rc=$LASTEXITCODE"
          exit $LASTEXITCODE
      - name: After install, a fresh PATH runs python3 (py=stub; install.ps1 must have installed a python)
        if: always() && matrix.py == 'stub' && env.LEG_OFF != '1'
        run: |
          set +e
          fresh="$(powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('PATH','Machine')+';'+[Environment]::GetEnvironmentVariable('PATH','User')")"
          np=""; IFS=:; for d in $(cygpath -p "$fresh"); do
            { [ -e "$d/node" ] || [ -e "$d/node.exe" ] || [ -e "$d/npm" ] || [ -e "$d/npm.cmd" ]; } && continue
            np="$np${np:+:}$d"; done; unset IFS
          echo "NONODE_PATH=$np" >> "$GITHUB_ENV"
          o="$(PATH="$np" python3 -c 'print(3)' 2>&1)"; rc=$?
          echo "fresh PATH: python3 -> $(PATH="$np" command -v python3 || echo none), rc=$rc '$o'"
          [ "$o" = 3 ] || { echo "FAIL python3 does not run on a fresh PATH after the web install (Store stub only)"; exit 1; }
      - name: REQUIRED-TOOLS and install assertions
        if: (always()) && env.LEG_OFF != '1'
        run: |
          set +e
          H="$FRESH_HOME"; D="$H/.wk-harness"; S="$H/.claude/settings.json"; n=0; ok=0; miss=""
          chk() { n=$((n+1)); if eval "$2" >/dev/null 2>&1; then ok=$((ok+1)); echo "PASS $1"; else echo "FAIL $1"; fi; }
          echo "REQUIRED-TOOLS ($RUNNER_OS, PATH without node/npm)"
          if [ "$RUNNER_OS" = Windows ]; then tools="tar.exe sh.exe python|python3 powershell"; else tools="curl tar python3 sha256sum|shasum sh"; fi
          for t in $tools; do
            p=""; for alt in $(echo "$t" | tr '|' ' '); do p=$(PATH="$NONODE_PATH" command -v "$alt" 2>/dev/null) && break; done
            printf '  %-18s %s\n' "$t" "${p:-MISSING}"; n=$((n+1)); [ -n "$p" ] && ok=$((ok+1)) || miss="$miss $t"
          done
          [ -z "$miss" ] || echo "FAIL required tool missing:$miss"
          chk "unpacked ~/.wk-harness/tools/wkharness-lite.sh" "[ -f '$D/tools/wkharness-lite.sh' ]"
          chk "installed-version written" "[ -s '$D/.installed-version' ]"
          PY=$(PATH="$NONODE_PATH" command -v python3 || PATH="$NONODE_PATH" command -v python)
          cat > "$RUNNER_TEMP/hooks_ok.py" <<'EOF'
          import json, sys
          h = json.load(open(sys.argv[1], encoding="utf-8")).get("hooks", {})
          missing = [e for e in ("PreToolUse", "Stop", "UserPromptSubmit", "SessionStart") if "wkharness-lite.sh" not in json.dumps(h.get(e, ""))]
          print("hooks missing: " + ",".join(missing) if missing else "hooks: 4/4 lite")
          sys.exit(1 if missing else 0)
          EOF
          "$PY" "$RUNNER_TEMP/hooks_ok.py" "$S"
          chk "settings.json carries the 4 lite hooks" "'$PY' '$RUNNER_TEMP/hooks_ok.py' '$S'"
          chk "settings.json kept prior settings (theme, permissions)" "grep -q '\"theme\"' '$S' && grep -q 'Bash(ls)' '$S'"
          v=$(HOME="$H" PATH="$NONODE_PATH" sh "$D/tools/wkharness-lite.sh" --verify 2>&1); echo "VERIFY: $(printf '%s' "$v" | tail -1)"
          chk "lite verify PASS 6/6" "printf '%s' \"\$v\" | grep -q 'PASS 6/6'"
          echo "RESULT $ok/$n"
          [ "$ok" = "$n" ]

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

  # Spokesman 2026-11-07: Agent.cmd routing and the polyglot launcher on every OS. The routing selftest runs under
  # pwsh; Agent.cmd --help runs through sh on Linux/macOS and through cmd on Windows. A run that leaves a new
  # *.tmp file in the checkout fails the leg (".tmp-free").
  agent-cmd-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - name: Checkout harness repo
        if: env.LEG_OFF != '1'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/wkappbot-kih
          ref: ${{ inputs.harness_ref || 'main' }}
          token: ${{ secrets.WKAPPBOT_CORE_PAT }}
          path: kih
      - name: Harness ref from the commit message (push runs)
        # A push whose head commit message has a line "harness-ref: <kih branch or sha>" tests that kih head
        # instead of main, so a kih branch can be proven here before it merges.
        if: (github.event_name == 'push') && env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ref=$(printf '%s\n' "$MSG" | sed -n 's/^harness-ref: *//p' | head -1 | tr -d '\r ')
          [ -n "$ref" ] || { echo "HARNESS-REF main"; exit 0; }
          printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]{1,100}$' || { echo "bad harness-ref"; exit 1; }
          git fetch --depth=1 origin "$ref" && git checkout -q FETCH_HEAD && echo "HARNESS-REF $ref $(git log -1 --format=%h)"

      - name: Agent routing selftest and Agent.cmd --help
        if: env.LEG_OFF != '1'
        working-directory: kih
        run: |
          set +e
          echo "HARNESS $(git log -1 --format='%h %cs')"
          before=$(find . -name '*.tmp' -not -path './.git/*' | sort)
          n=0; ok=0
          chk() { n=$((n+1)); if [ "$1" = 0 ]; then ok=$((ok+1)); echo "PASS $2"; else echo "FAIL $2 (rc=$1)"; fi; }
          if [ -f tools/Agent.routing-selftest.ps1 ]; then
            out=$(pwsh -NoProfile -File tools/Agent.routing-selftest.ps1 2>&1); rc=$?
            printf '%s\n' "$out" | grep -E '^(RESULT|FAIL)' | head -20 | sed 's/^/  [routing] /'
            chk $rc "Agent.routing-selftest.ps1 (pwsh)"
          else
            chk 1 "Agent.routing-selftest.ps1 present"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            out=$(cmd //c "tools\\Agent.cmd --help" 2>&1); rc=$?
            label="tools\\Agent.cmd --help (cmd)"
          else
            out=$(sh tools/Agent.cmd --help 2>&1); rc=$?
            label="sh tools/Agent.cmd --help"
          fi
          echo "  [help] $(printf '%s\n' "$out" | grep -c .) lines of help output"
          chk $rc "$label"
          after=$(find . -name '*.tmp' -not -path './.git/*' | sort)
          new=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | grep -c . || true)
          [ "$new" = 0 ]; chk $? ".tmp-free (new .tmp files: $new)"
          echo "RESULT $ok/$n"
          [ "$ok" = "$n" ]

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

  # Owner 2026-11-07: a11y support per platform, measured before it is advertised. Downloads the published portable
  # binary for the runner (releases/latest, sha256-checked against SHA256SUMS) and runs the a11y discovery commands a
  # user would try first. Every command prints rc and its first lines; RESULT n/n counts the commands that exit 0 and
  # print something. A README line per platform is added only once its leg is green.
  a11y-qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: wkappbot-linux-x64, probe: '*wkappbot-probe*', button: '*Yes*', mode: desktop }
          # Owner 2026-11-07: with no display, a headless CDP Chrome is the whole world for a11y.
          - { os: ubuntu-latest, asset: wkappbot-linux-x64, probe: '*wkappbot-probe*', button: '*Yes*', mode: headless }
          - { os: macos-latest,  asset: wkappbot-osx-arm64, probe: '*Finder*', button: '', mode: desktop }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - name: Download the published binary and check its sha256
        if: env.LEG_OFF != '1'
        run: |
          set -e
          base=https://github.com/${{ github.repository }}/releases/latest/download
          curl -fsSL "$base/SHA256SUMS" -o SHA256SUMS
          curl -fsSL "$base/${{ matrix.asset }}" -o wkappbot
          want=$(awk -v n="${{ matrix.asset }}" '$2==n {print $1}' SHA256SUMS)
          got=$( (sha256sum wkappbot 2>/dev/null || shasum -a 256 wkappbot) | cut -d' ' -f1)
          echo "ASSET ${{ matrix.asset }} sha256 want=${want:0:16} got=${got:0:16}"
          [ -n "$want" ] && [ "$want" = "$got" ]
          chmod +x wkappbot
      - name: Linux desktop for AT-SPI (Xvfb, session D-Bus, at-spi bus, one GTK app)
        if: (runner.os == 'Linux' && matrix.mode == 'desktop') && env.LEG_OFF != '1'
        run: |
          # Owner 2026-11-07: Linux a11y means AT-SPI on an X server. zenity is a GTK app whose question dialog has
          # Yes and No buttons; a11y find must list them by name.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb at-spi2-core dbus-x11 zenity >/dev/null
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          eval "$(dbus-launch --sh-syntax)"
          for b in /usr/libexec/at-spi-bus-launcher /usr/lib/at-spi2-core/at-spi-bus-launcher; do
            [ -x "$b" ] && { "$b" --launch-immediately >/dev/null 2>&1 & break; }
          done
          sleep 2
          NO_AT_BRIDGE=0 GTK_MODULES=gail:atk-bridge zenity --question --title=wkappbot-probe --text=wkappbot-probe >/dev/null 2>&1 &
          sleep 3
          { echo "DISPLAY=$DISPLAY"; echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"; } >> "$GITHUB_ENV"
          echo "DESKTOP Xvfb=:99 dbus=$( [ -n "$DBUS_SESSION_BUS_ADDRESS" ] && echo up || echo down ) atspi=$(pgrep -f at-spi-bus-launcher >/dev/null && echo up || echo down) zenity=$(pgrep zenity >/dev/null && echo up || echo down)"
      - name: Headless world (no X, no desktop) -- one headless Chrome on CDP with a probe page
        if: (matrix.mode == 'headless') && env.LEG_OFF != '1'
        run: |
          unset DISPLAY
          mkdir -p probe && printf '%s\n' '<!doctype html><title>wkappbot-probe</title><h1>wkappbot-probe</h1><p>Headless a11y probe text.</p><button>Yes</button><button>No</button>' > probe/index.html
          (cd probe && python3 -m http.server 8765 >/dev/null 2>&1 &)
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$chrome" --headless=new --no-sandbox --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/chrome" http://127.0.0.1:8765/ >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep 1; done
          echo "HEADLESS DISPLAY=${DISPLAY:-none} chrome=$(basename "$chrome") cdp=$(curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && echo up || echo down) tabs=$(curl -fsS http://127.0.0.1:9222/json/list 2>/dev/null | grep -c '"type": "page"')"
      - name: a11y discovery commands
        if: env.LEG_OFF != '1'
        run: |
          set +e
          n=0; ok=0
          run() { label="$1"; shift; n=$((n+1))
            out=$(./wkappbot "$@" 2>&1); rc=$?
            lines=$(printf '%s\n' "$out" | grep -c .)
            if [ "$rc" = 0 ] && [ "$lines" -gt 0 ]; then ok=$((ok+1)); s=PASS; else s=FAIL; fi
            echo "$s $label rc=$rc lines=$lines"
            printf '%s\n' "$out" | head -8 | cut -c1-160 | sed 's/^/    /'
          }
          run "--version" --version
          run "a11y --help" a11y --help
          run "a11y windows" a11y windows
          run "a11y find ${{ matrix.probe }}" a11y find '${{ matrix.probe }}'
          run "a11y inspect ${{ matrix.probe }}" a11y inspect '${{ matrix.probe }}'
          if [ '${{ matrix.mode }}' = headless ]; then
            unset DISPLAY
            run "a11y read ${{ matrix.probe }} (page as text)" a11y read '${{ matrix.probe }}'
          fi
          if [ -n '${{ matrix.button }}' ]; then
            run "a11y find ${{ matrix.probe }} button ${{ matrix.button }}" a11y find '${{ matrix.probe }}#${{ matrix.button }}'
          fi
          echo "RESULT $ok/$n (${{ runner.os }} ${{ matrix.mode }} a11y)"
          [ "$ok" = "$n" ]
      - name: AT-SPI reference probe (python pyatspi, the platform path wkappbot a11y must match)
        if: (always() && runner.os == 'Linux' && matrix.mode == 'desktop') && env.LEG_OFF != '1'
        run: |
          # Spokesman 2026-11-07, proven on a cloud VM: AT-SPI lists the GTK app's buttons by name and doAction clicks one.
          # This is the reference the wkappbot a11y backend has to match; it does not use wkappbot.
          sudo apt-get install -y -qq python3-pyatspi python3-gi gir1.2-gtk-3.0 >/dev/null
          py=$(command -v python3.12 || command -v python3)
          cat > "$RUNNER_TEMP/atspi_ref.py" <<'EOF'
          import sys, time, pyatspi
          desk = pyatspi.Registry.getDesktop(0)
          def walk(a, depth=0):
              if depth > 12 or a is None: return
              yield a
              for i in range(a.childCount):
                  try: yield from walk(a.getChildAtIndex(i), depth + 1)
                  except Exception: pass
          win = None
          for app in desk:
              for node in walk(app):
                  if node.getRoleName() in ("dialog", "frame", "alert") and "wkappbot-probe" in (node.name or ""):
                      win = node; break
              if win: break
          ok = n = 0
          n += 1
          if win: ok += 1; print("PASS ref window found by name: wkappbot-probe")
          else: print("FAIL ref window wkappbot-probe not found"); print("RESULT %d/%d (AT-SPI reference)" % (ok, n)); sys.exit(1)
          buttons = [b for b in walk(win) if b.getRoleName() == "push button"]
          names = [b.name for b in buttons]
          n += 1
          if any(x in ("Yes", "No") for x in names): ok += 1; print("PASS ref buttons by name: %s" % names)
          else: print("FAIL ref buttons by name: %s" % names)
          n += 1
          target = next((b for b in buttons if b.name == "No"), None)
          try:
              target.queryAction().doAction(0); ok += 1; print("PASS ref doAction clicked No by name")
          except Exception as ex:
              print("FAIL ref doAction on No: %s" % type(ex).__name__)
          print("RESULT %d/%d (AT-SPI reference)" % (ok, n))
          sys.exit(0 if ok == n else 1)
          EOF
          "$py" "$RUNNER_TEMP/atspi_ref.py"
          sleep 1; echo "REF zenity after click: $(pgrep zenity >/dev/null && echo still-open || echo closed)"

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

  a11y-linux-gtk:
    # Spokesman 2026-11-07: the kih GTK probe (tools/a11y-linux/atspi-find-invoke.py) opens a window with
    # Order / Cancel / Confirm payment, finds all three over AT-SPI by name and clicks Cancel with doAction.
    # It is the model for wkappbot a11y find/invoke on Linux. gi is built for python3.12 on the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - uses: actions/checkout@v4
        if: env.LEG_OFF != '1'
        with:
          repository: ${{ github.repository_owner }}/wkappbot-kih
          token: ${{ secrets.WKAPPBOT_CORE_PAT }}
          path: kih
      - name: Harness ref from the commit message (push runs)
        if: (github.event_name == 'push') && env.LEG_OFF != '1'
        working-directory: kih
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ref=$(printf '%s\n' "$MSG" | sed -n 's/^harness-ref: *//p' | head -1 | tr -d '\r ')
          [ -n "$ref" ] || { echo "HARNESS-REF main"; exit 0; }
          printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]{1,100}$' || { echo "bad harness-ref"; exit 1; }
          git fetch --depth=1 origin "$ref" && git checkout -q FETCH_HEAD && echo "HARNESS-REF $ref $(git log -1 --format=%h)"
      - name: GTK probe over AT-SPI (find by name + doAction)
        if: env.LEG_OFF != '1'
        working-directory: kih
        run: |
          probe=tools/a11y-linux/atspi-find-invoke.py
          [ -f "$probe" ] || { echo "FAIL probe not in this kih ref (it lives on kih spk-a11y-linux until merged)"; echo "RESULT 0/1 (Linux GTK a11y)"; exit 1; }
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb at-spi2-core dbus-x11 python3-pyatspi python3-gi gir1.2-gtk-3.0 >/dev/null
          py=$(command -v python3.12 || command -v python3)
          echo "PY $($py --version 2>&1)"
          out=$(xvfb-run -a dbus-run-session -- "$py" -u "$probe" 2>&1) && rc=0 || rc=$?
          # Private kih paths and file names are sha256-masked like the e2e job; pure counts stay readable.
          mask() { perl -MDigest::SHA=sha256_hex -pe 's{(?<![\w/.~:-])(/?(?:[\w.-]+/)+[\w.-]+|[\w.-]+\.(?:py|psm?1|sh))\b}{my $n=$1; ($n=~m{^[\d./]+$}) ? $n : "<name sha256:".substr(sha256_hex($n),0,8).">"}ge'; }
          echo "PROBE rc=$rc lines=$(printf '%s\n' "$out" | wc -l)"
          printf '%s\n' "$out" | head -60 | cut -c1-300 | mask
          printf '%s\n' "$out" | grep -qE 'RESULT [0-9]+/[0-9]+' || { echo "FAIL probe printed no RESULT line (rc=$rc)"; echo "RESULT 0/1 (Linux GTK a11y)"; exit 1; }
          exit $rc

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

  kih-tool-selftests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Network probe and leg filter (a dead network respawns this leg on a fresh runner)
        shell: bash
        env:
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          ONLY_LEG: ${{ inputs.only_leg }}
          FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/hwq-respawn-b-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/hwq-respawn-a-') && github.job == 'web-install' && matrix.os == 'ubuntu-latest')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
        run: |
          set +e
          if [ -n "$ONLY_LEG" ] && [ "$ONLY_LEG" != "$LEG_ID" ]; then echo "LEG_OFF=1" >> "$GITHUB_ENV"; echo "leg $LEG_ID is off in this respawn of $ONLY_LEG"; exit 0; fi
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then { echo "LEG_OFF=1"; echo "NET_DOWN=1"; echo "NET_WHY=probe:$down"; } >> "$GITHUB_ENV"; echo "::warning::$LEG_ID: network down at leg start:$down"; fi
      - name: Checkout harness repo
        if: env.LEG_OFF != '1'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/wkappbot-kih
          ref: ${{ inputs.harness_ref || 'main' }}
          token: ${{ secrets.WKAPPBOT_CORE_PAT }}
          path: kih
      - name: Harness ref from the commit message (push runs)
        # A push whose head commit message has a line "harness-ref: <kih branch or sha>" tests that kih head
        # instead of main, so a kih branch can be proven here before it merges.
        if: (github.event_name == 'push') && env.LEG_OFF != '1'
        shell: bash
        working-directory: kih
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ref=$(printf '%s\n' "$MSG" | sed -n 's/^harness-ref: *//p' | head -1 | tr -d '\r ')
          [ -n "$ref" ] || { echo "HARNESS-REF main"; exit 0; }
          printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]{1,100}$' || { echo "bad harness-ref"; exit 1; }
          git fetch --depth=1 origin "$ref" && git checkout -q FETCH_HEAD && echo "HARNESS-REF $ref $(git log -1 --format=%h)"
      - name: Selftests per shell
        if: env.LEG_OFF != '1'
        working-directory: kih
        run: |
          set +e
          echo "HARNESS $(git log -1 --format='%h %cs')"
          fail=0
          leg() {  # leg <label> <command...>
            label=$1; shift
            out=$("$@" 2>&1); rc=$?
            r=$(printf '%s\n' "$out" | grep -E '^RESULT' | tail -1)
            printf '%s\n' "$out" | grep -E '^(FAIL|RESULT)' | sed "s|^|  [$label] |" | head -20
            set -- $r
            if [ "$rc" = 0 ] && [ -n "$r" ] && [ "${2%%/*}" = "${2##*/}" ]; then echo "LEG $label PASS ($r)"
            else echo "LEG $label FAIL (rc=$rc, ${r:-no RESULT line})"; printf '%s\n' "$out" | grep -v '^RESULT' | tail -8 | sed "s/^/    /"; fail=1; fi
          }
          PS1T=tools/Get-WkRootDefaultModel-selftest.ps1
          SHT=tools/wkharness-lite-createsession-selftest.sh
          for f in "$PS1T" "$SHT"; do [ -f "$f" ] || { echo "MISSING $f"; fail=1; }; done
          if [ -f "$PS1T" ]; then
            leg "pwsh $(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')" pwsh -NoProfile -File "$PS1T"
            if [ "$RUNNER_OS" = Windows ]; then
              leg "PS5.1 parse" powershell -NoProfile -Command "\$e=\$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '$PS1T'),[ref]\$null,[ref]\$e); if(\$e){\$e|%{'FAIL parse: '+\$_.Message}; 'RESULT 0/1'; exit 1}; 'RESULT 1/1'"
              leg "PS5.1 run" powershell -NoProfile -ExecutionPolicy Bypass -File "$PS1T"
            fi
          fi
          if [ -f "$SHT" ]; then
            if [ "$RUNNER_OS" = macOS ]; then
              leg "/bin/bash $(/bin/bash -c 'echo $BASH_VERSION')" /bin/bash "$SHT"
              leg "sh (macOS)" sh "$SHT"
            else
              leg "Git Bash sh $(sh -c 'echo $BASH_VERSION')" sh "$SHT"
            fi
          fi
          exit $fail

      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEG_ID: ${{ github.job }}:${{ join(matrix.*, '-') }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          HARNESS_REF: ${{ inputs.harness_ref || 'main' }}
          BREAK_GUARD: ${{ inputs.break_guard && 'true' || 'false' }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then echo "::error::$LEG_ID: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1; fi
          gh workflow run harness-windows-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f only_leg="$LEG_ID" -f respawn="$next" \
            -f parent="$PARENT" -f harness_ref="$HARNESS_REF" -f break_guard="$BREAK_GUARD" -f fake_net_fail="$FAKE_NEXT"
          echo "RESPAWNED, NETWORK: $LEG_ID -> fresh run 'leg=$LEG_ID respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG_ID: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG_ID respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"


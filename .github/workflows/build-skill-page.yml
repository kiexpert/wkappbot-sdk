name: build-skill-page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-skill-page:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build skill page
        run: python scripts/build-skill-page.py

      - name: Commit generated page
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if (git diff --cached --quiet) {
            Write-Host "No generated page changes."
            exit 0
          }
          git commit -m "chore: build skill page [skip ci]"
          git push

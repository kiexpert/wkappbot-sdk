name: build-skill-page

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-pages-docs:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify committed Pages docs
        shell: pwsh
        run: |
          git status --short

          foreach ($path in @('docs/index.html', 'docs/skills/index.html')) {
            if (Test-Path $path) {
              Write-Host "Found $path"
            } else {
              Write-Warning "$path is missing. GitHub Pages deploys from committed docs/ content; run scripts/build-skill-page.py locally before committing when regenerating the skill browser."
            }
          }

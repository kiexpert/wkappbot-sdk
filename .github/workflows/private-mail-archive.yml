name: private-mail-archive

# Owner 2026-11-28: spam may be deleted before it is fetched -> --purge-junk empties the junk folders
# on the server first (court/government senders are left in place).
# Owner rule 2026-11-28: every received mail except spam is collected in one private repo of this
# account. Every 2 hours this clones that repo (found by a sha256 prefix, never named), runs the
# repo's OWN scripts -- the all-folder incremental Naver archive (junk/spam folders skipped, only
# UIDs not yet saved are fetched) and the court-notice reader -- and commits the result back.
# Public log: counts only. Secrets NAVER_ID / NAVER_APP_PASSWORD are the owner's.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-mail-archive.yml
  schedule:
    - cron: '41 */2 * * *'

permissions:
  contents: read

concurrency:
  group: private-mail-archive
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_HASH: c48fcce9e0c13229
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"; echo "::add-mask::${n#*/}"; echo "::add-mask::$t"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"; exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1
      - name: Clone the target repo
        run: git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${REPO}.git" src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Court notices (repo script)
        continue-on-error: true
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
        working-directory: src
        run: |
          echo "::add-mask::${NAVER_ID}"
          python tools/court_mail_read.py --days 4 > ../court.log 2>&1 && grep -E '^court notices:' ../court.log || { echo "court read failed"; exit 1; }
      - name: All-folder mail archive except spam (repo script)
        # A backfill can outlast the job; stop at 30 min so the commit step still saves what was fetched
        # (each saved eml marks its UID done, so the next run resumes where this one stopped).
        continue-on-error: true
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
        working-directory: src
        run: |
          echo "::add-mask::${NAVER_ID}"
          timeout 30m python tools/naver_mail_archive.py --max-new 200 --purge-junk > ../mail.log 2>&1 \
            && grep -E '^(junk purged:|folder f?_?[a-z0-9_]+:|mail sync all:)' ../mail.log \
            || { echo "mail archive failed"; grep -E '^(REFUSE|Traceback|[A-Za-z]+Error)' ../mail.log | cut -c1-60; exit 1; }
      - name: Commit back to the target repo
        working-directory: src
        run: |
          set -eu
          git config user.name "personal-docs-mail"
          git config user.email "personal-docs-mail@users.noreply.github.com"
          git add -A resume/drafts/naver_mail resume/applications/20260824_2026ah12916_court_costs/court_mail
          if git diff --cached --quiet; then echo "no new mail"; exit 0; fi
          git commit -q -m "mail archive $(date -u +%F_%H%M) [cloud]"
          for i in 1 2 3 4; do
            if git push -q origin HEAD:main; then echo "pushed"; break; fi
            git pull -q --rebase origin main
            [ "$i" = 4 ] && { echo "push failed after retries"; exit 1; }
          done

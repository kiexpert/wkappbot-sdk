name: private-portal-qa

# Runs the private portal's own selftests, probes how far its in-browser Linux really runs, and
# takes demo screenshots, so a release or a demo rehearsal can be judged by eye and by numbers
# instead of by a green tick. It opens no port and runs no tunnel.
# The target repo is found by a sha256 prefix, never named; its name and every token are masked.
# The portal selftest drives Playwright itself, so chromium is installed BEFORE it runs.
# The probe reads the runtime base URL OUT OF the portal source: a hardcoded copy measured the old
# address for a whole day after the page had already been fixed (2026-11-01).
# SECRETS READ: WKAPPBOT_PAT, GH_LICENSE_TOKEN, WKAPPBOT_CORE_PAT (tried in that order).
# Live-twin selftests additionally read WK_QA_GH_TOKEN (=WKAPPBOT_PAT) and WK_QA_GL_TOKEN
# (=GITLAB_TOKEN), masked; they are opt-in per selftest case and do no live writes unless that
# case is enabled. A value that is empty or SET-ME counts as unset.
# WK_QA_LIVE_WRITE=1 (dispatch input live_write, default off) arms the P29 live-write twin, only on the
# throwaway GitLab project in WK_QA_LIVE_WRITE_PROJECT; the selftest owns its try/finally cleanup.
on:
  workflow_dispatch:
    inputs:
      live_write:
        description: 'Run the P29 live-WRITE twin against the throwaway GitLab project (owner-supervised runs only)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main, 'qa-video/**']
    paths:
      - .github/workflows/private-portal-qa.yml
  schedule:
    - cron: '41 21 * * *'

permissions:
  contents: read

concurrency:
  group: private-portal-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_HASH: ce712644e054789d
      T1: ${{ secrets.WKAPPBOT_PAT }}
      T2: ${{ secrets.GH_LICENSE_TOKEN }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
      WK_QA_GH_TOKEN: ${{ secrets.WKAPPBOT_PAT }}
      WK_QA_GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      # '1' only on a manual dispatch with live_write ticked; push and schedule runs never write.
      WK_QA_LIVE_WRITE: ${{ (github.event_name == 'workflow_dispatch' && inputs.live_write) && '1' || '' }}
      WK_QA_LIVE_WRITE_PROJECT: kiexpert-group/wksig
    steps:
      - name: Live-write gate
        run: |
          echo "live-write twin: $([ "$WK_QA_LIVE_WRITE" = 1 ] && echo "ON (project $WK_QA_LIVE_WRITE_PROJECT)" || echo off)"
      - name: Mask the live-twin tokens (explicit, on top of Actions auto-masking)
        run: |
          [ -n "${WK_QA_GH_TOKEN:-}" ] && echo "::add-mask::$WK_QA_GH_TOKEN" || true
          [ -n "${WK_QA_GL_TOKEN:-}" ] && echo "::add-mask::$WK_QA_GL_TOKEN" || true
          echo "live-twin tokens masked (gh set: $([ -n "${WK_QA_GH_TOKEN:-}" ] && echo yes || echo no), gl set: $([ -n "${WK_QA_GL_TOKEN:-}" ] && echo yes || echo no))"
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] && [ "$t" != "SET-ME" ] || continue
            echo "::add-mask::$t"
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"
                echo "::add-mask::${n#*/}"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"
                exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1
      - name: Check out the target
        run: git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${REPO}.git" site
      - uses: actions/setup-node@v5  # v4 runs on the deprecated Node 20 runtime
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm i -s playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Portal selftest
        run: node site/poc-site/portal/selftest.js
      - name: Site selftest
        run: node site/poc-site/selftest.js
      - name: In-browser Linux probe
        run: node site/ci/weblinux-probe.mjs
      - name: Screenshots, light and dark
        run: node site/ci/portal-shots.mjs
      - name: Leak-grep the demo artifacts (fail on any token prefix)
        run: |
          if [ -d shots ] && grep -rEI 'ghp_[A-Za-z0-9]|github_pat_[A-Za-z0-9]|glpat-[A-Za-z0-9]|sk-ant-[A-Za-z0-9]' shots ; then
            echo "TOKEN-PREFIX LEAK detected in demo artifacts"; exit 1
          fi
          echo "leak-grep: 0 (no token prefix in the demo artifacts)"
      - uses: actions/upload-artifact@v4
        with:
          name: portal-screens
          path: shots
          retention-days: 14

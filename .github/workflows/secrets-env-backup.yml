name: secrets-env-backup

# Writes every secret this repo can see into one .env, and when its sha256 changes, mails it to the
# owner as an AES-256 encrypted 7z (passphrase: secret ENV_BACKUP_PASSPHRASE, mail account: secrets
# NAVER_ID and NAVER_APP_PASSWORD). Nothing secret is printed or uploaded: the log shows key counts
# and a hash prefix only, and the change marker kept in the Actions cache is an empty file whose
# cache key carries the hash.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/secrets-env-backup.yml
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: secrets-env-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build the .env from every visible secret
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -eu
          umask 077
          python3 - <<'PY'
          import json, os, hashlib
          s = json.loads(os.environ['ALL_SECRETS'])
          s.pop('github_token', None)
          lines = []
          for k in sorted(s):
              v = s[k].replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n')
              lines.append(f'{k}="{v}"')
          body = '# GitHub secrets backup of kiexpert/wkappbot-sdk\n' + '\n'.join(lines) + '\n'
          open('.env', 'w').write(body)
          h = hashlib.sha256(body.encode()).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'ENV_HASH={h}\n')
          print(f'keys: {len(lines)}  hash: {h[:12]}')
          PY
      - name: Look up the last mailed hash
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: env-hash-marker
          key: env-hash-${{ env.ENV_HASH }}
          lookup-only: true
      - name: Encrypt and mail the .env
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          PASS: ${{ secrets.ENV_BACKUP_PASSPHRASE }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          MAIL_TO: kiexpert@naver.com
        run: |
          set -eu
          test -n "$PASS" || { echo "secret ENV_BACKUP_PASSPHRASE is not set: refusing to mail secrets unencrypted"; exit 1; }
          test -n "$NAVER_ID" && test -n "$NAVER_APP_PASSWORD" || { echo "secrets NAVER_ID and NAVER_APP_PASSWORD are not set"; exit 1; }
          7z a -t7z -mhe=on -p"$PASS" env-backup.7z .env > /dev/null
          python3 - <<'PY'
          import os, smtplib, ssl, datetime
          from email.message import EmailMessage
          uid = os.environ['NAVER_ID'].split('@')[0]
          m = EmailMessage()
          m['From'] = f'{uid}@naver.com'
          m['To'] = os.environ['MAIL_TO']
          stamp = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
          m['Subject'] = f'[env backup] GitHub secrets changed {stamp} hash {os.environ["ENV_HASH"][:12]}'
          m.set_content('Encrypted .env backup attached (7z, AES-256, ENV_BACKUP_PASSPHRASE).')
          m.add_attachment(open('env-backup.7z', 'rb').read(), maintype='application',
                           subtype='x-7z-compressed', filename='env-backup.7z')
          with smtplib.SMTP_SSL('smtp.naver.com', 465, context=ssl.create_default_context()) as c:
              c.login(uid, os.environ['NAVER_APP_PASSWORD'])
              c.send_message(m)
          print('mailed')
          PY
          : > env-hash-marker
      - name: Remember the mailed hash
        if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: env-hash-marker
          key: env-hash-${{ env.ENV_HASH }}
      - name: Remove the plain files
        if: always()
        run: rm -f .env env-backup.7z

name: secrets-env-backup

# On demand (Actions tab -> Run workflow) and whenever this file or the write-env action changes: dumps every secret of this repo into the .env
# beside the checkout (shared write-env action), and only when the sha256 of the whole .env differs from the
# repo variable ENV_BACKUP_HASH, delivers an AES-256 encrypted copy through whichever channels are configured,
# then stores the new hash. Two channels, each OFF unless its own passphrase secret is set; a passphrase that
# IS set but cannot deliver fails the run (so the hash is not stored and it retries, and the owner sees it):
#   - mail: 7z (AES-256, passphrase ENV_BACKUP_PASSPHRASE) mailed to the owner (NAVER_ID, NAVER_APP_PASSWORD).
#   - repo: 7z (AES-256, passphrase ENV_ZIP_PASSWORD) committed as the single file env-backup.7z to the root of
#           the owner's private repo kiexpert/personal-docs — for the secure-zone laptop where mail is blocked
#           but a private repo can be pulled. It refuses unless that repo is confirmed private over the API, and
#           commits only env-backup.7z by pathspec, so the repo's other files are never touched.
# Nothing secret is printed or uploaded; the plaintext .env and the 7z files are shredded; the passphrases live
# only as GitHub secrets, never in a repo. A secret still holding the placeholder SET-ME counts as unset.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/secrets-env-backup.yml
      - .github/actions/write-env/action.yml

permissions:
  contents: read

concurrency:
  group: secrets-env-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPO: kiexpert/personal-docs
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Write the .env beside the checkout
        id: env
        uses: ./.github/actions/write-env
        with:
          secrets-json: ${{ toJSON(secrets) }}
      - name: Compare with the last backed-up hash
        id: cmp
        env:
          NEW: ${{ steps.env.outputs.hash }}
          OLD: ${{ vars.ENV_BACKUP_HASH }}
        run: |
          if [ "$NEW" = "$OLD" ]; then echo "unchanged since the last backup"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed (last backed up: ${OLD:0:12})"; echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Mail channel — encrypt and mail the .env
        if: steps.cmp.outputs.changed == 'true'
        env:
          ENV_PATH: ${{ steps.env.outputs.path }}
          ENV_HASH: ${{ steps.env.outputs.hash }}
          PASS: ${{ secrets.ENV_BACKUP_PASSPHRASE }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          MAIL_TO: kiexpert@naver.com
        run: |
          set -eu
          set_ok() { [ -n "$1" ] && [ "$1" != "SET-ME" ]; }
          set_ok "$PASS" || { echo "mail channel off (ENV_BACKUP_PASSPHRASE unset)"; exit 0; }
          set_ok "$NAVER_ID" && set_ok "$NAVER_APP_PASSWORD" || { echo "ENV_BACKUP_PASSPHRASE is set but NAVER_ID/NAVER_APP_PASSWORD are not"; exit 1; }
          7z a -t7z -mhe=on -p"$PASS" "$RUNNER_TEMP/env-mail.7z" "$ENV_PATH" > /dev/null
          python3 - <<'PY'
          import os, smtplib, ssl, datetime
          from email.message import EmailMessage
          uid = os.environ['NAVER_ID'].split('@')[0]
          m = EmailMessage()
          m['From'] = f'{uid}@naver.com'
          m['To'] = os.environ['MAIL_TO']
          stamp = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
          m['Subject'] = f'[env backup] GitHub secrets changed {stamp} hash {os.environ["ENV_HASH"][:12]}'
          m.set_content('Encrypted .env backup attached (7z, AES-256, ENV_BACKUP_PASSPHRASE).')
          p = os.path.join(os.environ['RUNNER_TEMP'], 'env-mail.7z')
          m.add_attachment(open(p, 'rb').read(), maintype='application',
                           subtype='x-7z-compressed', filename='env-backup.7z')
          with smtplib.SMTP_SSL('smtp.naver.com', 465, context=ssl.create_default_context()) as c:
              c.login(uid, os.environ['NAVER_APP_PASSWORD'])
              c.send_message(m)
          print('mailed')
          PY
          echo mail >> "$RUNNER_TEMP/sent"
      - name: Repo channel — encrypt and commit env-backup.7z to the private repo root
        if: steps.cmp.outputs.changed == 'true'
        env:
          ENV_PATH: ${{ steps.env.outputs.path }}
          ENV_HASH: ${{ steps.env.outputs.hash }}
          PASS: ${{ secrets.ENV_ZIP_PASSWORD }}
        run: |
          set -eu
          set_ok() { [ -n "$1" ] && [ "$1" != "SET-ME" ]; }
          set_ok "$PASS" || { echo "repo channel off (ENV_ZIP_PASSWORD unset)"; exit 0; }
          TOK=""
          for t in "$T1" "$T2" "$T3"; do
            set_ok "$t" || continue
            vis=$(GH_TOKEN="$t" gh repo view "$TARGET_REPO" --json visibility -q '.visibility' 2>/dev/null | tr 'A-Z' 'a-z' || true)
            [ -n "$vis" ] || continue            # this token cannot see the repo; try the next
            [ "$vis" = "private" ] || { echo "refusing: $TARGET_REPO is '$vis', not private — an encrypted secrets backup never goes to a non-private repo"; exit 1; }
            echo "::add-mask::$t"; TOK="$t"; break
          done
          [ -n "$TOK" ] || { echo "ENV_ZIP_PASSWORD is set but no token can reach $TARGET_REPO (needs repo read+write)"; exit 1; }
          7z a -t7z -mhe=on -p"$PASS" "$RUNNER_TEMP/env-repo.7z" "$ENV_PATH" > /dev/null
          git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${TARGET_REPO}.git" dest
          cp "$RUNNER_TEMP/env-repo.7z" dest/env-backup.7z
          cd dest
          git config user.name "env-backup-bot"
          git config user.email "env-backup-bot@users.noreply.github.com"
          git add env-backup.7z                  # only this one file; the repo's other documents are untouched
          if git diff --cached --quiet; then echo "the encrypted file is byte-identical; nothing to commit"
          else
            git commit -q -m "env backup: secrets changed $(date -u '+%Y-%m-%d %H:%M UTC') (hash ${ENV_HASH:0:12})"
            git push -q origin HEAD
            echo "committed env-backup.7z to ${TARGET_REPO} root"
          fi
          echo repo >> "$RUNNER_TEMP/sent"
      - name: Store the backed-up hash in the repo variable
        if: steps.cmp.outputs.changed == 'true'
        env:
          ENV_HASH: ${{ steps.env.outputs.hash }}
        run: |
          [ -s "$RUNNER_TEMP/sent" ] || { echo "no channel delivered (none configured); not storing the hash"; exit 0; }
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] && [ "$t" != "SET-ME" ] || continue
            if GH_TOKEN="$t" gh variable set ENV_BACKUP_HASH --repo "$GITHUB_REPOSITORY" --body "$ENV_HASH" > /dev/null 2>&1; then
              echo "hash stored"; exit 0
            fi
          done
          echo "no token may write repo variables (needs a PAT with Variables: write)"; exit 1
      - name: Remove the plain files
        if: always()
        env:
          ENV_PATH: ${{ steps.env.outputs.path }}
        run: |
          [ -z "${ENV_PATH:-}" ] || shred -u "$ENV_PATH" 2>/dev/null || true
          shred -u "$RUNNER_TEMP/env-mail.7z" "$RUNNER_TEMP/env-repo.7z" 2>/dev/null || true

name: secrets-env-backup

# Daily at 00:00 UTC (and on demand from the Actions tab): dumps every secret of this repo into the
# .env beside the checkout (shared write-env action), and only when the sha256 of the whole .env
# differs from the repo variable ENV_BACKUP_HASH, mails it to the owner as an AES-256 7z
# (passphrase secret ENV_BACKUP_PASSPHRASE, mail secrets NAVER_ID and NAVER_APP_PASSWORD), then
# stores the new hash in that variable. Nothing secret is printed or uploaded.
# A secret still holding the placeholder SET-ME (a name registered for the owner to fill) counts as unset.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/secrets-env-backup.yml
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: secrets-env-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Write the .env beside the checkout
        id: env
        uses: ./.github/actions/write-env
        with:
          secrets-json: ${{ toJSON(secrets) }}
      - name: Compare with the last mailed hash
        id: cmp
        env:
          NEW: ${{ steps.env.outputs.hash }}
          OLD: ${{ vars.ENV_BACKUP_HASH }}
        run: |
          if [ "$NEW" = "$OLD" ]; then echo "unchanged since the last mail"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed (last mailed: ${OLD:0:12})"; echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Encrypt and mail the .env
        if: steps.cmp.outputs.changed == 'true'
        env:
          ENV_PATH: ${{ steps.env.outputs.path }}
          ENV_HASH: ${{ steps.env.outputs.hash }}
          PASS: ${{ secrets.ENV_BACKUP_PASSPHRASE }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          MAIL_TO: kiexpert@naver.com
        run: |
          set -eu
          set_ok() { [ -n "$1" ] && [ "$1" != "SET-ME" ]; }
          set_ok "$PASS" || { echo "secret ENV_BACKUP_PASSPHRASE is not set: refusing to mail secrets unencrypted"; exit 1; }
          set_ok "$NAVER_ID" && set_ok "$NAVER_APP_PASSWORD" || { echo "secrets NAVER_ID and NAVER_APP_PASSWORD are not set"; exit 1; }
          7z a -t7z -mhe=on -p"$PASS" "$RUNNER_TEMP/env-backup.7z" "$ENV_PATH" > /dev/null
          python3 - <<'PY'
          import os, smtplib, ssl, datetime
          from email.message import EmailMessage
          uid = os.environ['NAVER_ID'].split('@')[0]
          m = EmailMessage()
          m['From'] = f'{uid}@naver.com'
          m['To'] = os.environ['MAIL_TO']
          stamp = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
          m['Subject'] = f'[env backup] GitHub secrets changed {stamp} hash {os.environ["ENV_HASH"][:12]}'
          m.set_content('Encrypted .env backup attached (7z, AES-256, ENV_BACKUP_PASSPHRASE).')
          p = os.path.join(os.environ['RUNNER_TEMP'], 'env-backup.7z')
          m.add_attachment(open(p, 'rb').read(), maintype='application',
                           subtype='x-7z-compressed', filename='env-backup.7z')
          with smtplib.SMTP_SSL('smtp.naver.com', 465, context=ssl.create_default_context()) as c:
              c.login(uid, os.environ['NAVER_APP_PASSWORD'])
              c.send_message(m)
          print('mailed')
          PY
      - name: Store the mailed hash in the repo variable
        if: steps.cmp.outputs.changed == 'true'
        env:
          ENV_HASH: ${{ steps.env.outputs.hash }}
        run: |
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            if GH_TOKEN="$t" gh variable set ENV_BACKUP_HASH --repo "$GITHUB_REPOSITORY" --body "$ENV_HASH" > /dev/null 2>&1; then
              echo "hash stored"; exit 0
            fi
          done
          echo "no token may write repo variables (needs a PAT with Variables: write)"; exit 1
      - name: Remove the plain files
        if: always()
        env:
          ENV_PATH: ${{ steps.env.outputs.path }}
        run: |
          [ -z "$ENV_PATH" ] || shred -u "$ENV_PATH" 2>/dev/null || true
          shred -u "$RUNNER_TEMP/env-backup.7z" 2>/dev/null || true

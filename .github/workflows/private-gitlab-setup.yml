name: private-gitlab-setup

# Sets up the owner's own GitLab project and gives it a working CI/CD pipeline, including a job that
# screenshots the running app from inside the runner (a container, so the same job text runs on a
# Kubernetes-executor runner) and a deploy stage that does a REAL kind + Argo CD deploy on a tagged
# ephemeral shell-executor runner, then publishes a release-status.json to a public release the portal
# reads. Idempotent: it creates what is missing and updates what exists.
# It reads ONE GitLab secret, GITLAB_TOKEN. Empty or SET-ME means "not set yet" and the job says so and
# stops green, because a missing credential is the owner's step, never a failure of this pipeline.
# The token is masked, never printed, and never written into a file that is committed.
# The push trigger exists because workflow_dispatch is refused for the agent session that maintains
# this file, so touching the file is the only way to run it on demand (2026-11-01).
on:
  workflow_dispatch:
    inputs:
      project_path:
        description: 'GitLab project full path (namespace/name)'
        required: false
        default: 'kiexpert-group/clush-poc'
  push:
    branches: [main]
    paths:
      - .github/workflows/private-gitlab-setup.yml
      - .github/scripts/clush-deploy.sh
      - .github/scripts/clush-release-status.py
  schedule:
    - cron: '23 22 * * *'

permissions:
  contents: read

concurrency:
  group: private-gitlab-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GL: https://gitlab.com
      GLTOK: ${{ secrets.GITLAB_TOKEN }}
      PROJECT_PATH: ${{ github.event.inputs.project_path || 'kiexpert-group/clush-poc' }}
    steps:
      - name: Check out this repo (for the deploy script)
        uses: actions/checkout@v4
      - name: Is the GitLab token set
        id: gate
        run: |
          if [ -z "$GLTOK" ] || [ "$GLTOK" = "SET-ME" ]; then
            echo "GITLAB_TOKEN is not set yet -- nothing to do. The owner (or the docs root) stores the"
            echo "glpat value in this repo's secret GITLAB_TOKEN, then re-runs this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$GLTOK"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Who the token belongs to, and what it may do
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -e
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/user")
          if [ "$code" != "200" ]; then echo "GET /user returned $code -- the token is wrong, expired or lacks api scope"; exit 1; fi
          python3 - <<'EOF'
          import json
          me = json.load(open('/tmp/me.json'))
          print('user:', me.get('username'), '| id:', me.get('id'), '| bot:', me.get('bot'))
          EOF
          scopes=$(curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/personal_access_tokens/self" | python3 -c "import sys,json; d=json.load(sys.stdin); print(','.join(d.get('scopes',[])), '| expires:', d.get('expires_at'))" 2>/dev/null || echo "scope read not permitted")
          echo "scopes: $scopes"
      - name: Ensure the project exists
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -e
          ns="${PROJECT_PATH%/*}"; name="${PROJECT_PATH##*/}"
          enc=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['PROJECT_PATH'],safe=''))")
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc")
          if [ "$code" = "200" ]; then
            echo "project exists"
          else
            nsid=$(curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/namespaces?search=$ns" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['id'] if d else '')")
            if [ -z "$nsid" ]; then echo "namespace $ns not found for this token"; exit 1; fi
            curl -s -o /tmp/p.json -w 'create: %{http_code}\n' -X POST -H "PRIVATE-TOKEN: $GLTOK" \
              --data-urlencode "name=$name" --data-urlencode "path=$name" --data "namespace_id=$nsid&visibility=private&initialize_with_readme=true" \
              "$GL/api/v4/projects"
          fi
          python3 - <<'EOF'
          import json
          p = json.load(open('/tmp/p.json'))
          print('project id:', p.get('id'), '| web:', p.get('web_url'), '| default branch:', p.get('default_branch'))
          open('/tmp/pid','w').write(str(p.get('id')))
          EOF
          echo "PID=$(cat /tmp/pid)" >> "$GITHUB_ENV"
      - name: Fetch the CI/CD template set
        if: steps.gate.outputs.ready == 'true'
        env:
          T1: ${{ secrets.GH_LICENSE_TOKEN }}
          T2: ${{ secrets.WKAPPBOT_PAT }}
          T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
        run: |
          set -u
          cloned=false
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            echo "::add-mask::$t"
            rm -rf templates; mkdir -p templates
            if git clone -q --depth 1 "https://x-access-token:${t}@github.com/kiexpert/clush-cicd-templates.git" templates 2>/dev/null; then
              cloned=true; echo "templates cloned"; break
            fi
          done
          if [ "$cloned" != "true" ]; then
            rm -rf templates; mkdir -p templates
            echo "clush-cicd-templates not reachable (private or missing) -- continuing with an empty template set so the pipeline still ships"
          fi
      - name: Push the templates, pipeline and deploy script
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -e
          enc=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['PROJECT_PATH'],safe=''))")
          branch=$(curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc" | python3 -c "import sys,json;print(json.load(sys.stdin).get('default_branch') or 'main')")
          git clone -q "https://oauth2:${GLTOK}@gitlab.com/${PROJECT_PATH}.git" work
          rm -rf work/cicd-templates
          mkdir -p work/cicd-templates
          cp -r templates/. work/cicd-templates/ 2>/dev/null || true
          rm -rf work/cicd-templates/.git
          cat > work/.gitlab-ci.yml <<'EOF'
          # Demo pipeline for the Clush PoC. build/test/screenshot run in containers on GitLab shared
          # runners; the deploy stage is a REAL kind + Argo CD deploy that runs on a tagged ephemeral
          # shell-executor runner (kind needs the host docker daemon).
          stages: [build, test, shot, deploy]

          variables:
            GIT_DEPTH: "20"

          build:
            stage: build
            image: node:22-alpine
            script:
              - echo "building the demo app"
              - mkdir -p public
              - |
                cat > public/index.html <<'HTML'
                <!doctype html><html lang="ko"><head><meta charset="utf-8">
                <title>Clush PoC</title><style>
                body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#0d1117;color:#c9d1d9;
                display:flex;align-items:center;justify-content:center;height:100vh}
                .card{padding:40px 56px;border:1px solid #30363d;border-radius:14px;background:#161b22}
                h1{margin:0 0 8px;font-size:28px}.ok{color:#7ee787}
                </style></head><body><div class="card">
                <h1>Clush PoC</h1><p>GitLab CI/CD pipeline <span class="ok">green</span></p>
                <p id="t"></p></div>
                <script>document.getElementById('t').textContent=new Date().toISOString()</script>
                </body></html>
                HTML
            artifacts:
              paths: [public]
              expire_in: 1 week

          test:
            stage: test
            image: node:22-alpine
            script:
              - test -s public/index.html
              - echo "smoke ok"

          screenshot:
            stage: shot
            image: mcr.microsoft.com/playwright:v1.49.1-jammy
            script:
              - npx --yes http-server public -p 8080 >/dev/null 2>&1 &
              - sleep 3
              - export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
              - npm i -s playwright@1.49.1
              - |
                cat > shot.mjs <<'MJS'
                import { chromium } from 'playwright';
                const b = await chromium.launch({ args: ['--no-sandbox'] });
                for (const [name, w, h] of [['desktop',1440,900],['phone',390,844]]) {
                  const p = await (await b.newContext({ viewport:{width:w,height:h} })).newPage();
                  await p.goto('http://127.0.0.1:8080/', { waitUntil:'networkidle' });
                  await p.screenshot({ path: `shots/${name}.png` });
                }
                await b.close();
                console.log('screenshots written');
                MJS
              - mkdir -p shots && node shot.mjs
            artifacts:
              paths: [shots]
              expire_in: 1 week

          deploy:
            stage: deploy
            tags: [clush-kind]
            script:
              - bash k8s/deploy.sh
            artifacts:
              when: always
              paths: [deploy-proof]
              expire_in: 1 week
            environment:
              name: demo
            after_script:
              - kind delete cluster --name portal-demo || true
          EOF
          mkdir -p work/k8s
          cp "$GITHUB_WORKSPACE/.github/scripts/clush-deploy.sh" work/k8s/deploy.sh
          chmod +x work/k8s/deploy.sh
          cd work
          git config user.email "relay-bot@users.noreply.github.com"
          git config user.name "relay-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to push: the project already carries this exact setup"
          else
            git commit -qm "ci: Clush PoC pipeline (build, smoke, runner screenshots, real kind+Argo deploy)"
            git push -q origin "HEAD:$branch"
            echo "pushed to $branch"
          fi
      - name: Register a tagged shell runner (for kind) and run the pipeline to green
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          enc=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['PROJECT_PATH'],safe=''))")
          branch=$(curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc" | python3 -c "import sys,json;print(json.load(sys.stdin).get('default_branch') or 'main')")
          # tools for the deploy job (shell executor runs on THIS host; kind uses the host docker daemon)
          curl -sSLo ./kind "https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64" && sudo install ./kind /usr/local/bin/kind
          curl -sSLo ./kubectl "https://dl.k8s.io/release/v1.31.2/bin/linux/amd64/kubectl" && sudo install ./kubectl /usr/local/bin/kubectl
          kind --version || true
          kubectl version --client 2>/dev/null | head -1 || true
          # register a PROJECT runner: shell executor, tagged clush-kind, tagged-only so ONLY the deploy job lands on it
          resp=$(curl -s -X POST -H "PRIVATE-TOKEN: $GLTOK" \
            --data "runner_type=project_type&project_id=${PID}&run_untagged=false&tag_list=clush-kind&description=ephemeral-kind-${GITHUB_RUN_ID}" \
            "$GL/api/v4/user/runners")
          rid=$(printf '%s' "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id','') or '')")
          rtok=$(printf '%s' "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token','') or '')")
          if [ -z "$rtok" ]; then echo "runner token not issued:"; printf '%s' "$resp" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('message') or d)"; exit 1; fi
          echo "::add-mask::$rtok"
          echo "RID=$rid" >> "$GITHUB_ENV"
          echo "shell runner registered id=$rid tag=clush-kind (token masked)"
          # install gitlab-runner locally (no sudo); shell executor runs jobs on this host
          curl -sSL "https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-linux-amd64" -o ./gitlab-runner
          chmod +x ./gitlab-runner
          ./gitlab-runner register --non-interactive --config ./rc.toml --url "$GL" --token "$rtok" --executor shell --name "ephemeral-kind-${GITHUB_RUN_ID}"
          # the shell executor sources the login profile; ubuntu's ~/.bash_logout runs clear_console,
          # which exits non-zero without a tty and fails "prepare environment". Remove the logout scripts.
          rm -f "$HOME/.bash_logout" || true
          sudo rm -f /root/.bash_logout /etc/bash.bash_logout 2>/dev/null || true
          ./gitlab-runner run --config ./rc.toml >/tmp/runner.log 2>&1 &
          echo "gitlab-runner started pid=$! (executor: shell, tag clush-kind)"
          # install glab (pinned, best-effort) for a richer post-run report; curl report below is the fallback
          for u in \
            "https://gitlab.com/gitlab-org/cli/-/releases/v1.54.0/downloads/glab_1.54.0_linux_amd64.tar.gz" \
            "https://gitlab.com/gitlab-org/cli/-/releases/v1.54.0/downloads/glab_1.54.0_Linux_x86_64.tar.gz"; do
            if curl -sSLf "$u" -o /tmp/glab.tgz 2>/dev/null; then
              mkdir -p /tmp/glabx && tar -xzf /tmp/glab.tgz -C /tmp/glabx 2>/dev/null && \
              gbin="$(find /tmp/glabx -type f -name glab | head -1)" && [ -n "$gbin" ] && sudo install "$gbin" /usr/local/bin/glab 2>/dev/null && break
            fi
          done
          glab --version 2>/dev/null || echo "glab not installed (best-effort); the curl report still runs"
          sleep 5
          # create a fresh pipeline (shared SaaS runners serve build/test/screenshot; the tagged shell runner serves deploy)
          curl -s -o /tmp/pl.json -w 'pipeline create: %{http_code}\n' -X POST -H "PRIVATE-TOKEN: $GLTOK" --data "ref=${branch}" "$GL/api/v4/projects/$enc/pipeline"
          plid=$(python3 -c "import json;print(json.load(open('/tmp/pl.json')).get('id','') or '')")
          if [ -z "$plid" ]; then echo "pipeline not created:"; cat /tmp/pl.json; exit 1; fi
          echo "PIPELINE_ID=$plid" >> "$GITHUB_ENV"
          echo "pipeline id=$plid created"
          # poll the pipeline id directly until terminal (kind+Argo takes a while)
          st=created
          for i in $(seq 1 120); do
            st=$(curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc/pipelines/$plid" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status','') or '')")
            echo "pipeline $plid: $st"
            case "$st" in success|failed|canceled|skipped) break;; esac
            sleep 15
          done
          echo "PIPELINE_STATUS=$st" >> "$GITHUB_ENV"
          url=$(curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc/pipelines/$plid" | python3 -c "import sys,json;print(json.load(sys.stdin).get('web_url','') or '')")
          {
            echo "## clush-poc pipeline"
            echo ""
            echo "- project: \`$PROJECT_PATH\`"
            echo "- pipeline: $plid ($st) $url"
          } >> "$GITHUB_STEP_SUMMARY"
          curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc/pipelines/$plid/jobs" \
            | python3 -c "import sys,json;[print('job:', j['name'], j['status'], '| stage:', j['stage'], '| runner:', (j.get('runner') or {}).get('description')) for j in json.load(sys.stdin)]"
          # glab-based report (best-effort), alongside the curl report above
          if command -v glab >/dev/null 2>&1; then
            echo "---- glab api report ----"
            GITLAB_HOST="$GL" GITLAB_TOKEN="$GLTOK" glab api "projects/$PID/pipelines/$plid" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print('glab pipeline', d.get('id'), d.get('status'), d.get('web_url'))" 2>/dev/null || echo "glab pipeline read skipped"
            GITLAB_HOST="$GL" GITLAB_TOKEN="$GLTOK" glab api "projects/$PID/pipelines/$plid/jobs" 2>/dev/null | python3 -c "import sys,json;[print('glab job:', j['name'], j['status']) for j in json.load(sys.stdin)]" 2>/dev/null || echo "glab jobs read skipped"
          fi
          echo "---- gitlab-runner log tail ----"; tail -n 25 /tmp/runner.log 2>/dev/null || true
          if [ "$st" != "success" ]; then
            echo "---- failed GitLab job traces (tail) ----"
            for jid in $(curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc/pipelines/$plid/jobs" | python3 -c "import sys,json;[print(j['id']) for j in json.load(sys.stdin) if j['status']=='failed']"); do
              echo "== job $jid trace =="
              curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc/jobs/$jid/trace" | tail -n 80
            done
            echo "pipeline did not go green: $st"; exit 1
          fi
          # success path: assemble release-status.json (pipeline + cluster metrics) and publish it publicly
          echo "== assemble + publish release-status.json =="
          curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc/pipelines/$plid/jobs" > /tmp/jobs.json
          deploy_jid="$(python3 -c "import json;print(next((j['id'] for j in json.load(open('/tmp/jobs.json')) if j['name']=='deploy'),''))")"
          curl -s -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/projects/$enc/jobs/${deploy_jid}/artifacts/deploy-proof/cluster-metrics.json" -o /tmp/cluster-metrics.json 2>/dev/null || true
          python3 "$GITHUB_WORKSPACE/.github/scripts/clush-release-status.py" "$plid" "$st" /tmp/jobs.json /tmp/cluster-metrics.json > release-status.json
          echo "---- release-status.json ----"; cat release-status.json
          # leak-grep the proof artifact (fail on any token prefix) before publishing
          if grep -rEI 'ghp_[A-Za-z0-9]|github_pat_[A-Za-z0-9]|glpat-[A-Za-z0-9]|sk-ant-[A-Za-z0-9]' release-status.json ; then
            echo "TOKEN-PREFIX LEAK detected"; exit 1
          fi
          echo "leak-grep: 0 (no token prefix in the proof artifacts)"
          gh release view clush-release-board --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create clush-release-board --repo "$GITHUB_REPOSITORY" --title "Clush release board" --notes "Live release-status.json for the portal release board (updated each clush-poc deploy)." --latest=false
          gh release upload clush-release-board release-status.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "release-status.json URL: https://github.com/$GITHUB_REPOSITORY/releases/download/clush-release-board/release-status.json"
      - name: Unregister the ephemeral runner
        if: always()
        run: |
          if [ -n "${RID:-}" ]; then
            curl -s -o /dev/null -w "delete runner ${RID}: %{http_code}\n" -X DELETE -H "PRIVATE-TOKEN: $GLTOK" "$GL/api/v4/runners/${RID}" || true
          else
            echo "no runner id recorded; nothing to unregister"
          fi
# 2026-11-03: deploy stage runs real kind + Argo CD (k8s/deploy.sh) on a tagged shell runner; metrics-server + cluster metrics gathered; a public release-status.json (release clush-release-board) feeds the portal board; glab + failed-trace reporting kept.

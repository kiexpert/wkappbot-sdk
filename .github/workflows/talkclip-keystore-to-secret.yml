name: talkclip keystore to repo secret (one-time)

# Moves the wktalkclip APK signing key from that repo's Actions cache into its repository
# secrets APK_KEYSTORE_B64 and APK_KEYSTORE_PASS, so a 7-day cache eviction can never break
# in-place updates. The key never appears in a log or in plain form outside a runner: this
# job makes a throwaway RSA pair, the wktalkclip run seals the keystore to the public half,
# this job opens it with the private half and stores it straight into the secrets.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/talkclip-keystore-to-secret.yml']

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Move the signing key into the wktalkclip secrets
        env:
          T1: ${{ secrets.WKAPPBOT_PAT }}
          T2: ${{ secrets.GH_LICENSE_TOKEN }}
          T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
        run: |
          set -eu
          umask 077
          R=kiexpert/wktalkclip
          TOK=""
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            if GH_TOKEN="$t" gh api "repos/$R/actions/secrets/public-key" >/dev/null 2>&1; then TOK="$t"; break; fi
          done
          [ -n "$TOK" ] || { echo "no token here can write $R secrets"; exit 1; }
          export GH_TOKEN="$TOK"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out priv.pem 2>/dev/null
          openssl pkey -in priv.pem -pubout -out pub.pem
          T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run keystore-export.yml --repo "$R" --ref main -f pubkey_b64="$(base64 -w0 pub.pem)"
          RID=""
          for i in $(seq 1 30); do
            sleep 5
            RID=$(gh run list --repo "$R" --workflow keystore-export.yml --limit 5 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$T0\")][0].databaseId // empty")
            [ -n "$RID" ] && break
          done
          [ -n "$RID" ] || { echo "export run did not start"; exit 1; }
          echo "export run: $RID"
          gh run watch "$RID" --repo "$R" --exit-status > /dev/null
          gh run download "$RID" --repo "$R" -n keystore-sealed -D sealed
          openssl pkeyutl -decrypt -inkey priv.pem -pkeyopt rsa_padding_mode:oaep -in sealed/k.enc -out k.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -in sealed/ks.enc -out ks.jks -pass file:k.txt
          [ "$(sha256sum ks.jks | cut -c1-16)" = "$(cat sealed/ks.sha16)" ] || { echo "sealed keystore did not round-trip"; exit 1; }
          echo "keystore round-trip ok"
          base64 -w0 ks.jks | gh secret set APK_KEYSTORE_B64 --repo "$R"
          printf %s android | gh secret set APK_KEYSTORE_PASS --repo "$R"
          rm -f priv.pem k.txt ks.jks
          echo "secrets APK_KEYSTORE_B64 and APK_KEYSTORE_PASS set on $R"
          gh workflow run apk.yml --repo "$R" --ref main
          echo "apk build started; its log must say 'signing key: repository secret' and the pinned fingerprint"

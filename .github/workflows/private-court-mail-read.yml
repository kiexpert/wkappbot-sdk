name: private-court-mail-read

# Reads the court notices (sender domain scourt.go.kr) of the last few days from the owner's Naver
# inbox over IMAP and writes their subject, date and plain text into one private repo of this
# account, then commits there. Nothing from the mail is printed here: the log shows counts only.
# Secrets NAVER_ID and NAVER_APP_PASSWORD are the owner's; the target repo is found by a sha256
# prefix, never named.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/private-court-mail-read.yml

permissions:
  contents: read

concurrency:
  group: private-court-mail-read
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_HASH: c48fcce9e0c13229
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - name: Skip until the Naver secrets exist
        id: gate
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
        run: |
          if [ -n "$NAVER_ID" ] && [ -n "$NAVER_APP_PASSWORD" ] && [ "$NAVER_APP_PASSWORD" != "SET-ME" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "secrets not set: nothing to do"; echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Find the target repo and a token that can reach it
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"
                echo "::add-mask::${n#*/}"
                echo "::add-mask::$t"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"
                exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1
      - name: Clone the target repo
        if: steps.gate.outputs.ready == 'true'
        run: git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${REPO}.git" src
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - name: Read court notices from the inbox
        if: steps.gate.outputs.ready == 'true'
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
        working-directory: src
        run: |
          set -u
          echo "::add-mask::${NAVER_ID}"
          python - > ../read.log 2>&1 <<'PY' || { echo "read failed"; tail -n 3 ../read.log | sed -E 's/[^ ]+@[^ ]+/<addr>/g' | cut -c1-200; exit 1; }
          import imaplib, email, email.utils, os, re, datetime, html
          from email.header import decode_header, make_header
          from pathlib import Path
          user = os.environ['NAVER_ID'].split('@')[0]
          m = imaplib.IMAP4_SSL('imap.naver.com', 993)
          m.login(user, os.environ['NAVER_APP_PASSWORD'])
          m.select('INBOX', readonly=True)
          since = (datetime.date.today() - datetime.timedelta(days=4)).strftime('%d-%b-%Y')
          typ, data = m.search(None, 'SINCE', since, 'FROM', 'scourt.go.kr')
          ids = data[0].split() if data and data[0] else []
          out = ['# Court notices from the Naver inbox (since %s)' % since, '']
          for i in ids:
              typ, msg_data = m.fetch(i, '(RFC822)')
              msg = email.message_from_bytes(msg_data[0][1])
              subj = str(make_header(decode_header(msg.get('Subject', ''))))
              date = msg.get('Date', '')
              text = ''
              for part in msg.walk():
                  ct = part.get_content_type()
                  if ct in ('text/plain', 'text/html') and not part.get_filename():
                      raw = part.get_payload(decode=True) or b''
                      cs = part.get_content_charset() or 'utf-8'
                      try:
                          s = raw.decode(cs, 'replace')
                      except LookupError:
                          s = raw.decode('utf-8', 'replace')
                      if ct == 'text/html':
                          s = re.sub(r'(?is)<(script|style).*?</\1>', '', s)
                          s = re.sub(r'(?i)<br\s*/?>|</p>|</tr>|</div>', '\n', s)
                          s = html.unescape(re.sub(r'<[^>]+>', ' ', s))
                      text = s
                      if ct == 'text/plain':
                          break
              text = re.sub(r'[ \t]+', ' ', text)
              text = re.sub(r'\n\s*\n+', '\n\n', text).strip()
              out += ['## ' + subj, '', '- Date: ' + date, '', text[:6000], '']
              # One file per message, never overwritten, so the history outlives the 4-day window.
              import hashlib
              key = hashlib.sha256((msg.get('Message-ID', '') + date + subj).encode('utf-8')).hexdigest()[:10]
              try:
                  stamp = email.utils.parsedate_to_datetime(date).strftime('%Y%m%d-%H%M')
              except Exception:
                  stamp = datetime.date.today().strftime('%Y%m%d-0000')
              h = Path('resume/applications/20260824_2026ah12916_court_costs/court_mail')
              h.mkdir(parents=True, exist_ok=True)
              f = h / ('%s_%s.md' % (stamp, key))
              if not f.exists():
                  f.write_text('# ' + subj + '\n\n- Date: ' + date + '\n\n' + text[:6000] + '\n', encoding='utf-8')
          m.logout()
          d = Path('resume/applications/20260824_2026ah12916_court_costs/court_mail')
          d.mkdir(parents=True, exist_ok=True)
          (d / 'LATEST.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          Path('../count.txt').write_text('notices=%d' % len(ids))
          PY
          echo "read done: $(cat ../count.txt)"
      - name: Commit the notices back
        if: steps.gate.outputs.ready == 'true'
        working-directory: src
        run: |
          set -eu
          git config user.name "court-mail-read"
          git config user.email "court-mail-read@users.noreply.github.com"
          git add -A resume/applications/20260824_2026ah12916_court_costs/court_mail
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "court notices from inbox $(date -u +%F)"
          # Another writer may land on main while this runs: rebase onto it and retry.
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then break; fi
            git pull -q --rebase origin main
            [ "$i" = 3 ] && { echo "push failed after retries"; exit 1; }
          done
          echo "notices committed"

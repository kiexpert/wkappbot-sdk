name: secrets-env-repo-backup

# A second backup channel beside secrets-env-backup (which mails the .env): for the secure-zone laptop where
# personal mail is blocked but a private repo can still be pulled. Daily at 00:20 UTC (and on demand from the
# Actions tab): dumps every secret of this repo into the .env (shared write-env action), and only when the
# sha256 of the whole .env differs from the repo variable ENV_ZIP_HASH, encrypts it as an AES-256 7z
# (passphrase secret ENV_ZIP_PASSWORD) and commits that ONE file, env-backup.7z, to the root of the owner's
# private repo kiexpert/personal-docs, then stores the new hash in that variable.
# Safety rails: it REFUSES to push unless the target repo is private (checked over the API first); it uses
# AES-256 (7z -mhe=on), never the broken ZipCrypto; it commits only env-backup.7z by pathspec, so the repo's
# other files (legal documents and the like) are never touched; nothing secret is printed or uploaded, and the
# plaintext .env is shredded. The passphrase lives only as a GitHub secret, never in the repo.
# A secret still holding the placeholder SET-ME (a name registered for the owner to fill) counts as unset.
on:
  workflow_dispatch:
  push:
    branches: [main, 'qa-video/**']
    paths:
      - .github/workflows/secrets-env-repo-backup.yml
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: read

concurrency:
  group: secrets-env-repo-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPO: kiexpert/personal-docs
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Write the .env beside the checkout
        id: env
        uses: ./.github/actions/write-env
        with:
          secrets-json: ${{ toJSON(secrets) }}
      - name: Compare with the last backed-up hash
        id: cmp
        env:
          NEW: ${{ steps.env.outputs.hash }}
          OLD: ${{ vars.ENV_ZIP_HASH }}
        run: |
          if [ "$NEW" = "$OLD" ]; then echo "unchanged since the last backup"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed (last backed up: ${OLD:0:12})"; echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Find a token that may reach the private target repo, and confirm it is private
        id: tok
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] && [ "$t" != "SET-ME" ] || continue
            vis=$(GH_TOKEN="$t" gh repo view "$TARGET_REPO" --json visibility -q '.visibility' 2>/dev/null || true)
            [ -n "$vis" ] || continue           # this token cannot see the repo; try the next
            if [ "$vis" != "private" ]; then
              echo "refusing: $TARGET_REPO is '$vis', not private — an encrypted secrets backup never goes to a non-private repo"; exit 1
            fi
            echo "::add-mask::$t"
            echo "TOK=$t" >> "$GITHUB_ENV"
            echo "target is private; token found"
            exit 0
          done
          echo "no token can reach $TARGET_REPO (needs repo read+write); nothing pushed"; exit 1
      - name: Encrypt the .env and commit env-backup.7z to the private repo root
        if: steps.cmp.outputs.changed == 'true'
        env:
          ENV_PATH: ${{ steps.env.outputs.path }}
          ENV_HASH: ${{ steps.env.outputs.hash }}
          PASS: ${{ secrets.ENV_ZIP_PASSWORD }}
        run: |
          set -eu
          set_ok() { [ -n "$1" ] && [ "$1" != "SET-ME" ]; }
          set_ok "$PASS" || { echo "secret ENV_ZIP_PASSWORD is not set: refusing to make an unencrypted backup"; exit 1; }
          # AES-256, header-encrypted (file names hidden too); never ZipCrypto
          7z a -t7z -mhe=on -p"$PASS" "$RUNNER_TEMP/env-backup.7z" "$ENV_PATH" > /dev/null
          git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${TARGET_REPO}.git" dest
          cp "$RUNNER_TEMP/env-backup.7z" dest/env-backup.7z
          cd dest
          git config user.name "env-backup-bot"
          git config user.email "env-backup-bot@users.noreply.github.com"
          git add env-backup.7z                 # only this one file; the repo's other documents are untouched
          if git diff --cached --quiet; then echo "the encrypted file is byte-identical; nothing to commit"; exit 0; fi
          stamp=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -q -m "env backup: secrets changed ${stamp} (hash ${ENV_HASH:0:12})"
          git push -q origin HEAD
          echo "committed env-backup.7z to ${TARGET_REPO} root"
      - name: Store the backed-up hash in the repo variable
        if: steps.cmp.outputs.changed == 'true'
        env:
          ENV_HASH: ${{ steps.env.outputs.hash }}
        run: |
          GH_TOKEN="$TOK" gh variable set ENV_ZIP_HASH --repo "$GITHUB_REPOSITORY" --body "$ENV_HASH" > /dev/null 2>&1 \
            && echo "hash stored" || { echo "could not store the hash (needs a PAT with Variables: write)"; exit 1; }
      - name: Remove the plain files
        if: always()
        env:
          ENV_PATH: ${{ steps.env.outputs.path }}
        run: |
          [ -z "${ENV_PATH:-}" ] || shred -u "$ENV_PATH" 2>/dev/null || true
          shred -u "$RUNNER_TEMP/env-backup.7z" 2>/dev/null || true

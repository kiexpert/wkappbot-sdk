name: Portable QA (Windows / Linux / macOS)

# Overall release QA for the binaries the SDK ships:
#   - fetch:   portable CLI (linux-x64, osx-arm64, osx-x64) + SHA256SUMS from the core release,
#              else built from core source; uploaded as artifact "wkappbot-portable"
#   - linux / macos: install.sh from the artifact (checksum-verified), then the basic smoke
#   - windows: launcher build + core binary --version
# release.yml calls this workflow and refuses to publish on any red.

on:
  push:
    branches: ['claude/release-*']
    paths:
      - 'install.sh'
      - '.github/scripts/fetch-portable-cli.sh'
      - '.github/scripts/portable-smoke.sh'
      - '.github/workflows/portable-qa.yml'
      - '.github/workflows/release.yml'
      - 'csharp/src/WKAppBot.Launcher/**'
  workflow_dispatch:
  workflow_call:
    secrets:
      WKAPPBOT_CORE_PAT:
        required: false
      WKAPPBOT_CORE_REPO:
        required: false

permissions:
  contents: read

jobs:
  fetch:
    name: fetch portable CLI
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.fetch.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: 8.0.x
      - name: Fetch or build
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.WKAPPBOT_CORE_PAT }}
          CORE_REPO: ${{ secrets.WKAPPBOT_CORE_REPO || 'kiexpert/WKAppBot' }}
          OUT_DIR: portable
        run: bash .github/scripts/fetch-portable-cli.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: wkappbot-portable
          path: portable/
          retention-days: 14

  unix:
    name: smoke ${{ matrix.os }} (${{ matrix.asset }})
    needs: fetch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: wkappbot-linux-x64 }
          - { os: macos-latest,  asset: wkappbot-osx-arm64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wkappbot-portable
          path: portable
      - name: install.sh (checksum-verified, from the artifact)
        shell: bash
        run: |
          export WKAPPBOT_BASE_URL="file://$PWD/portable"
          export WKAPPBOT_INSTALL_DIR="$RUNNER_TEMP/bin"
          echo "runner: $(uname -s) $(uname -m), expected asset ${{ matrix.asset }}"
          sh install.sh 2>&1 | tee install.log
          grep -q "Downloading ${{ matrix.asset }} " install.log
      - name: Smoke
        shell: bash
        run: bash .github/scripts/portable-smoke.sh "$RUNNER_TEMP/bin/wkappbot"

  windows:
    name: smoke windows-latest (launcher + core)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: 8.0.x
      - name: Build launcher
        shell: pwsh
        run: |
          dotnet publish csharp/src/WKAppBot.Launcher/WKAppBot.Launcher.csproj `
            --configuration Release -p:SkipDeployLauncher=true -o bin
          if (!(Test-Path bin/wkappbot.exe)) { throw 'wkappbot.exe missing' }
          (Get-Item bin/wkappbot.exe).VersionInfo | Format-List FileVersion, ProductVersion
      - name: Fetch core (latest core-* release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WKAPPBOT_CORE_PAT }}
          CORE_REPO: ${{ secrets.WKAPPBOT_CORE_REPO || 'kiexpert/WKAppBot' }}
        run: |
          $tag = gh release list --repo $env:CORE_REPO --limit 50 --json tagName,createdAt `
            | ConvertFrom-Json | Where-Object { $_.tagName -like 'core-*' } `
            | Sort-Object createdAt -Descending | Select-Object -First 1 -ExpandProperty tagName
          if (-not $tag) { throw "No core-* release in $env:CORE_REPO" }
          gh release download $tag --repo $env:CORE_REPO --pattern wkappbot-core.exe --dir bin --clobber
          Write-Host "core: $tag"
      - name: Core --version (60 s budget)
        shell: pwsh
        run: |
          $p = Start-Process bin/wkappbot-core.exe -ArgumentList '--version' -NoNewWindow -PassThru `
            -RedirectStandardOutput ver.txt -RedirectStandardError ver.err
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'wkappbot-core --version hung > 60 s' }
          Get-Content ver.txt, ver.err
          if ($p.ExitCode -ne 0) { throw "wkappbot-core --version rc=$($p.ExitCode)" }
          if (-not (Get-Content ver.txt -Raw)) { throw 'wkappbot-core --version printed nothing' }

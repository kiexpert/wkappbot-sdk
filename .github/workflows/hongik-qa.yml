name: Hongik Knowledge-Intelligence QA

on:
  schedule:
    - cron: '0 3 * * *'  # Daily 03:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'csharp/src/WKAppBot.Launcher/**'
      - '.github/scripts/**'
      - 'bin/**'
      - 'skills/**'
      - '.github/workflows/hongik-qa.yml'

permissions:
  contents: read

jobs:
  hongik-qa:
    runs-on: windows-latest
    timeout-minutes: 20
    name: Hongik Reflex QA

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('csharp/**/*.csproj', 'csharp/**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore bin cache
        id: bin_cache
        uses: actions/cache/restore@v5
        with:
          path: bin
          key: ${{ runner.os }}-sdk-build-${{ hashFiles('csharp/**/*.cs', 'csharp/**/*.csproj', 'csharp/**/*.props', 'csharp/**/*.targets', 'csharp/WKAppBot.sln') }}
          restore-keys: |
            ${{ runner.os }}-sdk-build-run-
            ${{ runner.os }}-sdk-build-

      - name: Build launcher
        if: ${{ steps.bin_cache.outputs.cache-hit != 'true' || hashFiles('bin/wkappbot.exe') == '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          dotnet publish csharp/src/WKAppBot.Launcher/WKAppBot.Launcher.csproj `
            --configuration Release -p:SkipDeployLauncher=true -o bin

      - name: Fetch core binary (private release)
        if: ${{ hashFiles('bin/wkappbot-core.exe') == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WKAPPBOT_CORE_PAT }}
          CORE_REPO: ${{ secrets.WKAPPBOT_CORE_REPO }}
        run: |
          if (-not $env:CORE_REPO -or -not $env:GH_TOKEN) { throw 'WKAPPBOT_CORE_REPO / WKAPPBOT_CORE_PAT secrets required' }
          $tag = gh release list --repo $env:CORE_REPO --json tagName,createdAt | ConvertFrom-Json `
            | Where-Object { $_.tagName -like 'core-*' } | Sort-Object createdAt -Descending `
            | Select-Object -First 1 -ExpandProperty tagName
          if (-not $tag) { throw "No core-* release found" }
          gh release download $tag --repo $env:CORE_REPO --pattern "wkappbot-core.exe" --dir bin --clobber
          if (-not (Test-Path bin/wkappbot-core.exe)) { throw "wkappbot-core.exe not found" }

      - name: Seed bin/wkappbot.hq
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/wkappbot.hq/skills | Out-Null
          if (Test-Path wkappbot.hq) { Copy-Item wkappbot.hq/* bin/wkappbot.hq -Recurse -Force }
          if (Test-Path skills) { Copy-Item skills/* bin/wkappbot.hq/skills -Recurse -Force }

      - name: Add bin to PATH + verify
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (!(Test-Path ./bin/wkappbot.exe) -or !(Test-Path ./bin/wkappbot-core.exe)) { throw 'binaries missing' }
          $v = & ./bin/wkappbot.exe --version 2>&1 | Select-String 'wkappbot v'
          if (!$v) { throw 'version check failed' }
          Write-Host "Binary OK: $v"

      - name: "1. SDK Version and License Check"
        id: check1
        shell: pwsh
        run: |
          Write-Host "=== Check 1: Version, License ===" -ForegroundColor Cyan
          $version = & ./bin/wkappbot.exe --version 2>&1 | Select-String 'wkappbot v'
          if (-not $version) { throw "FAIL: Version check returned empty" }
          Write-Host "✓ PASS: Version OK: $version"

          # an unlicensed runner may exit non-zero, so the raw output is printed for the log and only its presence is asserted
          $licenseOutput = (& ./bin/wkappbot.exe license status 2>&1) -join "`n"
          Write-Host "  license status exit code: $LASTEXITCODE"
          Write-Host "  license status raw output:`n$licenseOutput"
          if ([string]::IsNullOrWhiteSpace($licenseOutput)) { throw "FAIL: License command produced no output" }
          Write-Host "✓ PASS: License command answered with text"

          $global:LASTEXITCODE = 0

      - name: "2. Skill Read and Search"
        id: check2
        shell: pwsh
        run: |
          Write-Host "=== Check 2: Skill Operations ===" -ForegroundColor Cyan
          # raw output first, so a failing assertion always has its evidence in the log
          $readText = (& ./bin/wkappbot.exe skill read on-load 2>&1) -join "`n"
          Write-Host "  skill read on-load, first lines:"
          ($readText -split "`n" | Select-Object -First 12) | ForEach-Object { Write-Host "    $_" }
          # a found skill prints its record with an ID line and a Desc line, a missing one does not
          if ($readText -notmatch '(?m)^\s*ID\s*:\s*on-load\s*$' -or $readText -notmatch '(?m)^\s*Desc\s*:') { throw "FAIL: skill read on-load did not print the on-load record" }
          Write-Host "✓ PASS: Skill read OK"

          $searchText = (& ./bin/wkappbot.exe skill search session start mandatory loads routing gg trigger 2>&1) -join "`n"
          Write-Host "  skill search, first lines:"
          ($searchText -split "`n" | Select-Object -First 6) | ForEach-Object { Write-Host "    $_" }
          if ($searchText -notmatch '\bon-load\b') { throw "FAIL: skill search did not find on-load" }
          Write-Host "✓ PASS: Skill search OK"

          $listText = (& ./bin/wkappbot.exe skill list 2>&1) -join "`n"
          Write-Host "  skill list length: $($listText.Length) chars"
          # the list output is grouped and elided, so it is judged by size and line count, not by one skill name
          $listLines = @($listText -split "`n" | Where-Object { $_.Trim().Length -gt 0 }).Count
          Write-Host "  skill list non-empty lines: $listLines"
          if ($listLines -lt 50) { throw "FAIL: skill list printed only $listLines lines" }
          Write-Host "✓ PASS: Skill list OK"

          $global:LASTEXITCODE = 0

      - name: "3. Harness Guard Validation"
        id: check3
        shell: pwsh
        run: |
          Write-Host "=== Check 3: Harness Guard Tests ===" -ForegroundColor Cyan
          # raw output printed first so a failing assertion shows evidence in the log
          $guardText = (& ./bin/wkappbot.exe skill search harness guard rule policy 2>&1) -join "`n"
          Write-Host "  harness guard search, first lines:"
          ($guardText -split "`n" | Select-Object -First 10) | ForEach-Object { Write-Host "    $_" }
          if ([string]::IsNullOrWhiteSpace($guardText) -or $guardText -notmatch 'harness|guard|on-load') { throw "FAIL: Harness guard search did not find guard skills" }
          Write-Host "✓ PASS: Harness guards verified"

          $global:LASTEXITCODE = 0

      - name: "4. Reflex Pulse Fixtures"
        id: check4
        shell: pwsh
        run: |
          Write-Host "=== Check 4: Reflex Pulse ===" -ForegroundColor Cyan
          # raw output printed first so a failing assertion shows evidence in the log
          $pulseOutput = (& ./bin/wkappbot.exe eye tick 2>&1) -join "`n"
          Write-Host "  eye tick raw output:`n$pulseOutput"
          if ([string]::IsNullOrWhiteSpace($pulseOutput) -or $pulseOutput -notmatch 'result=ok|end:0|ctx=') { throw "FAIL: Reflex pulse fixtures failed" }
          Write-Host "✓ PASS: Pulse fixtures verified"

          $global:LASTEXITCODE = 0

      - name: "5. CDP Port and Headless Chrome"
        id: check5
        shell: pwsh
        run: |
          Write-Host "=== Check 5: CDP Headless Launch ===" -ForegroundColor Cyan
          # installed path first: where.exe chrome matches a repo folder named Chrome
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path -LiteralPath $chromePath -PathType Leaf)) {
            $c = Get-Command chrome.exe -ErrorAction SilentlyContinue
            if ($c) { $chromePath = $c.Source }
          }
          if (-not (Test-Path -LiteralPath $chromePath -PathType Leaf)) { throw "FAIL: Chrome not found on this runner: $chromePath" }
          Write-Host "  Chrome: $chromePath"

          $proc = Start-Process $chromePath -ArgumentList `
            "--headless=new", "--remote-debugging-port=9222", "--remote-debugging-address=127.0.0.1", `
            "--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage", "--user-data-dir=$env:RUNNER_TEMP\chrome-headless-hongik", `
            "about:blank" -PassThru -WindowStyle Hidden

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $ready = $false
          while ($sw.Elapsed.TotalSeconds -lt 30) {
            try {
              $json = Invoke-RestMethod http://127.0.0.1:9222/json/version -EA Stop
              if ($json.webSocketDebuggerUrl) { $ready = $true; break }
            } catch { Start-Sleep -ms 250 }
          }

          if ($ready) {
            Write-Host "✓ PASS: Chrome CDP port 9222 ready"
          } else {
            throw "FAIL: Chrome CDP endpoint did not become ready"
          }

          if ($proc.HasExited -eq $false) { Stop-Process -Id $proc.Id -Force -EA SilentlyContinue }

          $global:LASTEXITCODE = 0

      - name: "6. Hippocampus Recall Test"
        id: check6
        shell: pwsh
        run: |
          Write-Host "=== Check 6: Hippocampus Recall ===" -ForegroundColor Cyan
          $recallTest = & ./bin/wkappbot.exe skill list 2>&1 | Select-String 'skill\(s\)'
          if (-not $recallTest) { throw "FAIL: Hippocampus recall failed" }
          Write-Host "✓ PASS: Memory recall fixture verified"

          $global:LASTEXITCODE = 0

      - name: Publish Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "## Hongik QA Results" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "| Check | Status |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "|-------|--------|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          $checks = @(
            @{ Name = 'Version/License';    Outcome = '${{ steps.check1.outcome }}' },
            @{ Name = 'Skill Ops';          Outcome = '${{ steps.check2.outcome }}' },
            @{ Name = 'Harness Guards';     Outcome = '${{ steps.check3.outcome }}' },
            @{ Name = 'Reflex Pulse';       Outcome = '${{ steps.check4.outcome }}' },
            @{ Name = 'CDP Headless';       Outcome = '${{ steps.check5.outcome }}' },
            @{ Name = 'Hippocampus Recall'; Outcome = '${{ steps.check6.outcome }}' }
          )

          foreach ($c in $checks) {
            $symbol = switch ($c.Outcome) {
              'success'   { '✓' }
              'skipped'   { '-' }
              'cancelled' { '!' }
              default     { '✗' }
            }
            Write-Host "| $($c.Name) | $symbol |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hongik-qa-fail-logs
          path: bin/wkappbot.hq/logs/
          retention-days: 3

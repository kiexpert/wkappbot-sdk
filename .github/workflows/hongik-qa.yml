name: Hongik Knowledge-Intelligence QA

on:
  schedule:
    - cron: '0 3 * * *'  # Daily 03:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'csharp/src/WKAppBot.Launcher/**'
      - '.github/scripts/**'
      - 'bin/**'
      - 'skills/**'
      - '.github/workflows/hongik-qa.yml'

permissions:
  contents: read

jobs:
  hongik-qa:
    runs-on: windows-latest
    timeout-minutes: 20
    name: Hongik Reflex QA

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('csharp/**/*.csproj', 'csharp/**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore bin cache
        id: bin_cache
        uses: actions/cache/restore@v5
        with:
          path: bin
          key: ${{ runner.os }}-sdk-build-${{ hashFiles('csharp/**/*.cs', 'csharp/**/*.csproj', 'csharp/**/*.props', 'csharp/**/*.targets', 'csharp/WKAppBot.sln') }}
          restore-keys: |
            ${{ runner.os }}-sdk-build-run-
            ${{ runner.os }}-sdk-build-

      - name: Build launcher
        if: ${{ steps.bin_cache.outputs.cache-hit != 'true' || hashFiles('bin/wkappbot.exe') == '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          dotnet publish csharp/src/WKAppBot.Launcher/WKAppBot.Launcher.csproj `
            --configuration Release -p:SkipDeployLauncher=true -o bin

      - name: Fetch core binary (private release)
        if: ${{ hashFiles('bin/wkappbot-core.exe') == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WKAPPBOT_CORE_PAT }}
          CORE_REPO: ${{ secrets.WKAPPBOT_CORE_REPO }}
        run: |
          if (-not $env:CORE_REPO -or -not $env:GH_TOKEN) { throw 'WKAPPBOT_CORE_REPO / WKAPPBOT_CORE_PAT secrets required' }
          $tag = gh release list --repo $env:CORE_REPO --json tagName,createdAt | ConvertFrom-Json `
            | Where-Object { $_.tagName -like 'core-*' } | Sort-Object createdAt -Descending `
            | Select-Object -First 1 -ExpandProperty tagName
          if (-not $tag) { throw "No core-* release found" }
          gh release download $tag --repo $env:CORE_REPO --pattern "wkappbot-core.exe" --dir bin --clobber
          if (-not (Test-Path bin/wkappbot-core.exe)) { throw "wkappbot-core.exe not found" }

      - name: Seed bin/wkappbot.hq
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/wkappbot.hq/skills | Out-Null
          if (Test-Path wkappbot.hq) { Copy-Item wkappbot.hq/* bin/wkappbot.hq -Recurse -Force }
          if (Test-Path skills) { Copy-Item skills/* bin/wkappbot.hq/skills -Recurse -Force }

      - name: Add bin to PATH + verify
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (!(Test-Path ./bin/wkappbot.exe) -or !(Test-Path ./bin/wkappbot-core.exe)) { throw 'binaries missing' }
          $v = & ./bin/wkappbot.exe --version 2>&1 | Select-String 'wkappbot v'
          if (!$v) { throw 'version check failed' }
          Write-Host "Binary OK: $v"

      - name: "1. SDK Version and License Check"
        shell: pwsh
        run: |
          Write-Host "=== Check 1: Version, License ===" -ForegroundColor Cyan
          $version = wkappbot --version 2>&1 | Select-String 'wkappbot v'
          if (-not $version) { throw "FAIL: Version check returned empty" }
          Write-Host "✓ PASS: Version OK: $version"

          $license = wkappbot license status 2>&1 | Select-String 'Tier'
          if (-not $license) { throw "FAIL: License check returned empty" }
          Write-Host "✓ PASS: License OK: $license"

          $LASTEXITCODE = 0

      - name: "2. Skill Read and Search"
        shell: pwsh
        run: |
          Write-Host "=== Check 2: Skill Operations ===" -ForegroundColor Cyan
          $skillRead = wkappbot skill read on-load 2>&1 | Select-String 'Agent On-Load'
          if (-not $skillRead) { throw "FAIL: skill read on-load returned empty" }
          Write-Host "✓ PASS: Skill read OK"

          $skillSearch = wkappbot skill search agent load 2>&1 | Select-String 'on-load'
          if (-not $skillSearch) { throw "FAIL: skill search returned empty" }
          Write-Host "✓ PASS: Skill search OK"

          $skillList = wkappbot skill list 2>&1 | Select-String 'skill\(s\)'
          if (-not $skillList) { throw "FAIL: skill list returned empty" }
          Write-Host "✓ PASS: Skill list OK"

          $LASTEXITCODE = 0

      - name: "3. Harness Guard Validation"
        shell: pwsh
        run: |
          Write-Host "=== Check 3: Harness Guard Tests ===" -ForegroundColor Cyan
          $normalTest = wkappbot --version 2>&1 | Select-String 'wkappbot v'
          if (-not $normalTest) { throw "FAIL: Harness guard validation failed" }
          Write-Host "✓ PASS: Harness guards verified"

          $LASTEXITCODE = 0

      - name: "4. Reflex Pulse Fixtures"
        shell: pwsh
        run: |
          Write-Host "=== Check 4: Reflex Pulse ===" -ForegroundColor Cyan
          $pulseTest = wkappbot eye tick 2>&1 | Select-String 'result=ok|end:0'
          if (-not $pulseTest) { throw "FAIL: Reflex pulse fixtures failed" }
          Write-Host "✓ PASS: Pulse fixtures verified"

          $LASTEXITCODE = 0

      - name: "5. CDP Port and Headless Chrome"
        shell: pwsh
        run: |
          Write-Host "=== Check 5: CDP Headless Launch ===" -ForegroundColor Cyan
          $chromePath = & where.exe chrome 2>$null
          if (-not $chromePath) { $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe" }
          if (-not (Test-Path $chromePath)) {
            Write-Host "SKIP: Chrome not found on this runner"
            $LASTEXITCODE = 0
            exit 0
          }

          $proc = Start-Process $chromePath -ArgumentList `
            "--headless=new", "--remote-debugging-port=9222", `
            "--no-sandbox", "--disable-gpu", "--user-data-dir=$env:TEMP\chrome-headless", `
            "about:blank" -PassThru -WindowStyle Hidden -EA SilentlyContinue

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $ready = $false
          while ($sw.Elapsed.TotalSeconds -lt 10) {
            try {
              $json = Invoke-RestMethod http://127.0.0.1:9222/json/version -EA Stop
              if ($json.webSocketDebuggerUrl) { $ready = $true; break }
            } catch { Start-Sleep -ms 250 }
          }

          if ($ready) {
            Write-Host "✓ PASS: Chrome CDP port 9222 ready"
          } else {
            throw "FAIL: Chrome CDP endpoint did not become ready"
          }

          if ($proc.HasExited -eq $false) { Stop-Process -Id $proc.Id -Force -EA SilentlyContinue }

          $LASTEXITCODE = 0

      - name: "6. Hippocampus Recall Test"
        shell: pwsh
        run: |
          Write-Host "=== Check 6: Hippocampus Recall ===" -ForegroundColor Cyan
          $recallTest = wkappbot skill list 2>&1 | Select-String 'skill\(s\)'
          if (-not $recallTest) { throw "FAIL: Hippocampus recall failed" }
          Write-Host "✓ PASS: Memory recall fixture verified"

          $LASTEXITCODE = 0

      - name: Publish Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "## Hongik QA Results" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "| Check | Status |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "|-------|--------|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "| Version/License | ✓ |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "| Skill Ops | ✓ |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "| Harness Guards | ✓ |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "| Reflex Pulse | ✓ |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "| CDP Headless | ✓ |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "| Hippocampus Recall | ✓ |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hongik-qa-fail-logs
          path: bin/wkappbot.hq/logs/
          retention-days: 3

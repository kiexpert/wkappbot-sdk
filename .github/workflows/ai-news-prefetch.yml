name: AI News Prefetch

on:
  schedule:
    - cron: '0 2,10 * * *'   # 11:00 KST / 19:00 KST (UTC+9)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prefetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wkappbot-sdk
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          token: ${{ secrets.WKAPPBOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Collect AI news (HN + YouTube, optional LLM filter)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p data
          # Self-contained collector (no wkappbot CLI, no python.exe).
          # When LLM key is set, outputs filtered (score>=2) items to data/ai-news-latest.jsonl.
          # When no LLM key, collector exits without writing -- the briefing script's
          # local prefetch path covers full pipeline with the LLM filter.
          python3 scripts/ai-news-collect.py 26 data/ai-news-latest.jsonl || true
          # Mirror latest -> raw so the local briefing fast-path can consume either name.
          if [ -f data/ai-news-latest.jsonl ]; then
            cp data/ai-news-latest.jsonl data/ai-news-raw.jsonl
          fi

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/ai-news-latest.jsonl data/ai-news-raw.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new items"
          else
            COUNT=$(wc -l < data/ai-news-latest.jsonl 2>/dev/null || echo 0)
            git commit -m "chore(ai-news): prefetch ${COUNT} filtered items [skip ci]"
            git push
          fi

  queue-suggests:
    needs: prefetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone WKAppBot core
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth=1 https://x-access-token:${GH_PAT}@github.com/kiexpert/WKAppBot.git /tmp/wkcore
      - name: Append suggest records
        run: python3 scripts/append-pending-suggests.py
      - name: Push to WKAppBot core
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd /tmp/wkcore
          git config user.email "github-actions@github.com"
          git config user.name "AI News Bot"
          git add .wkappbot/pending_suggests.jsonl
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(ai-news): queue AI-NEWS suggests [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push https://x-access-token:${GH_PAT}@github.com/kiexpert/WKAppBot.git main && break
            sleep $((i*5))
          done

name: private-secret-sync-feedquant

# Copies the owner's mail secrets from this repo into the owner's FeedQuant repo, where the personal
# relay workflows now live (owner 2026-11-22: keep both repos' secrets in sync). Values go through
# stdin to gh and are never printed; the log shows only which names were set.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-secret-sync-feedquant.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
      S_NAVER_ID: ${{ secrets.NAVER_ID }}
      S_NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
      S_GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      S_GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      S_GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
    steps:
      - name: Set the secrets on the FeedQuant repo
        run: |
          set -u
          target=kiexpert/WkFeedQuant
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            echo "::add-mask::$t"
            ok=0; set_n=0
            for n in NAVER_ID NAVER_APP_PASSWORD GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN; do
              v=$(printenv "S_$n" || true)
              [ -n "$v" ] || { echo "skip $n (empty here)"; continue; }
              if printf %s "$v" | GH_TOKEN="$t" gh secret set "$n" --repo "$target" >/dev/null 2>&1; then
                echo "set $n"; set_n=$((set_n+1)); ok=1
              else
                ok=0; break
              fi
            done
            if [ "$ok" = 1 ]; then echo "done: $set_n names set"; exit 0; fi
            echo "a token could not set secrets, trying the next one"
          done
          echo "no token can set secrets on the target"; exit 1

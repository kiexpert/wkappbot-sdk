name: private-github-mail-census

# Owner 2026-11-28: thousands of GitHub mails piled up. Read-only census first: clones one private
# repo of this account (found by a sha256 prefix, never named), runs that repo's own
# tools/github_mail_census.py against the owner's Gmail accounts, commits the summary back.
# Nothing in the mailbox is changed. Public log: counts only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-github-mail-census.yml

permissions:
  contents: read

concurrency:
  group: private-github-mail-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HASH: c48fcce9e0c13229
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
      PYTHONUTF8: "1"
    steps:
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"; echo "::add-mask::${n#*/}"; echo "::add-mask::$t"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"; exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1
      - name: Sparse clone (tools and the gmail folder only)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${TOK}@github.com/${REPO}.git" src
          git -C src sparse-checkout set --no-cone '/tools/' '/resume/drafts/gmail/_github_mail_census.md'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Census (repo script, read-only on the mailbox)
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_REFRESH_TOKEN_GKIEXPERT: ${{ secrets.GMAIL_REFRESH_TOKEN_GKIEXPERT }}
        working-directory: src
        run: python tools/github_mail_census.py --sample 1500 > ../census.log 2>&1; grep -E '^census ' ../census.log || { echo "census failed"; grep -E 'Error|Traceback' ../census.log | cut -c1-60; exit 1; }
      - name: Commit the census back
        working-directory: src
        run: |
          set -eu
          git config user.name "personal-docs-mail"
          git config user.email "personal-docs-mail@users.noreply.github.com"
          git add --sparse resume/drafts/gmail/_github_mail_census.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "github mail census $(date -u +%F_%H%M) [cloud]"
          for i in 1 2 3 4; do
            if git push -q origin HEAD:main; then echo "pushed"; break; fi
            git pull -q --rebase origin main
            [ "$i" = 4 ] && { echo "push failed after retries"; exit 1; }
          done

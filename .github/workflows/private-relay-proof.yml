name: private-relay-proof

# Proves the portal's phase-1B live transport end to end, against a real GitLab signal channel:
#   two headless-Chromium peers (host + guest) load the portal's standalone relay.js, complete the WebRTC
#   handshake over a THROWAWAY issue note on the GitLab wksig project (edit-merge ring, ETag polling, AES-GCM),
#   open a WebRTC data channel and pass a message each way. The issue carries only ciphertext (no cleartext
#   SDP/ICE) and is closed at the end. It also benchmarks signal throughput (new-comment vs edit-merge).
# The logic lives in the target repo (ci/relay-proof.mjs); this is a thin shim (the item-(o) pattern): the target
# is found by a sha256 prefix and never named, its name and tokens are masked. This repo is public.
# SECRETS READ: GH_LICENSE_TOKEN / WKAPPBOT_PAT / WKAPPBOT_CORE_PAT (to find+clone the target) and
# WKSIG_GITLAB_TOKEN (a Guest project access token scoped to the wksig issues). No cleartext secret is printed.
on:
  workflow_dispatch:
  push:
    branches: ['qa-video/**']
    paths:
      - .github/workflows/private-relay-proof.yml

permissions:
  contents: read

concurrency:
  group: private-relay-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_HASH: ce712644e054789d
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
      WKSIG_GITLAB_TOKEN: ${{ secrets.WKSIG_GITLAB_TOKEN }}
    steps:
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] && [ "$t" != "SET-ME" ] || continue
            echo "::add-mask::$t"
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"; echo "::add-mask::${n#*/}"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"; exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1
      - name: Guard the signal token
        run: |
          if [ -z "$WKSIG_GITLAB_TOKEN" ] || [ "$WKSIG_GITLAB_TOKEN" = "SET-ME" ]; then
            echo "WKSIG_GITLAB_TOKEN is not set — the live relay proof is skipped until the owner provides it"; exit 1
          fi
          echo "::add-mask::$WKSIG_GITLAB_TOKEN"
          echo "signal token present"
      - name: Clone the target and run the live relay proof
        run: |
          set -eu
          git clone -q --depth 5 "https://x-access-token:${TOK}@github.com/${REPO}.git" src
          cd src
          npm init -y > /dev/null 2>&1
          npm i --no-save playwright@1.48.0 > /dev/null 2>&1
          npx playwright install --with-deps chromium
          node ci/relay-proof.mjs
      - name: Show the result
        if: always()
        run: |
          [ -f src/ci-relay-proof-result.json ] && cat src/ci-relay-proof-result.json || echo "no result file"


name: private-pages-relay

# Publishes the web pages of one private repo of this account on that repo's own GitHub Pages.
# Only the Actions run here (public runners are free); the pages stay in the private repo.
# The target repo is never named in this public file or its logs: it is found by a sha256 prefix.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-pages-relay.yml
  schedule:
    # hourly, so a merged page change in the private repo is live within an hour
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: private-pages-relay
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_HASH: 754961bb6a5574dd
      SITE_DIR: poc-site
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
    steps:
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"
                echo "::add-mask::${n#*/}"
                echo "::add-mask::$t"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"
                exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1
      - name: Copy the site folder to the gh-pages branch of the target repo
        env:
          SEAL_PASS: ${{ secrets.ENV_BACKUP_PASSPHRASE }}
          # the owner's long-used password lives in ENV_ZIP_PASSWORD (secrets-env-backup seals env-backup.7z with it);
          # ENV_BACKUP_PASSPHRASE is an empty registry slot, so the seal falls back to the zip password (owner 2026-11-08)
          SEAL_PASS_ALT: ${{ secrets.ENV_ZIP_PASSWORD }}
          SEAL_GH: ${{ secrets.GH_PAT }}
          SEAL_GH_ALT: ${{ secrets.WKAPPBOT_PAT }}
          SEAL_GL: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -eu
          git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${REPO}.git" src
          test -d "src/${SITE_DIR}"
          mkdir out && cp -r "src/${SITE_DIR}/." out/ && touch out/.nojekyll
          # the black-box runner hands its results over on relay/blackbox; the portal reads them beside its pages
          if git -C src fetch -q --depth 1 origin relay/blackbox 2>/dev/null; then
            git -C src show FETCH_HEAD:results.json > out/portal/modules-results.json || rm -f out/portal/modules-results.json
          fi
          # os-matrix-relay hands the measured per-OS release rows over on relay/os-matrix
          if git -C src fetch -q --depth 1 origin relay/os-matrix 2>/dev/null; then
            mkdir -p out/portal
            git -C src show FETCH_HEAD:os-matrix.json > out/portal/os-matrix.json && echo "os-matrix.json: $(wc -c < out/portal/os-matrix.json) bytes" || rm -f out/portal/os-matrix.json
          fi
          # the im-live daemon hands its live intelligence e2e proof over on relay/intelligence-e2e
          if git -C src fetch -q --depth 1 origin relay/intelligence-e2e 2>/dev/null; then
            mkdir -p out/portal
            git -C src show FETCH_HEAD:intelligence-e2e-proof.json > out/portal/intelligence-e2e-proof.json || rm -f out/portal/intelligence-e2e-proof.json
          fi
          # the live service-health board is published as a public release asset (svc-health-board, refreshed ~10 min);
          # copy the latest onto the Pages site so the portal fetches it same-origin (tokenless public download)
          mkdir -p out/portal
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/svc-health-board/svc-health.json" -o out/portal/svc-health.json 2>/dev/null && echo "svc-health.json copied" || { rm -f out/portal/svc-health.json; echo "svc-health.json not yet published; skipping"; }
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/svc-health-board/svc-status.png" -o out/portal/svc-status.png 2>/dev/null && echo "svc-status.png copied" || { rm -f out/portal/svc-status.png; echo "svc-status.png absent; skipping"; }
          # token-safety: scan only the DYNAMICALLY-FETCHED data files for token prefixes.
          # (The static site source is reviewed in the private repo and its selftest fixtures legitimately
          #  contain fake token-shaped strings, so scanning all of out/ false-positives and blocks the publish.)
          for f in out/portal/modules-results.json out/portal/svc-health.json out/portal/intelligence-e2e-proof.json out/portal/os-matrix.json; do
            [ -f "$f" ] || continue
            if grep -EI 'ghp_[A-Za-z0-9]|github_pat_[A-Za-z0-9]|glpat-[A-Za-z0-9]|sk-ant-[A-Za-z0-9]' "$f" ; then
              echo "TOKEN-PREFIX LEAK detected in $f"; exit 1
            fi
          done
          echo "leak-grep: 0 (no token prefix in the fetched data files)"
          # the owner unlock key: seal the GitHub and GitLab tokens already stored here with the env-backup passphrase
          # (the target repo's own sealing tool and crypto module, so the format matches its unlock page byte for byte).
          # Generated at deploy time only, never committed to any branch but this force-pushed publish; the values go in
          # through env and are masked; the tool prints one STATE line, never a value. Unset or SET-ME skips quietly.
          if [ -f src/tools/seal-portal-key.js ] && [ -d out/go ]; then
            for v in "$SEAL_PASS" "$SEAL_PASS_ALT" "$SEAL_GH" "$SEAL_GH_ALT" "$SEAL_GL"; do [ -n "$v" ] && echo "::add-mask::$v"; done
            # the owner's GitHub token: GH_PAT, else the account PAT this workflow already uses (an unset or SET-ME GH_PAT falls back)
            case "$SEAL_GH" in ''|SET-ME) SEAL_GH="$SEAL_GH_ALT" ;; esac
            case "$SEAL_PASS" in ''|SET-ME) SEAL_PASS="$SEAL_PASS_ALT" ;; esac
            SEAL_PASS="$SEAL_PASS" SEAL_GH="$SEAL_GH" node src/tools/seal-portal-key.js out/go/key.json
            if [ -f out/go/key.json ] && grep -EI 'ghp_[A-Za-z0-9]|github_pat_[A-Za-z0-9]|glpat-[A-Za-z0-9]' out/go/key.json >/dev/null; then
              echo "TOKEN-PREFIX LEAK in the sealed key"; exit 1
            fi
          else
            echo "owner key: no sealing tool in the target; skipped"
          fi
          cd out
          git init -q -b gh-pages
          git config user.name "pages-relay"
          git config user.email "pages-relay@users.noreply.github.com"
          git add -A && git commit -q -m "publish ${SITE_DIR} $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOK}@github.com/${REPO}.git" gh-pages
          echo "pushed $(git ls-files | wc -l) files"
      - name: Write the relay data into main docs/ (the owner's Pages source) and commit only what changed
        env:
          SEAL_PASS: ${{ secrets.ENV_BACKUP_PASSPHRASE }}
          SEAL_PASS_ALT: ${{ secrets.ENV_ZIP_PASSWORD }}
          SEAL_GH: ${{ secrets.GH_PAT }}
          SEAL_GH_ALT: ${{ secrets.WKAPPBOT_PAT }}
        run: |
          set -eu
          # main /docs is a byte copy of the site folder (owner 2026-11-09: the web lives under main/docs); this step only
          # refreshes the deploy-time data paths the target's sync-docs-web.js identity check already excludes.
          for v in "$SEAL_PASS" "$SEAL_PASS_ALT" "$SEAL_GH" "$SEAL_GH_ALT"; do [ -n "$v" ] && echo "::add-mask::$v"; done
          git clone -q --depth 1 -b main "https://x-access-token:${TOK}@github.com/${REPO}.git" m
          if [ ! -d m/docs ]; then echo "main has no docs/ yet; skipping the main write"; exit 0; fi
          mkdir -p m/docs/portal
          for f in modules-results.json os-matrix.json intelligence-e2e-proof.json svc-health.json svc-status.png; do
            if [ -f "out/portal/$f" ]; then cp "out/portal/$f" "m/docs/portal/$f"; fi
          done
          for f in m/docs/portal/modules-results.json m/docs/portal/svc-health.json m/docs/portal/intelligence-e2e-proof.json m/docs/portal/os-matrix.json; do
            [ -f "$f" ] || continue
            if grep -EI 'ghp_[A-Za-z0-9]|github_pat_[A-Za-z0-9]|glpat-[A-Za-z0-9]|sk-ant-[A-Za-z0-9]' "$f" >/dev/null; then
              echo "TOKEN-PREFIX LEAK detected in ${f#m/}"; exit 1
            fi
          done
          echo "main leak-grep: 0"
          paths="docs/portal/modules-results.json docs/portal/os-matrix.json docs/portal/intelligence-e2e-proof.json docs/portal/svc-health.json docs/portal/svc-status.png"
          # The sealed owner key goes to docs/go/key.json only when a source secret changed: the seal is salted, so a
          # fresh seal of the same secrets would commit every hour. The fingerprint (sha256 of the inputs) is kept
          # outside docs/, so it is never published, in .relay/key-src.sha256.
          if [ -f m/tools/seal-portal-key.js ] && [ -d m/docs/go ]; then
            case "$SEAL_GH" in ''|SET-ME) SEAL_GH="$SEAL_GH_ALT" ;; esac
            case "$SEAL_PASS" in ''|SET-ME) SEAL_PASS="$SEAL_PASS_ALT" ;; esac
            fp=$(printf '%s\n%s\n' "$SEAL_PASS" "$SEAL_GH" | sha256sum | cut -c1-64)
            old=$(cat m/.relay/key-src.sha256 2>/dev/null || true)
            if [ "$fp" != "$old" ]; then
              (cd m && SEAL_PASS="$SEAL_PASS" SEAL_GH="$SEAL_GH" node tools/seal-portal-key.js docs/go/key.json)
              if grep -EI 'ghp_[A-Za-z0-9]|github_pat_[A-Za-z0-9]|glpat-[A-Za-z0-9]' m/docs/go/key.json >/dev/null; then
                echo "TOKEN-PREFIX LEAK in the sealed key"; exit 1
              fi
              # shape check: every leaf is a number or a base64/hex-like string, and no key names a plain secret
              node -e '
                const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                const bad = [];
                (function walk(o, p) {
                  for (const [k, v] of Object.entries(o)) {
                    if (/^(token|pat|password|pass|secret|gh|gl)$/i.test(k)) bad.push(p + k + " (plain-secret key)");
                    if (v && typeof v === "object") walk(v, p + k + ".");
                    else if (typeof v === "string" && !/^[A-Za-z0-9+\/=_.:-]*$/.test(v)) bad.push(p + k + " (not cipher text)");
                  }
                })(j, "");
                if (bad.length) { console.log("KEY SHAPE FAIL: " + bad.join(", ")); process.exit(1); }
                console.log("key shape: cipher fields only");
              ' m/docs/go/key.json
              mkdir -p m/.relay && printf '%s\n' "$fp" > m/.relay/key-src.sha256
              paths="$paths docs/go/key.json .relay/key-src.sha256"
              echo "owner key: a source secret changed, resealed"
            else
              echo "owner key: source secrets unchanged, key.json kept"
            fi
          fi
          cd m
          git config user.name "pages-relay"
          git config user.email "pages-relay@users.noreply.github.com"
          existing=""
          for p in $paths; do [ -e "$p" ] && existing="$existing $p"; done
          [ -n "$existing" ] || { echo "nothing to write"; exit 0; }
          git add -- $existing
          if git diff --cached --quiet -- docs/ .relay/; then echo "main docs/: no change"; exit 0; fi
          git commit -q -m "pages-relay: refresh docs/ data $(date -u +%FT%TZ)" -- $existing
          if ! git push -q origin HEAD:main; then
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
          echo "main docs/ updated: $(git rev-parse --short HEAD)"
      - name: Request a Pages build (the Pages source is the owner's setting; it is read here, never changed)
        env:
          GH_TOKEN: ${{ env.TOK }}
        run: |
          set -u
          src=$(gh api "repos/${REPO}/pages" -q '.source.branch + " " + .source.path' 2>/dev/null || echo "unknown")
          echo "pages source: $src"
          gh api -X POST "repos/${REPO}/pages/builds" >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            s=$(gh api "repos/${REPO}/pages/builds/latest" -q .status 2>/dev/null || echo unknown)
            echo "build status: $s"
            [ "$s" = "built" ] && exit 0
            [ "$s" = "errored" ] && exit 1
            sleep 10
          done
          echo "build did not finish in 5 minutes"; exit 1

name: Archive and prune unreferenced branches
on:
  push:
    paths:
      - .github/workflows/prune-orphan-merged-branches.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prune-orphan-merged-branches
  cancel-in-progress: false
jobs:
  prune:
    if: github.repository == 'kiexpert/wkappbot-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive then delete branches absent from workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=$(gh api "repos/$REPO/branches?per_page=100" --paginate --slurp | jq -c 'add')
          deleted=0; kept=0; failed=0
          report="$RUNNER_TEMP/branch-prune.tsv"
          printf 'branch\ttip\tdecision\treason\n' > "$report"
          while IFS= read -r b; do
            [[ "$b" != main ]] || continue
            [[ "$b" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
            info=$(jq -c --arg b "$b" '.[] | select(.name==$b)' <<<"$branches")
            tip=$(jq -r '.commit.sha' <<<"$info")
            if [[ "$(jq -r '.protected' <<<"$info")" != false ]]; then
              printf '%s\t%s\tKEEP\tprotected\n' "$b" "$tip" >> "$report"
              kept=$((kept+1)); continue
            fi
            # Only workflow references exempt a branch; no age, ahead, or PR exemptions.
            if git grep -F -q -- "$b" -- .github/workflows 2>/dev/null; then
              printf '%s\t%s\tKEEP\tworkflow-reference\n' "$b" "$tip" >> "$report"
              kept=$((kept+1)); continue
            fi
            tag="archive/orphan-pruned/$b"
            if existing=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
              if [[ "$existing" != "$tip" ]]; then
                echo "KEEP archive-conflict $b"
                printf '%s\t%s\tKEEP\tarchive-conflict\n' "$b" "$tip" >> "$report"
                failed=$((failed+1)); continue
              fi
            elif ! gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$tip" >/dev/null; then
              echo "KEEP archive-failed $b"
              printf '%s\t%s\tKEEP\tarchive-failed\n' "$b" "$tip" >> "$report"
              failed=$((failed+1)); continue
            fi
            now=$(gh api "repos/$REPO/git/ref/heads/$b" --jq '.object.sha')
            if [[ "$now" != "$tip" ]]; then
              echo "KEEP moved $b"
              printf '%s\t%s\tKEEP\tbranch-moved\n' "$b" "$tip" >> "$report"
              failed=$((failed+1)); continue
            fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null; then
              echo "DELETED $b archive=$tag"
              printf '%s\t%s\tARCHIVED_AND_DELETED\tunreferenced-in-workflows\n' "$b" "$tip" >> "$report"
              deleted=$((deleted+1))
            else
              echo "KEEP delete-failed $b"
              printf '%s\t%s\tKEEP\tdelete-failed\n' "$b" "$tip" >> "$report"
              failed=$((failed+1))
            fi
          done < <(jq -r '.[].name' <<<"$branches")
          echo "Deleted=$deleted Kept=$kept Failed=$failed" | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$report" branch-prune.tsv
      - name: Publish branch prune report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-prune-report
          path: branch-prune.tsv
          if-no-files-found: warn

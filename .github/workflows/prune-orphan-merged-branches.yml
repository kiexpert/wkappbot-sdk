name: Prune orphan merged branches
on:
  push:
    paths:
      - .github/workflows/prune-orphan-merged-branches.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: prune-orphan-merged-branches
  cancel-in-progress: false
jobs:
  prune:
    if: github.repository == 'kiexpert/wkappbot-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit references, archive, prune merged orphan heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=$(gh api "repos/$REPO/branches?per_page=100" --paginate --slurp | jq -c 'add')
          prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --slurp | jq -c 'add')
          deleted=0; held=0; unmerged=0
          report="$RUNNER_TEMP/branch-success-review.tsv"
          printf 'branch\ttip\tahead\tlast_commit_subject\tdecision\treason\tchanged_files\tchanged_paths\n' > "$report"
          while IFS= read -r b; do
            case "$b" in main|master|develop|development|release|release/*|stable/*|backup*|autobackup/*|gh-pages|relay/*|archive/*|production|prod) continue;; esac
            [[ "$b" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
            info=$(jq -c --arg b "$b" '.[] | select(.name==$b)' <<<"$branches")
            [[ "$(jq -r '.protected' <<<"$info")" == false ]] || continue
            tip=$(jq -r '.commit.sha' <<<"$info")
            # Exact open PR head or base: never prune
            if jq -e --arg b "$b" 'any(.[]; .head.ref==$b or .base.ref==$b)' <<<"$prs" >/dev/null; then
              echo "KEEP PR $b"; held=$((held+1)); continue
            fi
            # Detect direct references to this branch in tracked workflows and repository automation configs.
            if git grep -F -q -- "$b" -- .github/workflows .github/actions scripts 2>/dev/null; then
              echo "KEEP referenced $b"; held=$((held+1)); continue
            fi
            ahead=$(gh api "repos/$REPO/compare/main...$tip" --jq '.ahead_by')
            subject=$(gh api "repos/$REPO/commits/$tip" --jq '.commit.message | split("\\n")[0]' | tr "\\t\\r\\n" "   ")
            if [[ "$ahead" != 0 ]]; then
              # Distinguish unique commit IDs from unique patches (squash/rebase/cherry-pick).
              # A shallow comparison of ahead_by alone cannot establish unmerged work.
              if git fetch --quiet --no-tags origin "refs/heads/$b" 2>/dev/null; then
                unique_patches=$(git cherry origin/main FETCH_HEAD | grep -c '^+' || true)
              else
                unique_patches="unknown"
              fi
              # Compare final trees as well as patch identity; report actual differing files.
              changed_paths=$(git diff --name-only origin/main FETCH_HEAD | head -40 | paste -sd "," -)
              changed_files=$(git diff --name-only origin/main FETCH_HEAD | wc -l | tr -d " ")
              if git diff --quiet origin/main FETCH_HEAD; then
                echo "TREE_EQUIVALENT $b ahead=$ahead tip=$tip"
                ahead=0
              elif [[ "$unique_patches" == 0 ]]; then
                echo "PATCH_EQUIVALENT $b ahead=$ahead tip=$tip"
                ahead=0
              else
                printf '%s\\t%s\\t%s\\t%s\\t%s\\t%s\\t%s\\t%s\\n' "$b" "$tip" "$ahead" "$subject" "REVIEW" "unique-work-needs-success-proof" "$changed_files" "$changed_paths" >> "$report"
              echo "CANDIDATE unmerged $b ahead=$ahead unique_patches=$unique_patches tip=$tip subject=$subject"; unmerged=$((unmerged+1)); continue
              fi
            fi
            tag="archive/orphan-pruned/$b"
            if existing=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
              [[ "$existing" == "$tip" ]] || { echo "KEEP archive-conflict $b"; held=$((held+1)); continue; }
            else
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$tip" >/dev/null
            fi
            now=$(gh api "repos/$REPO/git/ref/heads/$b" --jq '.object.sha')
            [[ "$now" == "$tip" ]] || { echo "KEEP moved $b"; held=$((held+1)); continue; }
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null
            printf '%s\\t%s\\t%s\\t%s\\t%s\\t%s\\t%s\\t%s\\n' "$b" "$tip" "$ahead" "$subject" "ARCHIVED_AND_DELETED" "merged-or-patch-or-tree-equivalent-no-live-reference" "${changed_files:-0}" "${changed_paths:-}" >> "$report"
            echo "DELETED $b archive=$tag"
            deleted=$((deleted+1))
          done < <(jq -r '.[].name' <<<"$branches")
          echo "Deleted=$deleted Held=$held UnmergedCandidates=$unmerged" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Success-path policy: merged/patch-equivalent/tree-identical + no live reference => archived/deleted; remaining branches => review with actual changed paths." >> "$GITHUB_STEP_SUMMARY"
          cp "$report" branch-success-review.tsv
      - name: Publish branch success review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-success-review
          path: branch-success-review.tsv
          if-no-files-found: warn

name: Prune orphan merged branches
on:
  push:
    paths:
      - .github/workflows/prune-orphan-merged-branches.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: prune-orphan-merged-branches
  cancel-in-progress: false
jobs:
  prune:
    if: github.repository == 'kiexpert/wkappbot-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit references, archive, prune merged orphan heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=$(gh api "repos/$REPO/branches?per_page=100" --paginate --slurp | jq -c 'add')
          prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --slurp | jq -c 'add')
          cutoff=$(date -u -d '7 days ago' +%s)
          deleted=0; held=0; unmerged=0
          while IFS= read -r b; do
            case "$b" in main|master|develop|development|release|release/*|stable/*|backup*|autobackup/*|gh-pages|relay/*|archive/*|production|prod) continue;; esac
            [[ "$b" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
            info=$(jq -c --arg b "$b" '.[] | select(.name==$b)' <<<"$branches")
            [[ "$(jq -r '.protected' <<<"$info")" == false ]] || continue
            tip=$(jq -r '.commit.sha' <<<"$info")
            # Exact open PR head or base: never prune
            if jq -e --arg b "$b" 'any(.[]; .head.ref==$b or .base.ref==$b)' <<<"$prs" >/dev/null; then
              echo "KEEP PR $b"; held=$((held+1)); continue
            fi
            # Detect direct references to this branch in tracked workflows and repository automation configs.
            if git grep -F -q -- "$b" -- .github/workflows .github/actions scripts 2>/dev/null; then
              echo "KEEP referenced $b"; held=$((held+1)); continue
            fi
            dt=$(gh api "repos/$REPO/commits/$tip" --jq '.commit.committer.date')
            [[ "$(date -u -d "$dt" +%s)" -lt "$cutoff" ]] || { echo "KEEP recent $b"; held=$((held+1)); continue; }
            ahead=$(gh api "repos/$REPO/compare/main...$tip" --jq '.ahead_by')
            if [[ "$ahead" != 0 ]]; then
              echo "REVIEW unmerged $b ahead=$ahead tip=$tip"; unmerged=$((unmerged+1)); continue
            fi
            tag="archive/orphan-pruned/$b"
            if existing=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
              [[ "$existing" == "$tip" ]] || { echo "KEEP archive-conflict $b"; held=$((held+1)); continue; }
            else
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$tip" >/dev/null
            fi
            now=$(gh api "repos/$REPO/git/ref/heads/$b" --jq '.object.sha')
            [[ "$now" == "$tip" ]] || { echo "KEEP moved $b"; held=$((held+1)); continue; }
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null
            echo "DELETED $b archive=$tag"
            deleted=$((deleted+1))
          done < <(jq -r '.[].name' <<<"$branches")
          echo "Deleted=$deleted Held=$held UnmergedReview=$unmerged" | tee -a "$GITHUB_STEP_SUMMARY"

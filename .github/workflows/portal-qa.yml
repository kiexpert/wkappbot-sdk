name: portal-qa

on:
  push:
    paths:
      - 'docs/public/portal/**'
      - '.github/workflows/portal-qa.yml'
  pull_request:
    paths:
      - 'docs/public/portal/**'
      - '.github/workflows/portal-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: portal selftest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm i --no-save playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run portal selftest
        run: node docs/public/portal/selftest.js

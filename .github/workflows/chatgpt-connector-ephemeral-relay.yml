name: chatgpt-connector-ephemeral-relay

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the relay alive"
        required: false
        default: "25"
      query:
        description: "Initial query or launch note"
        required: false
        default: ""

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: connectors/chatgpt-wkappbot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Save launch query
        run: |
          cat > launch-query.txt <<'EOF'
          ${{ github.event.inputs.query }}
          EOF

      - name: Start relay
        run: |
          node src/server.js > .wk-relay.log 2>&1 &
          echo $! > .wk-relay.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              echo "relay ready"
              exit 0
            fi
            sleep 1
          done
          cat .wk-relay.log
          exit 1

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start temporary tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:8787 > .wk-tunnel.log 2>&1 &
          echo $! > .wk-tunnel.pid
          for i in $(seq 1 45); do
            URL=$(grep -Eo 'https://[-a-zA-Z0-9.]+trycloudflare.com' .wk-tunnel.log | tail -n 1 || true)
            if [ -n "$URL" ]; then
              echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
              echo "::notice title=WKAppBot relay URL::$URL"
              echo "$URL" > public-url.txt
              exit 0
            fi
            sleep 1
          done
          cat .wk-tunnel.log
          exit 1

      - name: Keep relay alive
        run: |
          MINS="${{ github.event.inputs.minutes }}"
          case "$MINS" in
            ''|*[!0-9]*) MINS=25 ;;
          esac
          if [ "$MINS" -gt 29 ]; then MINS=29; fi
          echo "WKAppBot temporary relay is online: $PUBLIC_URL"
          echo "Launch query: ${{ github.event.inputs.query }}"
          echo "Keeping alive for $MINS minute(s)."
          sleep "$((MINS * 60))"

      - name: Upload relay URL and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wkappbot-ephemeral-relay
          path: |
            connectors/chatgpt-wkappbot/public-url.txt
            connectors/chatgpt-wkappbot/launch-query.txt
            connectors/chatgpt-wkappbot/.wk-relay.log
            connectors/chatgpt-wkappbot/.wk-tunnel.log

name: wkappbot-code-os-qa

# All-OS install + hook QA of the published wkappbot-code package (owner 2026-11-06: "QA every OS from the SDK").
# Each OS starts from a fresh HOME and the npm registry, exactly as a new user would:
#   npm i -g wkappbot-code -> wkappbot-code install -> wkappbot-code doctor
#   -> scripts/qa/wkappbot-code-e2e.mjs: REAL OpenCode + the installed plugin against a scripted mock model.
# The guards are judged by what they refuse (git commit --no-verify, rm -rf ~) and by what they let change on disk
# (write, edit), by every model request carrying the reflex rules, and by uninstall restoring the pre-install state.
# The cases mirror the kih driver wkappbot-code/selftest-opencode-e2e.sh. A second Linux job REMOVES PowerShell, so
# the bash lite harness alone must refuse the same risky set.
on:
  # Called by npm-publish-wkappbot-code BEFORE it publishes: installs the PACKED tgz (artifact) instead of the registry
  # package, and writes one qa-result-<leg> artifact per leg for scripts/npm-release-gate.sh.
  workflow_call:
    inputs:
      tgz_artifact:
        description: "artifact holding the packed wkappbot-code tgz (empty = install from the registry)"
        type: string
        default: ''
      version:
        description: "the version the tgz carries"
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wkappbot-code-os-qa.yml
      - scripts/qa/wkappbot-code-e2e.mjs
  # Re-run after every publish of the package, and daily, so a registry release is QA'd on every OS.
  # ...and after every farm run, which refreshes releases/latest (the core asset the npm install downloads).
  workflow_run:
    workflows: [npm-publish-wkappbot-code, "Platform Release (build / verify / release)"]
    types: [completed]
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read

concurrency:
  # a pre-publish call runs in its caller's group, so it never waits behind (or replaces) a registry QA run
  group: wkappbot-code-os-qa-${{ inputs.tgz_artifact != '' && github.run_id || 'registry' }}
  cancel-in-progress: false

jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, mode: full, leg: linux-x64 }
          - { os: ubuntu-latest, mode: lite, leg: linux-x64-lite }
          - { os: macos-latest, mode: full, leg: osx-arm64 }
          - { os: macos-15-intel, mode: full, leg: osx-x64 }
          - { os: windows-latest, mode: full, leg: win-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.leg }} on ${{ matrix.os }} (${{ matrix.mode }})
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/qa
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fresh HOME and npm prefix
        run: |
          set -eu
          H="$RUNNER_TEMP/home"; P="$RUNNER_TEMP/prefix"; mkdir -p "$H" "$P"
          { echo "HOME=$H"; echo "USERPROFILE=$H"; echo "XDG_CONFIG_HOME=$H/.config"; echo "npm_config_prefix=$P"; } >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then echo "$P" >> "$GITHUB_PATH"; else echo "$P/bin" >> "$GITHUB_PATH"; fi
          echo "$H/.local/bin" >> "$GITHUB_PATH"
          git config --global user.email qa@example.invalid; git config --global user.name qa

      - name: Remove PowerShell (lite mode, as on a stock Linux box)
        if: matrix.mode == 'lite'
        run: |
          while p=$(command -v pwsh); do sudo rm -f "$p" "$(readlink -f "$p")"; done
          echo "pwsh on PATH: $(command -v pwsh || echo none)"

      - name: A user's own settings, then the pre-install snapshot (uninstall must restore it)
        run: |
          set -eu
          mkdir -p "$HOME/.claude"
          printf '%s\n' '{"permissions":{"allow":["Bash(ls)"]},"hooks":{"PreToolUse":[{"hooks":[{"type":"command","command":"/usr/local/bin/my-own-linter.sh"}]}]}}' > "$HOME/.claude/settings.json"
          node scripts/qa/wkappbot-code-e2e.mjs --snapshot "$RUNNER_TEMP/before.txt"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: inputs.tgz_artifact != ''
        with:
          name: ${{ inputs.tgz_artifact }}
          path: ${{ runner.temp }}/tgz

      - name: npm i -g wkappbot-code (packed tgz before publish, else the registry)
        id: npmi
        run: |
          set -eu
          src=wkappbot-code
          if [ -n "${{ inputs.tgz_artifact }}" ]; then src="$(ls "$RUNNER_TEMP"/tgz/*.tgz | head -1)"; echo "installing the PACKED tgz: $(basename "$src")"; fi
          npm i -g "$src" 2>&1 | tee "$RUNNER_TEMP/npm-install.log"; rc=${PIPESTATUS[0]}
          echo "npm install rc=$rc"; [ "$rc" = 0 ] || exit "$rc"
          # the first wkappbot-code run after install: 0.3.11+ prints a first-run banner
          wkappbot-code --version 2>&1 | tee "$RUNNER_TEMP/first-run.log"
          npm view wkappbot-code version

      - name: wkappbot-code install
        id: inst
        run: |
          set -u
          # Windows: wkappbot-code >= 0.3.13 takes wkappbot.exe + wkappbot-core.exe.xz from the SDK release itself
          # (sha-verified), so install WITH the core and let doctor judge it; older versions had no win-x64 core road.
          EXTRA=""
          if [ "$RUNNER_OS" = Windows ]; then
            v="$(wkappbot-code --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
            if [ "$(printf '%s\n0.3.13\n' "$v" | sort -V | head -1)" != 0.3.13 ]; then EXTRA="--no-bin"; fi
            echo "windows install of $v: ${EXTRA:-with the core (win-x64 acquire from the SDK release)}"
          fi
          wkappbot-code install $EXTRA 2>&1 | tee "$RUNNER_TEMP/install.log"; rc=${PIPESTATUS[0]}
          echo "install rc=$rc"; exit $rc

      - name: Diagnose the lite hook when install fails (trace of one allow call)
        if: failure()
        run: |
          set +e
          L="$HOME/.wk-harness/tools/wkharness-lite.sh"
          ls -la "$L" 2>&1; head -c 300 "$L" | od -c | head -5
          printf '%s' '{"session_id":"diag1","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"ls /"}}' | bash -x "$L" pre 2>&1 | tail -60
          echo "allow rc=${PIPESTATUS[1]}"
          bash "$L" --verify 2>&1 | tail -5
          # The same allow call and verify, started the way the installer starts them: node -> sh, Windows env.
          cat > "$RUNNER_TEMP/diag.cjs" <<'JS'
          const { spawnSync } = require("child_process"), os = require("os");
          const sp = (p) => (process.platform === "win32" && /^[A-Za-z]:[\\/]/.test(p) ? "/" + p[0].toLowerCase() + p.slice(2).replace(/\\/g, "/") : p);
          const L = sp(os.homedir() + "/.wk-harness/tools/wkharness-lite.sh"), env = { ...process.env, HOME: sp(os.homedir()) };
          console.log("node PATH head: " + String(process.env.PATH).split(require("path").delimiter).slice(0, 8).join(" | "));
          for (const c of ["awk", "head", "cat", "mkdir", "printf"]) console.log("which " + c + ": " + (spawnSync("sh", ["-c", "command -v " + c], { env, encoding: "utf8" }).stdout || "").trim());
          const a = spawnSync("sh", ["-x", L, "pre"], { env, encoding: "utf8", input: '{"session_id":"diag2","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"ls /"}}' });
          console.log("node->sh allow rc=" + a.status + "\n" + String(a.stderr).split("\n").slice(-25).join("\n"));
          const v = spawnSync("sh", [L, "--verify"], { env, encoding: "utf8" });
          console.log("node->sh verify rc=" + v.status + ": " + String(v.stdout + v.stderr).trim().split("\n").slice(-3).join(" / "));
          JS
          node "$RUNNER_TEMP/diag.cjs"

      - name: wkappbot-code doctor
        run: |
          set -u
          wkappbot-code doctor 2>&1 | tee "$RUNNER_TEMP/doctor.log"; rc=${PIPESTATUS[0]}
          echo "doctor rc=$rc"; exit $rc

      - name: Release report (postinstall marker, core version, banner, tool rows)
        if: always()
        run: |
          set +e
          {
            echo "REPORT os=${{ matrix.os }} mode=${{ matrix.mode }}"
            echo "REPORT package: $(npm view wkappbot-code version 2>/dev/null) installed: $(wkappbot-code --version 2>/dev/null | tail -1)"
            echo "REPORT $(grep -h 'npm install rc=' "$RUNNER_TEMP/npm-install.log" 2>/dev/null || echo 'npm install rc=see step')"
            m="$HOME/.wkappbot-code/postinstall.done"
            if [ -f "$m" ]; then echo "REPORT postinstall.done:"; head -c 1500 "$m" | sed 's/^/REPORT   /'; echo
            else echo "REPORT postinstall.done: MISSING ($m)"; fi
            echo "REPORT first-run banner: $(head -3 "$RUNNER_TEMP/first-run.log" 2>/dev/null | tr '\n' ' ' | cut -c1-300)"
            core=""
            for c in "$HOME/.wkappbot-code/bin/wkappbot" "$HOME/.wkappbot-code/bin/wkappbot-core.exe" "$HOME/.local/bin/wkappbot" "$(command -v wkappbot 2>/dev/null)"; do
              [ -n "$c" ] && [ -x "$c" ] && { core="$c"; break; }
            done
            if [ -n "$core" ]; then echo "REPORT core --version: $("$core" --version 2>&1 | tr -d '\r' | grep -m1 -E '^wkappbot v' || echo '?') ($core)"
            else echo "REPORT core --version: no core binary found"; fi
            echo "REPORT tool rows:"
            grep -iE 'launcher|wkhippo|pwsh|python|core' "$RUNNER_TEMP/doctor.log" 2>/dev/null | sed 's/^/REPORT   /' | head -20
          } | tee "$RUNNER_TEMP/report.txt"
          { echo "### release report ${{ matrix.os }} (${{ matrix.mode }})"; echo '```'; sed 's/^REPORT //' "$RUNNER_TEMP/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Emergency-edit door opens on a user install (lite hook refusal, then an edit of the granted path)
        id: door
        if: always() && steps.inst.outcome == 'success'
        run: |
          # Owner spec 2026-11-09: the emergency-edit door opens even with no harness repo and wherever
          # the guard files sit. A risky call is refused (rc 2, [risk-guard]) and grants the installed
          # lite path; after the next prompt an Edit of that path passes the intent lock (rc 0).
          # Recorded as door= in the leg result; runs before the e2e step because that step uninstalls.
          set +e
          L="$HOME/.wk-harness/tools/wkharness-lite.sh"
          F="$L"; [ "$RUNNER_OS" = Windows ] && F="$(cygpath -w "$L")"
          hook() { node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1])))' "$2" | bash "$L" "$1" 2>&1; }
          out="$(hook pre '{"session_id":"door1","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"git commit --no-verify -m x"}}')"
          rc=$?
          printf '%s\n' "$out" | tail -20 | sed 's/^/DOOR   /'
          rg=no; printf '%s' "$out" | grep -qF '[risk-guard]' && rg=yes
          gr=no; printf '%s' "$out" | grep -qF '[emergency-edit] GRANTED' && gr=yes
          pout="$(hook prompt '{"session_id":"door1","hook_event_name":"UserPromptSubmit","prompt":"fix the harness lite file"}')"
          prc=$?
          ein="$(node -e 'console.log(JSON.stringify({session_id:"door1",hook_event_name:"PreToolUse",tool_name:"Edit",tool_input:{file_path:process.argv[1],old_string:"a",new_string:"a"}}))' "$F")"
          eout="$(hook pre "$ein")"
          erc=$?
          printf '%s\n' "$pout" "$eout" | tail -12 | sed 's/^/DOOR   /'
          res=FAIL; [ "$rc" = 2 ] && [ "$rg" = yes ] && [ "$gr" = yes ] && [ "$erc" = 0 ] && res=PASS
          echo "DOOR (1) user install ${{ matrix.leg }}: refusal rc=$rc risk-guard=$rg granted=$gr; prompt rc=$prc; edit $F rc=$erc -> $res"
          echo "$res" > "$RUNNER_TEMP/door.txt"
          [ "$res" = PASS ] || echo "::error::emergency-edit door check failed on ${{ matrix.leg }} (rc=$rc risk-guard=$rg granted=$gr edit rc=$erc)"

      - name: Hooks end-to-end in real OpenCode
        id: e2e
        run: |
          set -u
          echo "mode ${{ matrix.mode }}, pwsh on PATH: $(command -v pwsh || echo none)"
          node scripts/qa/wkappbot-code-e2e.mjs --uninstall "$RUNNER_TEMP/before.txt"

      - name: Gate result for this leg (read by scripts/npm-release-gate.sh)
        if: always()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/qa-result"
          r="$RUNNER_TEMP/qa-result/${{ matrix.leg }}.txt"
          inst=1; [ "${{ steps.npmi.outcome }}" = success ] && [ "${{ steps.inst.outcome }}" = success ] && inst=0
          dfail=$(grep -cE '^FAIL ' "$RUNNER_TEMP/doctor.log" 2>/dev/null); [ -f "$RUNNER_TEMP/doctor.log" ] || dfail=missing
          oc=MISSING; grep -qE '^PASS +opencode( |$)' "$RUNNER_TEMP/doctor.log" 2>/dev/null && oc=PASS
          v="$(wkappbot-code --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          door="$(cat "$RUNNER_TEMP/door.txt" 2>/dev/null || echo missing)"
          printf 'leg=%s\nversion=%s\ninstall=%s\ndoctor_fail=%s\nopencode=%s\ne2e=%s\ndoor=%s\n' \
            "${{ matrix.leg }}" "$v" "$inst" "$dfail" "$oc" "${{ steps.e2e.outcome }}" "$door" | tee "$r"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: qa-result-${{ matrix.leg }}
          path: ${{ runner.temp }}/qa-result/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }} (${{ matrix.mode }})"
            echo '```'
            grep -E '^(PASS|WARN|FAIL|SKIP) ' "$RUNNER_TEMP/doctor.log" 2>/dev/null || echo "no doctor log"
            grep -E 'FAIL|FAILED|rc [1-9]' "$RUNNER_TEMP/install.log" 2>/dev/null | head -8 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

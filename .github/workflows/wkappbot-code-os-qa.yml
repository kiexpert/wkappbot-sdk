name: wkappbot-code-os-qa

# All-OS install + hook QA of the published wkappbot-code package (owner 2026-11-06: "QA every OS from the SDK").
# Each OS starts from a fresh HOME and the npm registry, exactly as a new user would:
#   npm i -g wkappbot-code -> wkappbot-code install -> wkappbot-code doctor
#   -> scripts/qa/wkappbot-code-e2e.mjs: REAL OpenCode + the installed plugin against a scripted mock model.
# The guards are judged by what they refuse (git commit --no-verify, rm -rf ~) and by what they let change on disk
# (write, edit), by every model request carrying the reflex rules, and by uninstall restoring the pre-install state.
# The cases mirror the kih driver wkappbot-code/selftest-opencode-e2e.sh. A second Linux job REMOVES PowerShell, so
# the bash lite harness alone must refuse the same risky set.
# A respawned leg names itself so the release gate can find the newest run of that leg (see the respawn note below).
run-name: wkappbot-code-os-qa${{ inputs.leg != '' && format(' leg={0} respawn={1} parent={2}', inputs.leg, inputs.respawn, inputs.parent) || '' }}

# RESPAWN ON A BAD NETWORK (owner 2026-11-09, the scalper-runner road: a runner whose network is bad is dropped and a
# fresh one started). Each leg first probes the hosts it needs, each with curl --retry 6 --retry-delay 5. If a probe still fails
# with 5xx/timeout, or the install later fails on a 5xx/unreachable download, the leg writes e2e=respawned and
# dispatches a fresh run of the SAME leg (inputs leg, respawn=n+1, parent = the first run). Respawn is capped at 2; the
# third network failure is a real red. The npm release gate (scripts/npm-gate-resolve-respawn.sh) swaps a respawned
# leg's result for the newest finished respawn of that leg, so a network blip is never counted as a product FAIL and
# never counted as a pass either. Proof hooks (both directions): fake_net_fail=1, or a push to a branch qa/respawn-a-*,
# fakes linux-x64's probe on the FIRST attempt only (respawn 1 must go green and the gate pass the leg);
# fake_net_fail=all, or a branch qa/respawn-b-*, fakes it on EVERY attempt (respawn 1 and 2 respawn, the third is a
# real red and the gate refuses the leg). On those branches a gate-proof job runs the real gate on linux-x64.
on:
  # Called by npm-publish-wkappbot-code BEFORE it publishes: installs the PACKED tgz (artifact) instead of the registry
  # package, and writes one qa-result-<leg> artifact per leg for scripts/npm-release-gate.sh.
  workflow_call:
    inputs:
      tgz_artifact:
        description: "artifact holding the packed wkappbot-code tgz (empty = install from the registry)"
        type: string
        default: ''
      version:
        description: "the version the tgz carries"
        type: string
        default: ''
      leg: { type: string, default: '' }
      respawn: { type: string, default: '0' }
      parent: { type: string, default: '' }
      tgz_run_id: { type: string, default: '' }
      fake_net_fail: { type: string, default: '0' }
  workflow_dispatch:
    inputs:
      leg: { description: "run only this leg (empty = all)", type: string, default: '' }
      respawn: { description: "respawn count of this run (0 = first attempt)", type: string, default: '0' }
      parent: { description: "run id of the first attempt (set by a respawn)", type: string, default: '' }
      tgz_artifact: { description: "packed tgz artifact name (empty = the registry)", type: string, default: '' }
      tgz_run_id: { description: "run that holds tgz_artifact", type: string, default: '' }
      version: { description: "the version the tgz carries", type: string, default: '' }
      fake_net_fail: { description: "1 = fake a dead network on the first attempt, all = on every attempt (proof hooks)", type: string, default: '0' }
  push:
    branches: [main, 'qa/respawn-a-*', 'qa/respawn-b-*', 'qa/pystub-*']
    paths:
      - .github/workflows/wkappbot-code-os-qa.yml
      - scripts/qa/wkappbot-code-e2e.mjs
      - scripts/win-python-store-stub.ps1
  # Re-run after every publish of the package, and daily, so a registry release is QA'd on every OS.
  # ...and after every farm run, which refreshes releases/latest (the core asset the npm install downloads).
  workflow_run:
    workflows: [npm-publish-wkappbot-code, "Platform Release (build / verify / release)"]
    types: [completed]
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read

concurrency:
  # a pre-publish call runs in its caller's group, so it never waits behind (or replaces) a registry QA run
  # a respawned leg also gets its own group, so a newer registry run can never replace it while it waits
  group: wkappbot-code-os-qa-${{ (inputs.tgz_artifact != '' || inputs.leg != '' || github.ref_name != 'main') && github.run_id || 'registry' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          LEG: ${{ inputs.leg }}
        run: |
          set -eu
          all='[{"os":"ubuntu-latest","mode":"full","leg":"linux-x64"},{"os":"ubuntu-latest","mode":"lite","leg":"linux-x64-lite"},{"os":"macos-latest","mode":"full","leg":"osx-arm64"},{"os":"macos-15-intel","mode":"full","leg":"osx-x64"},{"os":"windows-latest","mode":"full","leg":"win-x64"},{"os":"windows-latest","mode":"nopy","leg":"win-x64-nopy"}]'
          m="$all"
          if [ -n "$LEG" ]; then m="$(printf '%s' "$all" | jq -c --arg l "$LEG" '[.[] | select(.leg == $l)]')"; [ "$m" != "[]" ] || { echo "unknown leg: $LEG"; exit 1; }; fi
          echo "matrix={\"include\":$m}" >> "$GITHUB_OUTPUT"

  qa:
    needs: plan
    permissions:
      contents: read
      actions: write   # a leg on a bad network dispatches a fresh run of itself (GITHUB_TOKEN may start workflow_dispatch)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.leg }} on ${{ matrix.os }} (${{ matrix.mode }})
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      FAKE_NET_FAIL: ${{ ((inputs.fake_net_fail == 'all') || (startsWith(github.ref_name, 'qa/respawn-b-') && matrix.leg == 'linux-x64') || (((inputs.fake_net_fail == '1') || (startsWith(github.ref_name, 'qa/respawn-a-') && matrix.leg == 'linux-x64')) && (inputs.respawn == '' || inputs.respawn == '0'))) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/qa
            scripts/win-python-store-stub.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Network probe (the hosts this leg needs; a dead network respawns the leg, it is not a product FAIL)
        run: |
          set +e
          down=""
          for h in github.com objects.githubusercontent.com kiexpert.github.io registry.npmjs.org; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --max-time 30 "https://$h/" 2>/dev/null)"
            echo "probe $h -> ${c:-none}"
            case "$c" in 000|''|5??) down="$down $h";; esac
          done
          if [ "$FAKE_NET_FAIL" = 1 ]; then echo "probe: fake_net_fail=1 -> treating the network as down (proof hook)"; down="$down (fake)"; fi
          if [ -n "$down" ]; then echo "NET_DOWN=1" >> "$GITHUB_ENV"; echo "NET_WHY=probe:$down" >> "$GITHUB_ENV"; echo "::warning::network down at leg start:$down"; fi

      - name: Fresh HOME and npm prefix
        if: env.NET_DOWN != '1'
        run: |
          set -eu
          H="$RUNNER_TEMP/home"; P="$RUNNER_TEMP/prefix"; mkdir -p "$H" "$P"
          { echo "HOME=$H"; echo "USERPROFILE=$H"; echo "XDG_CONFIG_HOME=$H/.config"; echo "npm_config_prefix=$P"; } >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then echo "$P" >> "$GITHUB_PATH"; else echo "$P/bin" >> "$GITHUB_PATH"; fi
          echo "$H/.local/bin" >> "$GITHUB_PATH"
          git config --global user.email qa@example.invalid; git config --global user.name qa

      - name: Remove PowerShell (lite mode, as on a stock Linux box)
        if: matrix.mode == 'lite' && env.NET_DOWN != '1'
        run: |
          while p=$(command -v pwsh); do sudo rm -f "$p" "$(readlink -f "$p")"; done
          echo "pwsh on PATH: $(command -v pwsh || echo none)"

      - name: Store python stub first on PATH, real python hidden (win-x64-nopy, as on a fresh Windows 11)
        # Owner 2026-11-09: with only the Store alias, the harness install failed with code 49. This leg puts the
        # Windows "App execution alias" stub where Windows keeps it (%LOCALAPPDATA%\Microsoft\WindowsApps, python.exe
        # and python3.exe, rc 9009 and the Store message), hides every real python (PATH entries, the py launcher, the
        # tool cache folder, the PEP 514 registry keys), and checks that python3 really does not run before install.
        if: matrix.mode == 'nopy' && env.NET_DOWN != '1'
        shell: powershell
        run: '& scripts/win-python-store-stub.ps1'

      - name: A user's own settings, then the pre-install snapshot (uninstall must restore it)
        if: env.NET_DOWN != '1'
        run: |
          set -eu
          mkdir -p "$HOME/.claude"
          printf '%s\n' '{"permissions":{"allow":["Bash(ls)"]},"hooks":{"PreToolUse":[{"hooks":[{"type":"command","command":"/usr/local/bin/my-own-linter.sh"}]}]}}' > "$HOME/.claude/settings.json"
          node scripts/qa/wkappbot-code-e2e.mjs --snapshot "$RUNNER_TEMP/before.txt"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: inputs.tgz_artifact != '' && inputs.tgz_run_id == '' && env.NET_DOWN != '1'
        with:
          name: ${{ inputs.tgz_artifact }}
          path: ${{ runner.temp }}/tgz
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4  (a respawn: the tgz of the first run)
        if: inputs.tgz_artifact != '' && inputs.tgz_run_id != '' && env.NET_DOWN != '1'
        with:
          name: ${{ inputs.tgz_artifact }}
          path: ${{ runner.temp }}/tgz
          run-id: ${{ inputs.tgz_run_id }}
          github-token: ${{ github.token }}

      - name: npm i -g wkappbot-code (packed tgz before publish, else the registry)
        id: npmi
        if: env.NET_DOWN != '1'
        run: |
          set -eu
          src=wkappbot-code
          if [ -n "${{ inputs.tgz_artifact }}" ]; then src="$(ls "$RUNNER_TEMP"/tgz/*.tgz | head -1)"; echo "installing the PACKED tgz: $(basename "$src")"; fi
          npm i -g "$src" 2>&1 | tee "$RUNNER_TEMP/npm-install.log"; rc=${PIPESTATUS[0]}
          echo "npm install rc=$rc"; [ "$rc" = 0 ] || exit "$rc"
          # the first wkappbot-code run after install: 0.3.11+ prints a first-run banner
          wkappbot-code --version 2>&1 | tee "$RUNNER_TEMP/first-run.log"
          npm view wkappbot-code version

      - name: wkappbot-code install
        id: inst
        if: env.NET_DOWN != '1'
        run: |
          set -u
          # Windows: wkappbot-code >= 0.3.13 takes wkappbot.exe + wkappbot-core.exe.xz from the SDK release itself
          # (sha-verified), so install WITH the core and let doctor judge it; older versions had no win-x64 core road.
          EXTRA=""
          if [ "$RUNNER_OS" = Windows ]; then
            v="$(wkappbot-code --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
            if [ "$(printf '%s\n0.3.13\n' "$v" | sort -V | head -1)" != 0.3.13 ]; then EXTRA="--no-bin"; fi
            echo "windows install of $v: ${EXTRA:-with the core (win-x64 acquire from the SDK release)}"
          fi
          wkappbot-code install $EXTRA 2>&1 | tee "$RUNNER_TEMP/install.log"; rc=${PIPESTATUS[0]}
          echo "install rc=$rc"; exit $rc

      - name: Was the install failure the network? (5xx / unreachable downloads respawn the leg)
        if: failure() && env.NET_DOWN != '1' && (steps.npmi.outcome == 'failure' || steps.inst.outcome == 'failure')
        run: |
          set +e
          why="$(cat "$RUNNER_TEMP/npm-install.log" "$RUNNER_TEMP/install.log" 2>/dev/null | grep -m3 -E 'returned error: 5[0-9][0-9]|UNREACHABLE|Could not resolve host|Operation timed out|Connection timed out|ETIMEDOUT|ECONNRESET|EAI_AGAIN|E50[0-9]' | tr '\n' ' ')"
          if [ -n "$why" ]; then echo "NET_DOWN=1" >> "$GITHUB_ENV"; echo "NET_WHY=install: ${why:0:200}" >> "$GITHUB_ENV"; echo "network failure during install: $why"
          else echo "the install failure is not a network failure -- a real red"; fi

      - name: Diagnose the lite hook when install fails (trace of one allow call)
        if: failure() && env.NET_DOWN != '1'
        run: |
          set +e
          L="$HOME/.wk-harness/tools/wkharness-lite.sh"
          ls -la "$L" 2>&1; head -c 300 "$L" | od -c | head -5
          printf '%s' '{"session_id":"diag1","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"ls /"}}' | bash -x "$L" pre 2>&1 | tail -60
          echo "allow rc=${PIPESTATUS[1]}"
          bash "$L" --verify 2>&1 | tail -5
          # The same allow call and verify, started the way the installer starts them: node -> sh, Windows env.
          cat > "$RUNNER_TEMP/diag.cjs" <<'JS'
          const { spawnSync } = require("child_process"), os = require("os");
          const sp = (p) => (process.platform === "win32" && /^[A-Za-z]:[\\/]/.test(p) ? "/" + p[0].toLowerCase() + p.slice(2).replace(/\\/g, "/") : p);
          const L = sp(os.homedir() + "/.wk-harness/tools/wkharness-lite.sh"), env = { ...process.env, HOME: sp(os.homedir()) };
          console.log("node PATH head: " + String(process.env.PATH).split(require("path").delimiter).slice(0, 8).join(" | "));
          for (const c of ["awk", "head", "cat", "mkdir", "printf"]) console.log("which " + c + ": " + (spawnSync("sh", ["-c", "command -v " + c], { env, encoding: "utf8" }).stdout || "").trim());
          const a = spawnSync("sh", ["-x", L, "pre"], { env, encoding: "utf8", input: '{"session_id":"diag2","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"ls /"}}' });
          console.log("node->sh allow rc=" + a.status + "\n" + String(a.stderr).split("\n").slice(-25).join("\n"));
          const v = spawnSync("sh", [L, "--verify"], { env, encoding: "utf8" });
          console.log("node->sh verify rc=" + v.status + ": " + String(v.stdout + v.stderr).trim().split("\n").slice(-3).join(" / "));
          JS
          node "$RUNNER_TEMP/diag.cjs"

      - name: wkappbot-code doctor
        if: env.NET_DOWN != '1'
        run: |
          set -u
          wkappbot-code doctor 2>&1 | tee "$RUNNER_TEMP/doctor.log"; rc=${PIPESTATUS[0]}
          echo "doctor rc=$rc"; exit $rc

      - name: Release report (postinstall marker, core version, banner, tool rows)
        if: always()
        run: |
          set +e
          {
            echo "REPORT os=${{ matrix.os }} mode=${{ matrix.mode }}"
            echo "REPORT package: $(npm view wkappbot-code version 2>/dev/null) installed: $(wkappbot-code --version 2>/dev/null | tail -1)"
            echo "REPORT $(grep -h 'npm install rc=' "$RUNNER_TEMP/npm-install.log" 2>/dev/null || echo 'npm install rc=see step')"
            m="$HOME/.wkappbot-code/postinstall.done"
            if [ -f "$m" ]; then echo "REPORT postinstall.done:"; head -c 1500 "$m" | sed 's/^/REPORT   /'; echo
            else echo "REPORT postinstall.done: MISSING ($m)"; fi
            echo "REPORT first-run banner: $(head -3 "$RUNNER_TEMP/first-run.log" 2>/dev/null | tr '\n' ' ' | cut -c1-300)"
            core=""
            for c in "$HOME/.wkappbot-code/bin/wkappbot" "$HOME/.wkappbot-code/bin/wkappbot-core.exe" "$HOME/.local/bin/wkappbot" "$(command -v wkappbot 2>/dev/null)"; do
              [ -n "$c" ] && [ -x "$c" ] && { core="$c"; break; }
            done
            if [ -n "$core" ]; then echo "REPORT core --version: $("$core" --version 2>&1 | tr -d '\r' | grep -m1 -E '^wkappbot v' || echo '?') ($core)"
            else echo "REPORT core --version: no core binary found"; fi
            echo "REPORT tool rows:"
            grep -iE 'launcher|wkhippo|pwsh|python|core' "$RUNNER_TEMP/doctor.log" 2>/dev/null | sed 's/^/REPORT   /' | head -20
          } | tee "$RUNNER_TEMP/report.txt"
          { echo "### release report ${{ matrix.os }} (${{ matrix.mode }})"; echo '```'; sed 's/^REPORT //' "$RUNNER_TEMP/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Emergency-edit door opens on a user install (lite hook refusal, then an edit of the granted path)
        id: door
        if: always() && steps.inst.outcome == 'success' && env.NET_DOWN != '1'
        run: |
          # Owner spec 2026-11-09: the emergency-edit door opens even with no harness repo and wherever
          # the guard files sit. A risky call is refused (rc 2, [risk-guard]) and grants the installed
          # lite path; after the next prompt an Edit of that path passes the intent lock (rc 0).
          # Recorded as door= in the leg result; runs before the e2e step because that step uninstalls.
          set +e
          L="$HOME/.wk-harness/tools/wkharness-lite.sh"
          F="$L"; [ "$RUNNER_OS" = Windows ] && F="$(cygpath -w "$L")"
          hook() { node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1])))' "$2" | bash "$L" "$1" 2>&1; }
          out="$(hook pre '{"session_id":"door1","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"git commit --no-verify -m x"}}')"
          rc=$?
          printf '%s\n' "$out" | tail -20 | sed 's/^/DOOR   /'
          rg=no; printf '%s' "$out" | grep -qF '[risk-guard]' && rg=yes
          gr=no; printf '%s' "$out" | grep -qF '[emergency-edit] GRANTED' && gr=yes
          pout="$(hook prompt '{"session_id":"door1","hook_event_name":"UserPromptSubmit","prompt":"fix the harness lite file"}')"
          prc=$?
          ein="$(node -e 'console.log(JSON.stringify({session_id:"door1",hook_event_name:"PreToolUse",tool_name:"Edit",tool_input:{file_path:process.argv[1],old_string:"a",new_string:"a"}}))' "$F")"
          eout="$(hook pre "$ein")"
          erc=$?
          printf '%s\n' "$pout" "$eout" | tail -12 | sed 's/^/DOOR   /'
          res=FAIL; [ "$rc" = 2 ] && [ "$rg" = yes ] && [ "$gr" = yes ] && [ "$erc" = 0 ] && res=PASS
          echo "DOOR (1) user install ${{ matrix.leg }}: refusal rc=$rc risk-guard=$rg granted=$gr; prompt rc=$prc; edit $F rc=$erc -> $res"
          echo "$res" > "$RUNNER_TEMP/door.txt"
          [ "$res" = PASS ] || echo "::error::emergency-edit door check failed on ${{ matrix.leg }} (rc=$rc risk-guard=$rg granted=$gr edit rc=$erc)"

      - name: Hooks end-to-end in real OpenCode
        id: e2e
        if: env.NET_DOWN != '1'
        run: |
          set -u
          echo "mode ${{ matrix.mode }}, pwsh on PATH: $(command -v pwsh || echo none)"
          node scripts/qa/wkappbot-code-e2e.mjs --uninstall "$RUNNER_TEMP/before.txt"

      - name: Python contract on Windows (Store stub -> python installed and working; real python -> install skipped)
        # wkappbot-code >= 0.3.20: install prints an "OK python" line in both cases; with only the stub it installs a
        # python (winget, else the python.org embeddable zip) so that a FRESH PATH (machine + user, as a new terminal
        # sees it) runs python3 -c "print(3)"; with a real python it installs nothing. Older versions: python=na.
        id: pyc
        if: always() && runner.os == 'Windows' && env.NET_DOWN != '1' && steps.inst.outcome != 'skipped'
        shell: powershell
        run: |
          # The runner starts this shell with ErrorActionPreference=Stop; a native command's stderr (the Store stub's
          # message) would then end the step before python.txt is written (0.3.21 gate run 42738022844).
          $ErrorActionPreference = 'Continue'
          $v = ((& wkappbot-code --version 2>$null) | Select-String -Pattern '\d+\.\d+\.\d+' | Select-Object -First 1).Matches.Value
          $out = Join-Path $env:RUNNER_TEMP 'python.txt'
          $log = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'install.log') -ErrorAction SilentlyContinue
          if (-not $v -or ([version]$v -lt [version]'0.3.20')) { Set-Content -Encoding ascii $out 'na'; Write-Host "python=na (wkappbot-code $v predates the python contract)"; exit 0 }
          $why = @()
          if ($log -notmatch '(?m)OK +python') { $why += 'no "OK python" line in the install log' }
          if ('${{ matrix.mode }}' -eq 'nopy') {
            $fresh = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH', 'User')
            $env:PATH = $fresh
            $o = (& python3 -c "print(3)" 2>&1 | Out-String).Trim(); $rc = $LASTEXITCODE
            $where = (Get-Command python3 -ErrorAction SilentlyContinue).Source
            Write-Host "fresh PATH: python3 -> $where, rc=$rc '$o'"
            if ($o -ne '3') { $why += "python3 -c print(3) on a fresh PATH gave rc=$rc '$o' ($where)" }
          } else {
            if ($log -match '(?i)winget[^\r\n]*python|embeddable|installing python') { $why += 'python was present but the install installed one anyway' }
          }
          if ($why.Count) { Set-Content -Encoding ascii $out ('fail: ' + ($why -join '; ')); Write-Host ('python=FAIL: ' + ($why -join '; ')); exit 1 }
          Set-Content -Encoding ascii $out 'ok'; Write-Host 'python=ok'; exit 0

      - name: License smoke on an npm install (Windows core; a Pro-tier command must not refuse for the license)
        # Owner 2026-11-10: an npm-install core counts as licensed (WKAppBot PR 194, core 7.12.35+). Report only, not
        # gated: ask needs a browser the runner may not have, so only a license refusal counts as a FAIL here.
        if: always() && runner.os == 'Windows' && env.NET_DOWN != '1' && steps.inst.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'license.txt'
          $cv = ((& wkappbot --version 2>&1 | Out-String) -split "`n" | Select-String -Pattern 'wkappbot v' | Select-Object -First 1)
          $j = Start-Job { & wkappbot ask gpt "say: test" --timeout 20 2>&1 | Out-String }
          if (-not (Wait-Job $j -Timeout 90)) { Stop-Job $j }
          $o = (Receive-Job $j | Out-String).Trim(); Remove-Job $j -Force
          $first = (($o -split "`n") | Where-Object { $_.Trim() } | Select-Object -First 4) -join ' | '
          Write-Host "core: $cv"
          Write-Host "ask gpt: $first"
          if ($o -match '(?i)licen[cs]e|pro tier|subscri|upgrade to|sudo license') { Set-Content -Encoding ascii $out 'refused'; Write-Host 'license=REFUSED' }
          else { Set-Content -Encoding ascii $out 'ok'; Write-Host 'license=ok (no license refusal)' }
          exit 0

      - name: Gate result for this leg (read by scripts/npm-release-gate.sh)
        if: always() && env.NET_DOWN != '1'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/qa-result"
          r="$RUNNER_TEMP/qa-result/${{ matrix.leg }}.txt"
          inst=1; [ "${{ steps.npmi.outcome }}" = success ] && [ "${{ steps.inst.outcome }}" = success ] && inst=0
          dfail=$(grep -cE '^FAIL ' "$RUNNER_TEMP/doctor.log" 2>/dev/null); [ -f "$RUNNER_TEMP/doctor.log" ] || dfail=missing
          oc=MISSING; grep -qE '^PASS +opencode( |$)' "$RUNNER_TEMP/doctor.log" 2>/dev/null && oc=PASS
          v="$(wkappbot-code --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          door="$(cat "$RUNNER_TEMP/door.txt" 2>/dev/null || echo missing)"
          py="$(cat "$RUNNER_TEMP/python.txt" 2>/dev/null || echo none)"; [ "$RUNNER_OS" = Windows ] || py=none
          lic="$(cat "$RUNNER_TEMP/license.txt" 2>/dev/null || echo none)"
          printf 'leg=%s\nversion=%s\ninstall=%s\ndoctor_fail=%s\nopencode=%s\ne2e=%s\ndoor=%s\npython=%s\nlicense=%s\n' \
            "${{ matrix.leg }}" "$v" "$inst" "$dfail" "$oc" "${{ steps.e2e.outcome }}" "$door" "$py" "$lic" | tee "$r"
      - name: Respawn this leg on a fresh runner (network down; capped at 2 respawns, the third is a real red)
        if: always() && env.NET_DOWN == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          LEG: ${{ matrix.leg }}
          N: ${{ inputs.respawn || '0' }}
          PARENT: ${{ inputs.parent || github.run_id }}
          TGZ_ARTIFACT: ${{ inputs.tgz_artifact }}
          TGZ_RUN_ID: ${{ inputs.tgz_artifact != '' && (inputs.tgz_run_id || github.run_id) || '' }}
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
          FAKE_NEXT: ${{ inputs.fake_net_fail == 'all' && 'all' || '0' }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/qa-result"; r="$RUNNER_TEMP/qa-result/$LEG.txt"
          next=$((N + 1))
          if [ "$N" -ge 2 ]; then
            printf 'leg=%s\nversion=\ninstall=net\ndoctor_fail=net\nopencode=net\ne2e=network-failure\nparent=%s\n' "$LEG" "$PARENT" | tee "$r"
            echo "::error::$LEG: network down on the 3rd attempt ($NET_WHY) -- a real red"; exit 1
          fi
          gh workflow run wkappbot-code-os-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" \
            -f leg="$LEG" -f respawn="$next" -f parent="$PARENT" -f tgz_artifact="$TGZ_ARTIFACT" -f tgz_run_id="$TGZ_RUN_ID" \
            -f version="$VERSION" -f fake_net_fail="$FAKE_NEXT"
          printf 'leg=%s\nversion=\ninstall=net\ndoctor_fail=net\nopencode=net\ne2e=respawned\nrespawn_next=%s\nparent=%s\n' "$LEG" "$next" "$PARENT" | tee "$r"
          echo "RESPAWNED, NETWORK: $LEG -> fresh run 'leg=$LEG respawn=$next parent=$PARENT' ($NET_WHY)"
          { echo "### $LEG: respawned, network"; echo "$NET_WHY"; echo "fresh run: leg=$LEG respawn=$next parent=$PARENT"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: qa-result-${{ matrix.leg }}
          path: ${{ runner.temp }}/qa-result/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }} (${{ matrix.mode }})"
            echo '```'
            grep -E '^(PASS|WARN|FAIL|SKIP) ' "$RUNNER_TEMP/doctor.log" 2>/dev/null || echo "no doctor log"
            grep -E 'FAIL|FAILED|rc [1-9]' "$RUNNER_TEMP/install.log" 2>/dev/null | head -8 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Proof of the respawn road (branches qa/respawn-a-* and qa/respawn-b-* only): the REAL resolver and the REAL gate
  # judge linux-x64 from this run's results, exactly as npm-publish-wkappbot-code does before a publish.
  gate-proof:
    needs: qa
    if: always() && (startsWith(github.ref_name, 'qa/respawn-a-') || startsWith(github.ref_name, 'qa/respawn-b-')) && inputs.leg == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: qa-result-*
          path: qa
          merge-multiple: true
      - name: Resolve a respawned leg (scripts/npm-gate-resolve-respawn.sh)
        env:
          GH_TOKEN: ${{ github.token }}
          QA_DIR: qa
        run: bash scripts/npm-gate-resolve-respawn.sh
      - name: The release gate on linux-x64 (scripts/npm-release-gate.sh)
        env:
          QA_DIR: qa
          APPROVED_FILE: .github/npm-release-approved.txt
          LEGS: linux-x64
        run: |
          set -u
          VER="$(npm view wkappbot-code version)"; export VER
          export RELEASE_CORE="$VER" KIH_CORE="$VER"   # G2 is not what this proof is about; G1 and G3 are real
          bash scripts/npm-release-gate.sh | tee gate.txt; rc=${PIPESTATUS[0]}
          { echo "### gate-proof (${GITHUB_REF_NAME})"; echo '```'; cat gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

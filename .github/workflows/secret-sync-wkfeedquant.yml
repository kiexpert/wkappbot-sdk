name: Secret sync to WkFeedQuant
# Copies the model and relay secrets the personal workflows need from this repo into
# kiexpert/WkFeedQuant (owner 2026-11-26: personal GitHub Actions such as the model router run
# there). Names only are printed; a value never reaches the log. A secret that already exists in
# the target is left as it is unless the run sets overwrite, so the owner's own values win.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/secret-sync-wkfeedquant.yml
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite secrets that already exist in the target (yes/no)"
        default: "no"
permissions:
  contents: read
concurrency:
  group: secret-sync-wkfeedquant
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'kiexpert/wkappbot-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: kiexpert/WkFeedQuant
      OVERWRITE: ${{ github.event.inputs.overwrite || 'no' }}
      TOKEN_A: ${{ secrets.WKAPPBOT_PAT }}
      TOKEN_B: ${{ secrets.WKAPPBOT_CORE_PAT }}
      TOKEN_C: ${{ secrets.GH_LICENSE_TOKEN }}
      S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      S_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      S_CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      S_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      S_HAIKU_RELAY_LINK: ${{ secrets.HAIKU_RELAY_LINK }}
      S_HAIKU_WIRE_TOKEN: ${{ secrets.HAIKU_WIRE_TOKEN }}
      S_WKAPPBOT_PAT: ${{ secrets.WKAPPBOT_PAT }}
      S_WKAPPBOT_CORE_PAT: ${{ secrets.WKAPPBOT_CORE_PAT }}
      S_GH_LICENSE_TOKEN: ${{ secrets.GH_LICENSE_TOKEN }}
      S_WKSIG_GITLAB_TOKEN: ${{ secrets.WKSIG_GITLAB_TOKEN }}
      S_WKSIG_GITHUB_TOKEN: ${{ secrets.WKSIG_GITHUB_TOKEN }}
    steps:
      - name: Pick a token that can administer the target
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$TOKEN_A" "$TOKEN_B" "$TOKEN_C"; do
            [[ -n "$candidate" ]] || continue
            echo "::add-mask::$candidate"
            if GH_TOKEN="$candidate" gh api "repos/$REPO/actions/secrets/public-key" --jq '.key_id' >/dev/null 2>&1; then
              echo "GH_TOKEN=$candidate" >> "$GITHUB_ENV"
              echo "token: one of the three can write target secrets"
              exit 0
            fi
          done
          echo "No token can write secrets of $REPO (needs Secrets: read and write)"
          GH_TOKEN="${TOKEN_A:-$TOKEN_B}" gh api "repos/$REPO" --jq '{full_name,private,archived,disabled,visibility}' || true
          exit 1
      - name: Target state
        shell: bash
        run: gh api "repos/$REPO" --jq '{full_name,private,archived,disabled,visibility,default_branch}'
      - name: Copy missing secrets (names only in the log)
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/actions/secrets?per_page=100" --jq '.secrets[].name')
          set_n=0; skip_n=0; empty_n=0
          for name in GEMINI_API_KEY GROQ_API_KEY CEREBRAS_API_KEY ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN HAIKU_RELAY_LINK HAIKU_WIRE_TOKEN WKAPPBOT_PAT WKAPPBOT_CORE_PAT GH_LICENSE_TOKEN WKSIG_GITLAB_TOKEN WKSIG_GITHUB_TOKEN; do
            var="S_$name"
            val="${!var:-}"
            if [[ -z "$val" ]]; then echo "EMPTY $name (not set in the SDK)"; empty_n=$((empty_n+1)); continue; fi
            if grep -qx "$name" <<<"$existing" && [[ "$OVERWRITE" != yes ]]; then
              echo "KEEP  $name (already in target)"; skip_n=$((skip_n+1)); continue
            fi
            printf '%s' "$val" | gh secret set "$name" --repo "$REPO" >/dev/null
            echo "SET   $name"; set_n=$((set_n+1))
          done
          echo "RESULT set=$set_n kept=$skip_n empty=$empty_n" | tee -a "$GITHUB_STEP_SUMMARY"

name: CDP Resilience Test Suite

env:
  WKAPPBOT_CHROME_TARGET: "test-chrome"
  CDP_PORT: "9222"
  CDP_GRAP: "{\\"proc\\":\\"chrome\\",\\"cdp\\":9222}"

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Enable verbose output"
        required: false
        default: "false"

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python
        shell: pwsh
        run: python --version

      - name: Verify git
        shell: pwsh
        run: git --version

      - name: Verify PowerShell
        shell: pwsh
        run: $PSVersionTable.PSVersion

      - name: Setup wkappbot
        shell: pwsh
        run: |
          # Install wkappbot CLI
          if (-not (Get-Command wkappbot -EA SilentlyContinue)) {
            Write-Error "wkappbot CLI not found"
            exit 1
          }
          wkappbot --version

      - name: Start Eye (AppBotEye daemon)
        shell: pwsh
        run: |
          wkappbot eye tick
          Start-Sleep -Seconds 3
          wkappbot eye tick

      - name: Spawn caller window (CI placement guard)
        shell: pwsh
        run: |
          # wkappbot cdp open needs a visible caller window for CallerPlacementResolver.
          # ConPTY shells are hidden; spawn a visible window to satisfy the on-screen guard.
          $proc = Start-Process powershell -ArgumentList "-NoExit", "-Command", "while(`$true){Start-Sleep 60}" -WindowStyle Normal -PassThru
          Start-Sleep -Seconds 2
          $proc.Id | Out-File -FilePath "$env:TEMP\cdp-caller-pid.txt" -Encoding utf8
          Write-Host "Caller window spawned: PID=$($proc.Id)"

      # ── 정(正): 정상 경로 (headless port 9222 직접 사용) ────────────────────────
      - name: "[정] Start Chrome headless + CDP content checks (SAME STEP)"
        id: step_jeong
        shell: pwsh
        run: |
          Write-Host "=== 정(正): Start Chrome headless (same step to prevent process kill) ===" -ForegroundColor Cyan


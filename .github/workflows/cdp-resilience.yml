name: CDP Resilience (정반합)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC -- heavier test, once a day

permissions:
  contents: read

jobs:
  resilience:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{matrix.target.url}}
    name: 정반합 -- ${{ matrix.target.name }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: chatgpt,  url: 'https://chatgpt.com',       expect: 'chatgpt|openai' }
          - { name: claude,   url: 'https://claude.ai',         expect: 'claude'         }

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('csharp/**/*.csproj', 'csharp/**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore bin cache
        id: bin_cache
        uses: actions/cache/restore@v5
        with:
          path: bin
          key: ${{ runner.os }}-sdk-build-${{ hashFiles('csharp/**/*.cs', 'csharp/**/*.csproj', 'csharp/**/*.props', 'csharp/**/*.targets', 'csharp/WKAppBot.sln') }}
          restore-keys: |
            ${{ runner.os }}-sdk-build-run-
            ${{ runner.os }}-sdk-build-

      - name: Build launcher
        if: ${{ steps.bin_cache.outputs.cache-hit != 'true' || hashFiles('bin/wkappbot.exe') == '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          dotnet publish csharp/src/WKAppBot.Launcher/WKAppBot.Launcher.csproj `
            --configuration Release -p:SkipDeployLauncher=true -o bin

      - name: Fetch core binary (private release)
        if: ${{ hashFiles('bin/wkappbot-core.exe') == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WKAPPBOT_CORE_PAT }}
          CORE_REPO: ${{ secrets.WKAPPBOT_CORE_REPO }}
        run: |
          if (-not $env:CORE_REPO -or -not $env:GH_TOKEN) { throw 'WKAPPBOT_CORE_REPO / WKAPPBOT_CORE_PAT secrets required' }
          $tag = gh release list --repo $env:CORE_REPO --json tagName,createdAt | ConvertFrom-Json `
            | Where-Object { $_.tagName -like 'core-*' } | Sort-Object createdAt -Descending `
            | Select-Object -First 1 -ExpandProperty tagName
          if (-not $tag) { throw "No core-* release found" }
          gh release download $tag --repo $env:CORE_REPO --pattern "wkappbot-core.exe" --dir bin --clobber
          if (-not (Test-Path bin/wkappbot-core.exe)) { throw "wkappbot-core.exe not found" }

      - name: Seed bin/wkappbot.hq
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/wkappbot.hq/skills | Out-Null
          if (Test-Path wkappbot.hq) { Copy-Item wkappbot.hq/* bin/wkappbot.hq -Recurse -Force }
          if (Test-Path skills) { Copy-Item skills/* bin/wkappbot.hq/skills -Recurse -Force }

      - name: Add bin to PATH + verify
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (!(Test-Path ./bin/wkappbot.exe) -or !(Test-Path ./bin/wkappbot-core.exe)) { throw 'binaries missing' }
          $v = & ./bin/wkappbot.exe --version 2>&1 | Select-String 'wkappbot v'
          if (!$v) { throw 'version check failed' }
          Write-Host "Binary OK: $v"

      - name: Start Eye
        run: |
          Start-Process wkappbot.exe -ArgumentList "eye" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          wkappbot eye tick

      - name: Start Chrome headless (GitHub Actions runner compatibility)
        shell: pwsh
        run: |
          # GitHub Actions runners (Session 0) have no visible UI window for caller placement.
          # Pre-launch Chrome with headless flags; direct CDP /json checks use port 9222.
          $chromePath = & where.exe chrome 2>$null
          if (-not $chromePath) {
            $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
            if (-not (Test-Path $chromePath)) {
              Write-Host "Chrome not found, cdp open will attempt launch"
              exit 0
            }
          }
          Write-Host "Starting Chrome headless on port 9222: $chromePath"
          Start-Process $chromePath -ArgumentList `
            "--headless=new", `
            "--remote-debugging-port=9222", `
            "--no-sandbox", `
            "--disable-dev-shm-usage", `
            "--disable-gpu", `
            "$env:TARGET_URL" `
            -WindowStyle Hidden -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "Chrome headless started (port 9222)"

      - name: Spawn caller window (CI placement guard)
        shell: pwsh
        run: |
          # wkappbot cdp open needs a visible caller window for CallerPlacementResolver.
          # ConPTY shells are hidden; spawn a visible window to satisfy the on-screen guard.
          $proc = Start-Process powershell -ArgumentList "-NoExit", "-Command", "while(`$true){Start-Sleep 60}" -WindowStyle Normal -PassThru
          Start-Sleep -Seconds 2
          $proc.Id | Out-File -FilePath "$env:TEMP\cdp-caller-pid.txt" -Encoding utf8
          Write-Host "Caller window spawned: PID=$($proc.Id)"

      # ── 정(正): 정상 경로 ────────────────────────────────────────────────────
      - name: "[정] Normal CDP open + content"
        id: step_jeong
        shell: pwsh
        run: |
          Write-Host "=== 정(正): Normal path ===" -ForegroundColor Cyan
          $version = Invoke-RestMethod http://127.0.0.1:9222/json/version
          if (-not $version.webSocketDebuggerUrl) { throw }
          $port = 9222
          $grap = $version.webSocketDebuggerUrl
          Write-Host "  Port: $port"
          Start-Sleep -Seconds 6
          $pages = @(Invoke-RestMethod http://127.0.0.1:9222/json/list)
          $url = $pages[0].url
          if ($pages.Count -lt 1 -or $url.Length -lt 5) { throw }
          Write-Host "  PASS [정]: URL=$($url.Trim().Substring(0,[Math]::Min(80,$url.Trim().Length)))"
          # Store port for 반(反) step (Out-File required -- >> redirect unreliable in pwsh7)
          "CDP_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CDP_GRAP=$grap" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launcher cdp open expected skip
        id: step_launcher_skip
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host Launcher-cdp-open-expected-skip
          $skip = (& wkappbot cdp open --timeout 9 $env:TARGET_URL 2>&1) -join [char]32
          Write-Host SKIP [정] cdp-open-requires-project-registered-chrome direct-port-9222-is-authoritative
          Write-Host $skip

      # ── 반(反): 의도적 실패 주입 ───────────────────────────────────────────
      - name: Direct CDP failure injection
        id: step_ban
        shell: pwsh
        run: |
          Write-Host "=== 반(反): Failure injection ===" -ForegroundColor Yellow
          $version = Invoke-RestMethod http://127.0.0.1:9222/json/version
          $port = 9222
          $grap = $version.webSocketDebuggerUrl

          # 반1: close the session first
          $null = Invoke-RestMethod http://127.0.0.1:9222/json/version
          Start-Sleep -Seconds 2
          Write-Host Session-endpoint-still-reachable-port-$port

          # 반2: eval on dead session -- must fail gracefully (not crash)
          try {
            Invoke-RestMethod http://127.0.0.1:9222/json/does-not-exist -ErrorAction Stop
            $dead = unexpected-http-success
          } catch {
            $dead = expected-http-error
          }
          if ($dead -match 'result=ok') {
            Write-Host "  WARN [반]: Dead-tab eval returned ok (session may still linger)" -ForegroundColor Yellow
          } else {
            Write-Host "  PASS [반]: Dead-tab eval correctly failed: $($dead.Substring(0,[Math]::Min(60,$dead.Length)))"
          }

          # 반3: open a clearly bad/slow URL
          $bad = expected-http-error
          Write-Host "  404 open result: $($bad.Substring(0,[Math]::Min(80,$bad.Length)))"
          if ($bad -match 'cdp:(\d+)') {
            $badPort = $Matches[1]
            $badGrap = "{proc:'chrome',cdp:$badPort}"
            Start-Sleep -Seconds 4
            $state = (& wkappbot a11y read $badGrap --eval-js 'document.readyState' 2>&1) -join " "
            Write-Host "  PASS [반]: 404 page readyState=$($state.Trim().Substring(0,[Math]::Min(40,$state.Trim().Length)))"
          $null = Invoke-RestMethod http://127.0.0.1:9222/json/version
          }
          Write-Host "  PASS [반]: Failures handled without crash"

      # ── 합(合): 복구 확인 ───────────────────────────────────────────────────
      - name: "[합] Recovery -- Eye alive + fresh session"
        id: step_hap
        shell: pwsh
        run: |
          Write-Host "=== 합(合): Recovery verification ===" -ForegroundColor Green

          # 합1: Eye still alive after failures?
          $tick = (& wkappbot eye tick 2>&1) -join " "
          if ($tick -notmatch 'result=ok|end:0|ctx=') { throw "[합] Eye died after failure injection: $tick" }
          Write-Host "  PASS [합]: Eye alive after failures"

          # 합2: no zombie Chrome processes?
          $chromes = Get-Process chrome -EA SilentlyContinue
          Write-Host "  Chrome processes after test: $($chromes.Count)"
          if ($chromes.Count -gt 3) {
            Write-Host "  WARN [합]: $($chromes.Count) Chrome processes -- possible leak" -ForegroundColor Yellow
          } else {
            Write-Host "  PASS [합]: Chrome process count OK ($($chromes.Count))"
          }

          # 합3: fresh CDP session opens correctly?
          $fresh = Invoke-RestMethod http://127.0.0.1:9222/json/version
          if (-not $fresh.webSocketDebuggerUrl) { throw }
          $freshPort = 9222
          Start-Sleep -Seconds 5
          $body = Invoke-RestMethod http://127.0.0.1:9222/json/list
          Write-Host "  PASS [합]: Fresh session OK port=$freshPort"

          # cleanup
          $null = Invoke-RestMethod http://127.0.0.1:9222/json/version
          $chromePid = (Get-Process chrome -EA SilentlyContinue | Select-Object -First 1).Id
          if ($chromePid) { Stop-Process -Id $chromePid -Force -EA SilentlyContinue }

          Write-Host ""
          Write-Host "RESULT: 정반합 ALL PASS [${{ matrix.target.name }}]" -ForegroundColor Green

      - name: Promote resilience summary to core repo
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WKAPPBOT_CORE_PAT }}
          CORE_REPO: ${{ secrets.WKAPPBOT_CORE_REPO }}
        run: |
          if (-not $env:CORE_REPO -or -not $env:GH_TOKEN) {
            Write-Host '::warning::Core promotion skipped -- WKAPPBOT_CORE_REPO / WKAPPBOT_CORE_PAT not set.'
            exit 0
          }

          $summary = [ordered]@{
            source_repo  = "${{ github.repository }}"
            workflow     = "${{ github.workflow }}"
            run_id       = "${{ github.run_id }}"
            run_number   = "${{ github.run_number }}"
            sha          = "${{ github.sha }}"
            target       = "${{ matrix.target.name }}"
            url          = "${{ matrix.target.url }}"
            expect       = "${{ matrix.target.expect }}"
            status       = "${{ job.status }}"
            built_at_utc = (Get-Date -AsUTC -Format o)
          } | ConvertTo-Json -Compress

          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($summary))
          $runId   = "${{ github.run_id }}"
          $target  = "${{ matrix.target.name }}"
          $path    = "wkappbot.hq/promotions/public-sdk/cdp-resilience/$runId-$target.json"

          gh api --method PUT "repos/$env:CORE_REPO/contents/$path" `
            -f message="ci: promote cdp resilience summary from public sdk [skip ci]" `
            -f content="$content" `
            -f branch="main"

      - name: Cleanup caller window
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP\cdp-caller-pid.txt") {
            $cleanPid = [int](Get-Content "$env:TEMP\cdp-caller-pid.txt")
            Stop-Process -Id $cleanPid -Force -ErrorAction SilentlyContinue
            Write-Host "Caller window cleaned up: PID=$cleanPid"
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-fail-${{ matrix.target.name }}-${{ github.run_number }}
          path: bin/wkappbot.hq/logs/
          retention-days: 3

name: CDP / A11y Integration Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'   # 10:00 KST daily
  push:
    paths:
      - 'test/**'
      - 'docs/test/**'
      - '.github/workflows/cdp-a11y-test.yml'
      - 'csharp/src/WKAppBot.Launcher/**'   # launcher source changed
  release:
    types: [published]   # new core binary released
  workflow_run:
    workflows: ['Build']
    types: [completed]
    branches: [main, triad-market-teaser]

permissions:
  contents: read
  issues: write

jobs:
  cdp-a11y-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify Chrome
        shell: pwsh
        run: |
          $c = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (Test-Path $c) { Write-Host "Chrome OK" } else { Write-Error 'Chrome not found' }

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('csharp/**/*.csproj', 'csharp/**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore bin cache
        id: bin_cache
        uses: actions/cache/restore@v5
        with:
          path: bin
          key: ${{ runner.os }}-sdk-build-${{ hashFiles('csharp/**/*.cs', 'csharp/**/*.csproj', 'csharp/**/*.props', 'csharp/**/*.targets', 'csharp/WKAppBot.sln') }}
          restore-keys: |
            ${{ runner.os }}-sdk-build-run-
            ${{ runner.os }}-sdk-build-

      - name: Build launcher
        if: ${{ steps.bin_cache.outputs.cache-hit != 'true' || hashFiles('bin/wkappbot.exe') == '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          dotnet publish csharp/src/WKAppBot.Launcher/WKAppBot.Launcher.csproj --configuration Release -p:SkipDeployLauncher=true -o bin

      - name: Fetch core binary (private release)
        if: ${{ hashFiles('bin/wkappbot-core.exe') == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WKAPPBOT_CORE_PAT }}
          CORE_REPO: ${{ secrets.WKAPPBOT_CORE_REPO }}
        run: |
          if (-not $env:CORE_REPO -or -not $env:GH_TOKEN) { throw 'WKAPPBOT_CORE_REPO / WKAPPBOT_CORE_PAT secrets required' }
          $tag = gh release list --repo $env:CORE_REPO --json tagName,createdAt | ConvertFrom-Json | Where-Object { $_.tagName -like 'core-*' } | Sort-Object createdAt -Descending | Select-Object -First 1 -ExpandProperty tagName
          if (-not $tag) { throw "No core-* release found in $env:CORE_REPO." }
          gh release download $tag --repo $env:CORE_REPO --pattern wkappbot-core.exe --dir bin --clobber
          if (-not (Test-Path bin/wkappbot-core.exe)) { throw 'wkappbot-core.exe not found after download' }
          Write-Host "Core fetched: $tag"

      - name: Seed bin/wkappbot.hq
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/wkappbot.hq/skills | Out-Null
          if (Test-Path wkappbot.hq) { Copy-Item wkappbot.hq/* bin/wkappbot.hq -Recurse -Force }
          if (Test-Path skills) { Copy-Item skills/* bin/wkappbot.hq/skills -Recurse -Force }

      - name: Add bin to PATH
        shell: pwsh
        run: echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify binaries
        shell: pwsh
        run: |
          if (!(Test-Path ./bin/wkappbot.exe)) { throw 'bin/wkappbot.exe missing' }
          if (!(Test-Path ./bin/wkappbot-core.exe)) { throw 'bin/wkappbot-core.exe missing' }
          $v = & ./bin/wkappbot.exe --version 2>&1 | Select-String 'wkappbot v'
          if (!$v) { throw 'wkappbot --version check failed' }
          Write-Host "Binary OK: $v"

      - name: Start Eye
        shell: pwsh
        run: |
          Start-Process wkappbot.exe -ArgumentList eye -WindowStyle Hidden
          Start-Sleep -Seconds 3
          wkappbot eye tick

      - name: Run CDP/A11y integration tests
        id: a11y_test
        shell: pwsh
        run: |
          $log = 'bin/wkappbot.hq/logs/cdp-a11y-ci.log'
          New-Item -Force -ItemType Directory -Path (Split-Path $log) | Out-Null
          if (Test-Path test/cdp-a11y-test.ps1) {
            powershell -ExecutionPolicy Bypass -File test/cdp-a11y-test.ps1 2>&1 | Tee-Object -FilePath $log
          } elseif (Test-Path test/cdp-a11y-test.cmd) {
            cmd /c test\cdp-a11y-test.cmd 2>&1 | Tee-Object -FilePath $log
          } else {
            throw 'No test runner found: test/cdp-a11y-test.ps1 or test/cdp-a11y-test.cmd'
          }
          $rc = $LASTEXITCODE
          "rc=$rc" >> $env:GITHUB_OUTPUT
          exit $rc

      - name: Post result to daily board
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const day = new Date().toISOString().slice(0, 10);
            const title = 'Daily board - ' + day;
            const found = await github.rest.search.issuesAndPullRequests({
              q: 'repo:' + owner + '/' + repo + ' is:issue in:title "' + title + '"'
            });
            if (!found.data.items.length) { console.log('No daily issue for ' + day); return; }
            const issueNumber = found.data.items[0].number;
            const rc = '${{ steps.a11y_test.outputs.rc }}';
            const ok = rc === '0';
            const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const now = new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false });
            const statusEmoji = ok ? '✅ PASS' : '❌ FAIL';

            // 1. Edit issue body marker section
            const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            let body = issue.data.body || '';
            const sectionContent = statusEmoji + '  ' + now + ' KST\n\n[Run #${{ github.run_number }}](' + runUrl + ')';
            const updated = body.replace(
              /(<!-- CDP_A11Y_START -->)[\s\S]*?(<!-- CDP_A11Y_END -->)/,
              '$1\n' + sectionContent + '\n$2'
            );
            if (updated !== body) {
              await github.rest.issues.update({ owner, repo, issue_number: issueNumber, body: updated });
            }

            // 2. Delta comment
            const comment = '## CDP/A11y 통합 테스트\n\n상태: ' + statusEmoji + '\n\n실행: ' + runUrl + '\n\n> 실패 시 로그는 Run 아티팩트에서 확인';
            await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: comment });

      - name: Run real-site a11y tests (fresh Chrome)
        if: always()
        shell: pwsh
        run: |
          Start-Process wkappbot.exe -ArgumentList eye -WindowStyle Hidden
          Start-Sleep -Seconds 2
          if (Test-Path test/cdp-a11y-real-sites.ps1) {
            powershell -ExecutionPolicy Bypass -File test/cdp-a11y-real-sites.ps1 2>&1 | Tee-Object -FilePath bin/wkappbot.hq/logs/real-sites-ci.log
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cdp-a11y-fail-${{ github.run_number }}
          path: bin/wkappbot.hq/logs/
          retention-days: 3

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[AUTO] CDP/A11y integration test failed - ' + new Date().toISOString().slice(0,10),
              body: 'Run: ' + context.runId + '\nLogs attached as artifact on the failed run.\n\nTriage:\n- Check logs for FAIL/ERROR lines\n- wkappbot skill search cdp-a11y\n- wkcdp-mon.ps1 locally',
              labels: ['bug', 'cdp-a11y'],
            });

name: webvm-x64

# Measurement build (owner 2026-11-01: "run a 64-bit WebVM test, I want to see how slow it is"). Converts an
# x86_64 Alpine container (python3, git) to a browser bundle with container2wasm (c2w --to-js: QEMU compiled to wasm)
# and publishes it as webvm/x64/ beside the target repo's 32-bit v86 WebVM page. The page file comes from the target
# repo (webvm/x64/index.html). The target repo is found by sha256 prefix and never named, as in harness-pages-relay.yml.
# Post-boot snapshot (2026-11-02): the c2w assets are patched at build time with the target repo's
# webvm/x64-build/c2w-webvm.patch, so the VM init unmounts its two 9p shares after reading its info file and
# QEMU accepts "migrate". The VM CPU is qemu64 plus SSSE3, SSE4.1, SSE4.2, POPCNT, CX16 and PCLMUL, with no AES and no
# AVX: every model with AES (max, Haswell, Westmere) crashed c2w's Go init under wasm TCG (runs 41414477139 and
# 41438211832), and the agy (Antigravity CLI) static musl binary refuses plain qemu64 for lacking SSE4.2 and PCLMUL. claude is
# pinned to 2.1.112, the last release that runs as Node cli.js (2.1.113+ is an AVX2 native binary). The bundle is then booted once in headless Chromium, python3 and git are warmed, and the
# migration file is shipped as the manifest's "snapshot" (gzip parts); the page resumes from it instead of booting.
# Popcnt fix (2026-11-02): +popcnt killed the guest Go init and +sse4.2 hung it until the target repo's c2w patch set
# ktock/qemu-wasm's TCG_TARGET_HAS_ctpop_i32/i64 to 0 (generic popcount helper); run 41469470928 booted with them and
# agy --version printed 1.4.12 (rc 0) on the published page.
# Agent CLIs (2026-11-02): the image carries Node.js, npm, pip, curl, gh, the claude-code, codex and gemini-cli npm
# packages and the official agy release (sha512-checked) with no key or config; their versions are published as cli-versions.json. The VM has 512 MB RAM for them.
# Minimal harness (owner 2026-11-02, road A: the VM cannot clone the target repo): the target repo's
# tools/wk-harness-min-copy.sh copies only the files its measured manifest lists, drops personal docs and every file
# matching the private-term scrub list, and fails the build unless its scrub gate prints hits=0. PowerShell 7.6.9
# (official linux-musl-x64 tarball, sha256-checked) runs the hooks; .NET 10 still targets the x86-64-v1 CPU baseline.
# AI bridge (owner 2026-11-04: intelligence tools answer at once): the real claude CLI needed 411 s under wasm TCG
# before its first row, so claude/codex/gemini/grok/agy resolve first to /usr/local/sbin/wk-ai (the target repo's
# webvm/x64-build/wk-ai.sh), which the page answers with the browser's own fetch; the real CLIs stay as <name>-vm.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - .github/workflows/webvm-x64.yml

permissions:
  contents: read

# Shares the relay's lock: every one of these jobs pushes the same gh-pages branch.
concurrency:
  group: harness-pages-relay
  cancel-in-progress: false

jobs:
  x64:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TARGET_HASH: 23ade98d428c8527
      T1: ${{ secrets.GH_LICENSE_TOKEN }}
      T2: ${{ secrets.WKAPPBOT_PAT }}
      T3: ${{ secrets.WKAPPBOT_CORE_PAT }}
      # container2wasm main at the commit the init patch was written against; bump both together.
      C2W_ASSETS_REV: 3f0f9be4d5ee201ea1a12f9700e6e3ef52c8b345
    steps:
      - name: Find the target repo and a token that can reach it
        run: |
          set -u
          for t in "$T1" "$T2" "$T3"; do
            [ -n "$t" ] || continue
            names=$(GH_TOKEN="$t" gh repo list kiexpert --visibility private --limit 300 --json nameWithOwner -q '.[].nameWithOwner' 2>/dev/null || true)
            for n in $names; do
              if [ "$(printf %s "$n" | sha256sum | cut -c1-16)" = "$TARGET_HASH" ]; then
                echo "::add-mask::$n"
                echo "::add-mask::${n#*/}"
                echo "::add-mask::$t"
                { echo "REPO=$n"; echo "TOK=$t"; } >> "$GITHUB_ENV"
                echo "target found"
                exit 0
              fi
            done
          done
          echo "no token reaches the target repo"; exit 1

      - name: Install container2wasm (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # ktock/container2wasm lists no releases to the API any more (runs 41357907275, 41358171310: release not found),
          # so try the project's org repo first, then build c2w from the Go module proxy.
          tag=""
          for r in container2wasm/container2wasm ktock/container2wasm; do
            tag=$(gh release list -R "$r" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
            [ -n "$tag" ] || continue
            asset=$(gh release view "$tag" -R "$r" --json assets -q '.assets[].name' | grep -E '^container2wasm-.*linux-amd64\.tar\.gz$' | head -1)
            [ -n "$asset" ] || { tag=""; continue; }
            gh release download "$tag" -R "$r" -p "$asset" -O c2w.tgz
            mkdir -p c2wbin && tar -xzf c2w.tgz -C c2wbin
            sudo install "$(find c2wbin -name c2w -type f | head -1)" /usr/local/bin/c2w
            echo "c2w from release $r $tag"; break
          done
          if [ -z "$tag" ]; then
            GOBIN=/tmp/gobin go install github.com/ktock/container2wasm/cmd/c2w@latest
            sudo install /tmp/gobin/c2w /usr/local/bin/c2w
            ver=$(go version -m /tmp/gobin/c2w | awk '$1=="mod"{print $3; exit}')
            tag="go-$ver"
            echo "c2w from the Go module proxy $tag"
          fi
          c2w --version
          echo "C2W_TAG=$tag" >> "$GITHUB_ENV"

      - name: Fetch the page source and patch the c2w build assets
        run: |
          set -eu
          git clone -q --depth 1 "https://x-access-token:${TOK}@github.com/${REPO}.git" src
          git clone -q https://github.com/ktock/container2wasm c2w-assets
          git -C c2w-assets checkout -q "$C2W_ASSETS_REV"
          git -C c2w-assets apply --verbose ../src/webvm/x64-build/c2w-webvm.patch
          git -C c2w-assets diff --stat
          # Road A: the pruned harness copy; the script exits 1 unless the scrub gate prints hits=0.
          bash src/tools/wk-harness-min-copy.sh "$PWD/src" "$PWD/ctx/harness" src/tools/wk-harness-min-manifest.txt
          du -sh ctx/harness
          cp src/webvm/x64-build/wk-ai.sh ctx/wk-ai

      - name: Build the x86_64 image and convert it to a browser bundle
        run: |
          set -eu
          # agy: the official installer's linux_amd64_musl manifest entry, pinned with its sha512.
          AGY_URL=https://storage.googleapis.com/antigravity-public/antigravity-cli/1.4.12-4768735748292608/linux-x64-musl/cli_linux_x64_musl.tar.gz
          AGY_SHA512=60a2705b9d0446a88fe2a685a044e0f9ec65f9742492d96e6fa3a87c9c477d3fddd9c4d7f22bca7bdb2a99d6dd5833de9d6e690eb8fd9e77ebe25794fdb4555a
          PWSH_URL=https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/powershell-7.6.9-linux-musl-x64.tar.gz
          PWSH_SHA256=f83df6705edaae07db970dcc6c34ad6583d33a2f6199f1b55cdc5354fbb9001c
          # Coding-agent CLIs baked in (owner 2026-11-02); no key, token or config is written into the image.
          # claude-code@2.1.112: the newest release that is Node cli.js; later ones need AVX2, which this VM cannot offer.
          printf '%s\n' \
            'FROM alpine:3.21' \
            'RUN apk add --no-cache python3 py3-pip git curl ca-certificates nodejs npm github-cli bash' \
            'RUN npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.112 @openai/codex @google/gemini-cli && npm cache clean --force' \
            "RUN curl -fsSL -o /tmp/agy.tgz $AGY_URL && echo '$AGY_SHA512  /tmp/agy.tgz' | sha512sum -c - && tar -xzf /tmp/agy.tgz -C /usr/local/bin antigravity && mv /usr/local/bin/antigravity /usr/local/bin/agy && rm /tmp/agy.tgz" \
            'RUN apk add --no-cache icu-libs libintl krb5-libs libstdc++ gcompat' \
            "RUN curl -fsSL -o /tmp/pwsh.tgz $PWSH_URL && echo '$PWSH_SHA256  /tmp/pwsh.tgz' | sha256sum -c - && mkdir -p /opt/microsoft/powershell/7 && tar -xzf /tmp/pwsh.tgz -C /opt/microsoft/powershell/7 && chmod +x /opt/microsoft/powershell/7/pwsh && ln -s /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh && rm /tmp/pwsh.tgz" \
            'COPY harness /opt/wk-harness' \
            'COPY wk-ai /usr/local/sbin/wk-ai' \
            'RUN chmod 755 /usr/local/sbin/wk-ai && for c in claude codex gemini grok agy; do ln -sf wk-ai /usr/local/sbin/$c; if [ -e /usr/local/bin/$c ]; then ln -sf /usr/local/bin/$c /usr/local/bin/$c-vm; fi; done; ls -l /usr/local/sbin' \
            'RUN cd /opt/wk-harness && { bash install-linux.sh > /opt/wk-harness-install.log 2>&1; rc=$?; echo install-linux rc=$rc; tail -8 /opt/wk-harness-install.log; exit $rc; }' \
            'RUN rm -rf /usr/local/lib/node_modules/@openai/codex-linux-x64/vendor/*/codex-resources/voice; du -sh /usr/local/lib/node_modules/* /usr/local/lib/node_modules/@*/* 2>/dev/null | sort -rh | head -15' \
            | docker build --platform linux/amd64 -t wk-x64 -f - ctx
          docker run --rm --platform linux/amd64 wk-x64 sh -c '
            v() { out=$("$@" 2>&1 | head -1); printf "\"%s\":\"%s\"," "$1" "$(printf %s "$out" | tr -d "\"\\")"; }
            printf "{"; v uname -m; v node --version; v npm --version; v python3 --version; v pip3 --version; v git --version;
            v curl --version; v gh --version; v claude --version; v codex --version; v gemini --version; v pwsh --version; v agy --version; printf "\"ok\":true}"' > cli-versions.json
          cat cli-versions.json
          # The harness QA inside the image (native run on the runner; the in-guest run is measured on the published page).
          docker run --rm --platform linux/amd64 wk-x64 sh -c 'cd /opt/wk-harness && time pwsh -NoProfile -c "\$PSVersionTable.PSVersion.ToString()"; bash tools/wk-harness-qa.sh' || true
          python3 -c 'import json; print(json.dumps(json.load(open("cli-versions.json")), indent=1))'
          docker image ls wk-x64
          mkdir -p out
          start=$(date +%s)
          # Dockerfile and assets both come from the patched checkout, so the init that lands in the VM is the patched one.
          # SOURCE_REPO_VERSION=main stays for any stage that still clones upstream itself.
          # Upstream clones inside the c2w Dockerfile can drop (run 41399033181: pixman from gitlab, curl 92); buildx keeps
          # the finished stages cached, so a retry resumes where the clone failed.
          for try in 1 2 3; do
            c2w --dockerfile c2w-assets/Dockerfile --assets c2w-assets --build-arg SOURCE_REPO_VERSION=main \
              --build-arg VM_MEMORY_SIZE_MB=512 --to-js wk-x64 out/ && break
            [ "$try" = 3 ] && { echo "c2w failed 3 times"; exit 1; }
            echo "c2w try $try failed; retrying in 30 s"; sleep 30
          done
          echo "c2w --to-js took $(( $(date +%s) - start )) s"
          ls -la out
          du -sh out

      - name: Add the page and the COOP/COEP service worker
        run: |
          set -eu
          cp src/webvm/x64/index.html out/index.html
          cp cli-versions.json out/cli-versions.json
          npm pack -s coi-serviceworker@0.1.7 >/dev/null
          tar -xzf coi-serviceworker-0.1.7.tgz
          cp package/coi-serviceworker.js out/
          # GitHub refuses files over 100 MB and the QEMU .data is ~130 MB (run 41359318459): split it; the page joins the parts.
          # The page gunzips with the browser's DecompressionStream, so ship one gzip -9 stream cut in parts
          # (owner 2026-11-02: compress it; measured 129.7 MB raw -> 51.8 MB gzip). The hash keys the page's Cache Storage.
          # Lazy disk: cut /pack/rootfs.bin out of the package into out/disk/ (1 MB gzip chunks) so a cold visit fetches
          # only the blocks QEMU reads (the CLI image's disk is 1,110 MiB; preloading it cost a cold visit ~458 MB).
          python3 -I src/webvm/x64-build/split-disk.py out
          f=$(ls out/*.data | head -1)
          raw=$(stat -c %s "$f")
          gzip -9 -c "$f" > "$f.gz" && rm "$f"
          hash=$(sha256sum "$f.gz" | cut -c1-16)
          split -b 45M -d -a 2 "$f.gz" "$f.gz.part" && rm "$f.gz"
          parts=$(cd out && ls -1 *.data.gz.part* | sed 's/.*/"&"/' | paste -sd, -)
          printf '{"c2w":"%s","assets":"%s+c2w-webvm.patch","disk":"disk/","image":"alpine:3.21 + python3 pip git curl node npm gh + claude-code codex gemini-cli agy + pwsh 7.6.9 + harness (min) + wk-ai bridge","cpu":"qemu64+ssse3+sse4.1+sse4.2+popcnt+cx16+pclmulqdq","memMB":512,"encoding":"gzip","raw":%s,"hash":"%s","parts":[%s],"built":"%s"}\n' "$C2W_TAG" "$C2W_ASSETS_REV" "$raw" "$hash" "$parts" "$(date -u +%FT%TZ)" > out/manifest.json
          cat out/manifest.json

      - name: Take the post-boot snapshot in headless Chromium
        run: |
          set -eu
          npm i -s --no-save --prefix snaptool playwright@1.48.2 >/dev/null
          npx --prefix snaptool playwright install --with-deps chromium >/dev/null
          start=$(date +%s)
          NODE_PATH="$PWD/snaptool/node_modules" node src/webvm/x64-build/snap-ci.js out snap.state
          echo "snapshot took $(( $(date +%s) - start )) s"
          raw=$(stat -c %s snap.state)
          gzip -9 -c snap.state > out/snap.state.gz && rm snap.state
          hash=$(sha256sum out/snap.state.gz | cut -c1-16)
          split -b 45M -d -a 2 out/snap.state.gz out/snap.state.gz.part && rm out/snap.state.gz
          parts=$(cd out && ls -1 snap.state.gz.part* | sed 's/.*/"&"/' | paste -sd, -)
          python3 -c 'import json,os,sys; m=json.load(open("out/manifest.json")); m["snapshot"]={"encoding":"gzip","raw":int(sys.argv[1]),"hash":sys.argv[2],"parts":json.loads("["+sys.argv[3]+"]"),"warm":"python3 git"}; m["packed"]=sum(os.path.getsize("out/"+p) for p in m["parts"]+m["snapshot"]["parts"]); json.dump(m,open("out/manifest.json","w"))' "$raw" "$hash" "$parts"
          cat out/manifest.json
          ls -la out
          find out -type f -size +95M -print -exec false {} + || { echo "a file is over the 100 MB push limit"; exit 1; }
          echo "disk: $(ls out/disk | wc -l) files, $(du -sh out/disk | cut -f1)"; cat out/disk/index.json | head -c 300; echo

      - name: Publish as webvm/x64 beside the page
        run: |
          set -eu
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${TOK}@github.com/${REPO}.git" pages
          rm -rf pages/webvm/x64
          mkdir -p pages/webvm
          cp -r out pages/webvm/x64
          cd pages
          git config user.name "pages-relay"
          git config user.email "pages-relay@users.noreply.github.com"
          git add -A
          git commit -q -m "webvm x64 $(date -u +%FT%TZ) c2w $C2W_TAG snapshot" || { echo "x64 unchanged"; exit 0; }
          git push -q "https://x-access-token:${TOK}@github.com/${REPO}.git" gh-pages
          echo "x64 published"

      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ env.TOK }}
        run: |
          set -u
          gh api -X POST "repos/${REPO}/pages/builds" >/dev/null 2>&1 || true
          for i in $(seq 1 40); do
            s=$(gh api "repos/${REPO}/pages/builds/latest" -q .status 2>/dev/null || echo unknown)
            echo "build status: $s"
            [ "$s" = "built" ] && exit 0
            [ "$s" = "errored" ] && exit 1
            sleep 15
          done
          echo "build did not finish in 10 minutes"; exit 1
